<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تفاصيل المود — ModsLib</title>
<link rel="icon" href="/fav.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header-mount"></div>

<main class="container">
  <div id="page-body">
    <div class="state-message"><div class="spinner"></div></div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="/stats.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  const pageBody = document.getElementById('page-body');

  ModsLib.renderHeader('#header-mount');
  ModsLib.renderFooter('#footer-mount');
  ModsLib.ensureFavicon();
  ModsLib.injectGlobalAdScripts();

  function adSlotHtmlTarget() {
    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.justifyContent = 'center';
    wrap.appendChild(ModsLib.makeAdSlotWrap());
    return wrap.outerHTML;
  }

  function renderNotFound() {
    pageBody.innerHTML = `
      <div class="error-page">
        <p class="error-page__code">404</p>
        <p class="error-page__msg">المود غير موجود</p>
        <a class="btn" href="/index.html">العودة إلى الصفحة الرئيسية</a>
      </div>
    `;
  }

  function renderMod(mod) {
    const title = ModsLib.escapeHtml(mod.title || 'بدون عنوان');
    const desc = ModsLib.escapeHtml(mod.description || 'لا يوجد وصف.');
    const img = ModsLib.escapeHtml(mod.image || '');

    pageBody.innerHTML = `
      <div id="ad-slot-1"></div>
      <article class="detail-card">
        <div class="detail-card__media">
          <img src="${img}" alt="${title}" onerror="this.style.opacity=0.15">
        </div>
        <div class="detail-card__body">
          <p class="detail-card__eyebrow">تفاصيل المود</p>
          <h1 class="detail-card__title">${title}</h1>
          <p class="detail-card__desc">${desc}</p>
          <div id="ad-slot-2"></div>
          <div class="detail-card__actions">
            <a class="btn" id="goto-download" href="#">انتقال لصفحة التحميل</a>
          </div>
        </div>
      </article>
      <div id="ad-slot-3"></div>
    `;

    document.getElementById('ad-slot-1').appendChild(ModsLib.makeAdSlotWrap());
    document.getElementById('ad-slot-2').appendChild(ModsLib.makeAdSlotWrap());
    document.getElementById('ad-slot-3').appendChild(ModsLib.makeAdSlotWrap());

    // تسجيل السماح لهذا الـ ID تحديداً قبل الانتقال لصفحة التحميل
    ModsLib.markAllowed(mod.id);

    const gotoBtn = document.getElementById('goto-download');
    gotoBtn.href = ModsLib.modUrl(mod.id);
  }

  async function init() {
    const id = ModsLib.getValidId();
    if (id === null) {
      renderNotFound();
      return;
    }
    try {
      const mods = await ModsLib.fetchMods();
      const mod = mods.find(m => Number(m.id) === id);
      if (!mod) {
        renderNotFound();
        return;
      }
      renderMod(mod);
    } catch (err) {
      pageBody.innerHTML = `
        <div class="error-page">
          <p class="error-page__msg">${ModsLib.escapeHtml(err.message || 'حدث خطأ غير متوقع.')}</p>
          <a class="btn" href="/index.html">العودة إلى الصفحة الرئيسية</a>
        </div>
      `;
    }
  }

  init();
})();
</script>

</body>
</html>
