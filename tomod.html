<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (id) {
                window.location.replace(
                    'https://attdes.online/modslib/mod.html?id=' + encodeURIComponent(id)
                );
            } else {
                document.addEventListener('DOMContentLoaded', function () {
                    document.body.innerHTML = `
                        <div style="
                            font-family: Arial, sans-serif;
                            text-align: center;
                            padding: 50px 20px;
                        ">
                            <h2>Invalid Link</h2>
                            <p>No mod ID was provided.</p>
                        </div>
                    `;
                });
            }
        })();
    </script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }
    </style>
</head>

<body>
</body>
</html>
