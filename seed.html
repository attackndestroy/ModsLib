  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --accent: #facc15;
      --accent-hover: #eab308;
      --text: #f8fafc;
      --border: #27272a;
      --muted: #a1a1aa;
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    /* الهيدر */
    .brand {
      color: var(--accent);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .sub-brand {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 25px;
    }

    /* قسم التحفيز والأسهم */
    .hero-scroll {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .hero-scroll p {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 15px;
    }

    .arrows {
      font-size: 1.5rem;
      color: var(--accent);
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(8px); }
      60% { transform: translateY(4px); }
    }

    /* حاوية الإعلانات */
    .ads-section {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    .ad-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* قسم عرض الـ Seed وزر النسخ */
    .seed-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin: 30px 0;
    }

    .seed-box {
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 15px;
      user-select: none; /* يمنع التحديد اليدوي المباشر تماماً */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      word-break: break-all;
    }

    .btn-copy {
      display: inline-block;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      font-weight: 900;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
      transition: background 0.2s, transform 0.1s;
      opacity: 0.5;
      pointer-events: none;
    }

    .btn-copy.active {
      opacity: 1;
      pointer-events: auto;
    }

    .btn-copy:hover { background: var(--accent-hover); }
    .btn-copy:active { transform: scale(0.98); }

    /* شبكة السوشيال ميديا */
    .social-box {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin: 20px 0;
    }

    .social-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      transition: border-color 0.2s;
    }

    .social-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* الكوبيرايت */
    footer {
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 15px;
      border-top: 1px solid var(--border);
      padding-top: 15px;
      width: 100%;
    }

    .status-msg {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
  </style>
</head>

<script>
  const BIN_ID = '6a750a44f5f4af5e29f4e536';
  const API_KEY = '$2a$10$nyIf8yTjegFgOUarJ0u2Mus7bxyzv2UOR/U476rgu8khnPyPBA.a2';

  function decodeBase64(str) {
    try {
      return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    } catch (e) {
      return str;
    }
  }

  const urlParams = new URLSearchParams(window.location.search);
  const seedId = urlParams.get('id');
  const msgEl = document.getElementById('statusMsg');
  const seedBox = document.getElementById('seedBox');
  const copyBtn = document.getElementById('copyBtn');

  let rawSeedValue = '';

  if (!seedId) {
    msgEl.innerText = '⚠️ خطأ: لم يتم تحديد رقم الـ ID في الرابط!';
    msgEl.style.color = '#f87171';
  } else {
    fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': API_KEY }
    })
      .then(res => res.json())
      .then(json => {
        const data = json.record || {};
        if (data && data[seedId]) {
          rawSeedValue = decodeBase64(data[seedId]);
          seedBox.innerText = rawSeedValue;
          copyBtn.classList.add('active');
          msgEl.innerText = '✅ كود الـ Seed جاهز للنسخ أدناه';
          msgEl.style.color = '#4ade80';
        } else {
          msgEl.innerText = '❌ عذراً، هذا الـ Seed غير موجود.';
          msgEl.style.color = '#f87171';
        }
      })
      .catch(err => {
        msgEl.innerText = '❌ فشل الاتصال بقاعدة البيانات.';
        msgEl.style.color = '#f87171';
      });
  }

  function copySeed() {
    if (!rawSeedValue) return;
    navigator.clipboard.writeText(rawSeedValue).then(() => {
      copyBtn.innerText = 'تم النسخ بنجاح! ✓';
      copyBtn.style.background = '#4ade80';
      copyBtn.style.color = '#000';
      setTimeout(() => {
        copyBtn.innerText = 'نسخ Seed العالم 📋';
        copyBtn.style.background = 'var(--accent)';
        copyBtn.style.color = '#000';
      }, 2000);
    });
  }
</script>
