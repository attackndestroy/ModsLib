<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{t}} - مكتبة المودات</title>

  <!-- خط Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg:        #0a0a0a;
      --bg-2:      #111111;
      --bg-3:      #181818;
      --border:    #262626;
      --text:      #e8e8e8;
      --text-dim:  #8a8a8a;
      --accent:    #ffcc00;
      --accent-2:  #ffd633;
      --accent-dk: #cc9900;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      min-height: 100vh;
    }

    /* ===== الهيدر ===== */
    .site-header {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .site-header h1 {
      font-size: 1.5em;
      font-weight: 900;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .site-header .subtitle {
      font-size: 0.85em;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ===== الحاوية الرئيسية ===== */
    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    /* ===== صورة المود ===== */
    .mod-image {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
      margin: 20px 0;
    }

    /* ===== عنوان المود ===== */
    .mod-title {
      font-size: 2em;
      font-weight: 900;
      color: #ffffff;
      margin: 25px 0 15px;
      line-height: 1.4;
    }

    /* ===== وصف المود ===== */
    .mod-desc {
      font-size: 1.05em;
      color: var(--text);
      background: var(--bg-2);
      padding: 20px 22px;
      border-right: 4px solid var(--accent);
      border-radius: 8px;
      margin-bottom: 25px;
    }

    /* ===== حاوية الإعلانات ===== */
    .ad-box {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 25px 0;
      min-height: 60px;
      overflow: hidden;
    }

    /* ===== قسم الفيديو ===== */
    .video-section {
      margin: 35px 0;
      padding: 25px;
      background: var(--bg-2);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .video-section h2 {
      font-size: 1.15em;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 18px;
      text-align: center;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }

    .video-wrapper video {
      width: 100%;
      height: auto;
      display: block;
    }

    /* ===== مجموعة الأزرار ===== */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin: 30px 0 20px;
    }

    /* زر رئيسي — تحميل المود (نص أسود) */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #000000 !important;
      padding: 16px 50px;
      border-radius: 10px;
      font-size: 1.2em;
      font-weight: 900;
      font-family: 'Cairo', sans-serif;
      text-decoration: none;
      width: 100%;
      max-width: 420px;
      border: none;
      box-shadow: 0 6px 0 var(--accent-dk);
      transition: none;
      cursor: pointer;
    }

    .btn-primary * {
      color: #000000 !important;
    }

    /* أزرار ثانوية */
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-3);
      color: var(--accent);
      padding: 13px 32px;
      border-radius: 10px;
      font-size: 1em;
      font-weight: 700;
      font-family: 'Cairo', sans-serif;
      text-decoration: none;
      border: 1.5px solid var(--accent);
      transition: none;
      flex: 1 1 200px;
      max-width: 280px;
      cursor: pointer;
    }

    /* ===== الفوتر ===== */
    .site-footer {
      background: var(--bg-2);
      border-top: 2px solid var(--accent);
      padding: 30px 20px;
      text-align: center;
      margin-top: 40px;
    }

    .site-footer .rights {
      font-size: 0.95em;
      color: var(--text-dim);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .site-footer .brand {
      font-size: 1.3em;
      font-weight: 900;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 2px;
      font-family: 'Cairo', sans-serif;
    }

    /* ===== استجابة الجوال ===== */
    @media (max-width: 600px) {
      .mod-title { font-size: 1.5em; }
      .page { padding: 20px 15px 40px; }
      .btn-primary { font-size: 1.05em; padding: 14px 30px; }
      .btn-secondary { flex: 1 1 100%; max-width: 100%; }
    }
  </style>

  <!-- popunder -->
