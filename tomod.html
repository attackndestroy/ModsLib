<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>ATT/DES — تفاصيل المود</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Popup -->
    <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js">
    </script>
    <!-- Analytics -->
    <script src="https://modslib.attdes.online/analytics.js">
    </script>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <a href="index.html">
            <img src="https://attdes.online/header.png" alt="ATT/DES Logo" class="header-logo" />
        </a>
    </header>

    <!-- ===== NATIVE BANNER (مرة واحدة) ===== -->
    <div class="native-banner-wrapper">
        <script async="async" data-cfasync="false" src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js">
        </script>
        <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
    </div>

    <!-- ===== SOCIAL BAR ===== -->
    <div class="social-bar-wrapper">
        <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js">
        </script>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container tomod-container">

        <!-- تفاصيل المود -->
        <div id="mod-detail" class="mod-detail">
            <!-- يتم ملؤها بواسطة JavaScript -->
        </div>

        <!-- Banner 320x50 (مرة واحدة في مكان مناسب) -->
        <div class="banner-320x50 tomod-banner">
            <script>
                atOptions = {
                    'key': '28d1f1f838ea883f1f7fc0d4733ebba6',
                    'format': 'iframe',
                    'height': 50,
                    'width': 320,
                    'params': {}
                };
            </script>
            <script src="https://www.highrevenueformat.com/28d1f1f838ea883f1f7fc0d4733ebba6/invoke.js">
            </script>
        </div>

        <!-- حالة التحميل / الأخطاء -->
        <div id="detail-status" class="detail-status"></div>

    </main>

    <script>
        (function() {
            'use strict';

            // ----- helpers -----
            function getUrlParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // ----- read ID -----
            const id = getUrlParam('id');
            const detailEl = document.getElementById('mod-detail');
            const statusEl = document.getElementById('detail-status');

            if (!id) {
                // ID مفقود
                showError('لم يتم تحديد معرف المود.', 'الرجاء استخدام رابط صحيح.');
                return;
            }

            // ----- load data -----
            function showError(title, message) {
                detailEl.innerHTML = '';
                statusEl.innerHTML = `
                    <div class="error-box">
                        <h2>${escapeHtml(title)}</h2>
                        <p>${escapeHtml(message)}</p>
                        <a href="index.html" class="mod-card-btn">العودة للرئيسية</a>
                    </div>
                `;
            }

            function renderDetail(record) {
                // record should contain image_url, title, description
                const img = record.image_url || '';
                const title = record.title || 'بدون عنوان';
                const desc = record.description || 'لا يوجد وصف لهذا المود.';

                detailEl.innerHTML = `
                    <div class="mod-detail-image">
                        ${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(title)}" />` : '<div class="mod-detail-image-placeholder">لا توجد صورة</div>'}
                    </div>
                    <h1 class="mod-detail-title">${escapeHtml(title)}</h1>
                    <div class="mod-detail-description">${escapeHtml(desc).replace(/\n/g, '<br>')}</div>
                    <a href="mod.html?id=${encodeURIComponent(id)}" class="mod-card-btn download-btn">تحميل المود</a>
                `;

                // ----- إنشاء Access State في sessionStorage -----
                try {
                    sessionStorage.setItem('download_access_' + id, 'true');
                } catch (e) {
                    // تجاهل أخطاء التخزين
                }

                statusEl.innerHTML = ''; // مسح رسائل الخطأ
            }

            function fetchData() {
                statusEl.innerHTML = 'جاري تحميل البيانات…';
                fetch('mods.json')
                    .then(function(res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function(data) {
                        if (!Array.isArray(data) || data.length === 0) {
                            throw new Error('البيانات فارغة أو غير صالحة.');
                        }

                        // البحث عن سجل type="t" مع id مطابق
                        const keyType = btoa('type');
                        const keyId = btoa('id');
                        const keyImg = btoa('image_url');
                        const keyTitle = btoa('title');
                        const keyDesc = btoa('description');

                        let found = null;
                        for (var i = 0; i < data.length; i++) {
                            var rec = data[i];
                            if (rec[keyType] === 't' && String(rec[keyId]) === String(id)) {
                                found = {
                                    image_url: rec[keyImg] || '',
                                    title: rec[keyTitle] || '',
                                    description: rec[keyDesc] || ''
                                };
                                break;
                            }
                        }

                        if (found) {
                            renderDetail(found);
                        } else {
                            showError('المود غير موجود',
                                'لم نعثر على مود بالمعرف المطلوب. تأكد من الرابط أو عد للرئيسية.');
                        }
                    })
                    .catch(function(err) {
                        console.error('Error loading mods.json:', err);
                        showError('خطأ في التحميل',
                            'تعذر تحميل بيانات المود. تأكد من اتصالك بالإنترنت ووجود ملف mods.json.');
                    });
            }

            fetchData();

        })();
    </script>

</body>
</html>
