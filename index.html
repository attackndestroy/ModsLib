<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ATT/DES — Minecraft Mods</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
}

.site-header{
    width:100%;
    padding:18px 12px;
    text-align:center;
    background:#111;
    border-bottom:1px solid #222;
}

.header-logo{
    max-width:280px;
    width:100%;
    height:auto;
    display:block;
    margin:auto;
}

.native-banner-wrapper,
.social-bar-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:12px 0;
    overflow:hidden;
}

.container{
    width:min(900px,94%);
    margin:0 auto;
    padding-bottom:30px;
}

.feed-controls{
    display:flex;
    gap:8px;
    margin:20px 0;
}

.feed-controls button{
    flex:1;
    border:1px solid #333;
    background:#171717;
    color:#aaa;
    padding:11px;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
}

.feed-controls button.active{
    background:#fff;
    color:#000;
    border-color:#fff;
}

.mod-card{
    background:#151515;
    border:1px solid #252525;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:10px;
}

.mod-card-image{
    width:100%;
    min-height:120px;
    background:#101010;
    display:flex;
    justify-content:center;
    align-items:center;
}

.mod-card-image img{
    width:100%;
    height:auto;
    display:block;
}

.mod-card-image-placeholder{
    width:100%;
    min-height:120px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#666;
    font-size:14px;
}

.mod-card-title{
    margin:0;
    padding:15px 12px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.mod-card-btn{
    display:block;
    margin:0 12px 12px;
    padding:11px;
    text-align:center;
    text-decoration:none;
    background:#fff;
    color:#000;
    border-radius:7px;
    font-weight:bold;
}

.mod-card-btn:active{
    transform:scale(.98);
}

.banner-between{
    width:100%;
    min-height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:12px 0;
    overflow:hidden;
}

.load-more-wrap{
    text-align:center;
    margin:22px 0;
}

#loadMore{
    border:1px solid #333;
    background:#171717;
    color:#fff;
    padding:12px 25px;
    border-radius:7px;
    cursor:pointer;
}

#loadMore:hover{
    background:#222;
}

#feed-status{
    text-align:center;
    color:#777;
    padding:15px;
    font-size:14px;
}
</style>

<!-- Popup -->
<script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>

<!-- Analytics -->
<script src="https://modslib.attdes.online/analytics.js"></script>

</head>

<body>

<header class="site-header">
    <a href="index.html">
        <img
            src="https://attdes.online/header.png"
            alt="ATT/DES"
            class="header-logo"
        >
    </a>
</header>

<!-- Native Banner -->
<div class="native-banner-wrapper">
    <script
        async
        data-cfasync="false"
        src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js">
    </script>

    <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
</div>

<!-- Social Bar -->
<div class="social-bar-wrapper">
    <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
</div>

<main class="container">

    <div class="feed-controls">
        <button id="newest" class="active">أحدث</button>
        <button id="oldest">أقدم</button>
    </div>

    <div id="feed"></div>

    <div class="load-more-wrap">
        <button id="loadMore">إظهار المزيد</button>
    </div>

    <div id="feed-status">
        جاري تحميل المودات...
    </div>

</main>

<script>
(function(){

"use strict";

const feed = document.getElementById("feed");
const status = document.getElementById("feed-status");
const loadMore = document.getElementById("loadMore");

const newestBtn = document.getElementById("newest");
const oldestBtn = document.getElementById("oldest");

let mods = [];
let visibleCount = 5;
let sortMode = "newest";

function decodeBase64(value){

    try{
        return atob(value);
    }catch(e){
        return "#";
    }

}

function loadMods(){

    fetch("/mods.json",{
        cache:"no-cache"
    })

    .then(function(response){

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        return response.json();

    })

    .then(function(data){

        if(!data || typeof data !== "object"){
            throw new Error("Invalid mods.json");
        }

        mods = Object.values(data).filter(function(mod){

            return mod &&
                   typeof mod === "object" &&
                   mod.id !== undefined;

        });

        if(!mods.length){
            throw new Error("No mods");
        }

        render();

    })

    .catch(function(error){

        console.error("mods.json:",error);

        feed.innerHTML = "";

        status.textContent =
            "تعذر تحميل المودات.";

        loadMore.style.display = "none";

    });

}

function getSortedMods(){

    const list = mods.slice();

    list.sort(function(a,b){

        const aId = Number(a.id);
        const bId = Number(b.id);

        if(sortMode === "newest"){
            return bId - aId;
        }

        return aId - bId;

    });

    return list;

}

function createBanner(){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "banner-between";

    const banner =
        document.createElement("div");

    const script1 =
        document.createElement("script");

    script1.textContent = `
        atOptions = {
            'key' : '28d1f1f838ea883f1f7fc0d4733ebba6',
            'format' : 'iframe',
            'height' : 50,
            'width' : 320,
            'params' : {}
        };
    `;

    const script2 =
        document.createElement("script");

    script2.src =
        "https://www.highrevenueformat.com/28d1f1f838ea883f1f7fc0d4733ebba6/invoke.js";

    banner.appendChild(script1);
    banner.appendChild(script2);

    wrapper.appendChild(banner);

    return wrapper;

}

function render(){

    feed.innerHTML = "";

    const list = getSortedMods();

    const visible =
        list.slice(0,visibleCount);

    visible.forEach(function(mod){

        const card =
            document.createElement("article");

        card.className = "mod-card";

        const imageBox =
            document.createElement("div");

        imageBox.className =
            "mod-card-image";

        if(mod.image){

            const image =
                document.createElement("img");

            image.src = mod.image;
            image.alt = mod.title || "";
            image.loading = "lazy";

            imageBox.appendChild(image);

        }else{

            const placeholder =
                document.createElement("div");

            placeholder.className =
                "mod-card-image-placeholder";

            placeholder.textContent =
                "ATT/DES";

            imageBox.appendChild(placeholder);

        }

        const title =
            document.createElement("h2");

        title.className =
            "mod-card-title";

        title.textContent =
            mod.title || "بدون عنوان";

        const button =
            document.createElement("a");

        button.className =
            "mod-card-btn";

        button.href =
            "tomod.html?id=" +
            encodeURIComponent(mod.id);

        button.textContent =
            "عرض التفاصيل";

        card.appendChild(imageBox);
        card.appendChild(title);
        card.appendChild(button);

        feed.appendChild(card);

        // بانر بعد كل مود
        feed.appendChild(createBanner());

    });

    status.textContent = "";

    if(visibleCount < list.length){

        loadMore.style.display =
            "inline-block";

        loadMore.textContent =
            "إظهار المزيد (" +
            (list.length - visibleCount) +
            " متبقي)";

    }else{

        loadMore.style.display =
            "none";

    }

}

loadMore.addEventListener("click",function(){

    visibleCount += 5;

    render();

});

newestBtn.addEventListener("click",function(){

    if(sortMode === "newest") return;

    sortMode = "newest";

    visibleCount = 5;

    newestBtn.classList.add("active");
    oldestBtn.classList.remove("active");

    render();

});

oldestBtn.addEventListener("click",function(){

    if(sortMode === "oldest") return;

    sortMode = "oldest";

    visibleCount = 5;

    oldestBtn.classList.add("active");
    newestBtn.classList.remove("active");

    render();

});

loadMods();

})();
</script>

</body>
</html>
