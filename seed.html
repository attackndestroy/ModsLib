<script>

  /* =========================================
     رابط قاعدة بيانات Seeds
  ========================================= */

  const SEED_URL =
    'https://modslib.attdes.online/seed.json';


  /* =========================================
     قراءة ID من الرابط
     
     مثال:
     https://example.com/?id=123
  ========================================= */

  const urlParams =
    new URLSearchParams(window.location.search);

  const seedId =
    urlParams.get('id');


  /* =========================================
     عناصر الصفحة
  ========================================= */

  const msgEl =
    document.getElementById('statusMsg');

  const seedBox =
    document.getElementById('seedBox');

  const copyBtn =
    document.getElementById('copyBtn');


  /* =========================================
     Seed الحالي
  ========================================= */

  let rawSeedValue = '';


  /* =========================================
     التأكد من وجود ID
  ========================================= */

  if (!seedId) {

    msgEl.innerText =
      '⚠️ خطأ: لم يتم تحديد رقم الـ ID في الرابط!';

    msgEl.style.color =
      'var(--error)';

  }


  /* =========================================
     جلب ملف seed.json
  ========================================= */

  else {

    fetch(SEED_URL, {
      method: 'GET',
      cache: 'no-cache'
    })

    .then(function(response) {

      if (!response.ok) {
        throw new Error(
          'HTTP ' + response.status
        );
      }

      return response.json();

    })

    .then(function(data) {

      /* ===============================
         التأكد من وجود ID
      =============================== */

      if (
        data &&
        Object.prototype.hasOwnProperty.call(
          data,
          seedId
        )
      ) {

        /*
         * أخذ Seed كما هو تماما.
         *
         * لا Base64
         * لا decode
         * لا تحويل
         */

        rawSeedValue =
          String(data[seedId]);


        /* ===============================
           عرض Seed
        =============================== */

        seedBox.innerText =
          rawSeedValue;


        /* ===============================
           تفعيل زر النسخ
        =============================== */

        copyBtn.classList.add('active');


        /* ===============================
           رسالة النجاح
        =============================== */

        msgEl.innerText =
          '✅ كود الـ Seed جاهز للنسخ أدناه';

        msgEl.style.color =
          'var(--success)';

      }


      /* ===============================
         ID غير موجود
      =============================== */

      else {

        seedBox.innerText =
          '----';

        msgEl.innerText =
          '❌ عذراً، هذا الـ Seed غير موجود.';

        msgEl.style.color =
          'var(--error)';

      }

    })


    /* ===============================
       خطأ في الاتصال
    =============================== */

    .catch(function(error) {

      console.error(
        'Seed loading error:',
        error
      );

      seedBox.innerText =
        '----';

      msgEl.innerText =
        '❌ فشل تحميل ملف Seed.';

      msgEl.style.color =
        'var(--error)';

    });

  }


  /* =========================================
     وظيفة نسخ Seed
  ========================================= */

  function copySeed() {

    if (!rawSeedValue) {
      return;
    }


    /* ===============================
       Clipboard API
    =============================== */

    if (
      navigator.clipboard &&
      window.isSecureContext
    ) {

      navigator.clipboard
        .writeText(rawSeedValue)

        .then(function() {

          showCopySuccess();

        })

        .catch(function() {

          fallbackCopy();

        });

    }


    /* ===============================
       الطريقة الاحتياطية
    =============================== */

    else {

      fallbackCopy();

    }

  }


  /* =========================================
     النسخ الاحتياطي
  ========================================= */

  function fallbackCopy() {

    const textarea =
      document.createElement('textarea');

    textarea.value =
      rawSeedValue;

    textarea.style.position =
      'fixed';

    textarea.style.left =
      '-9999px';

    textarea.style.top =
      '-9999px';

    document.body.appendChild(
      textarea
    );

    textarea.focus();
    textarea.select();

    try {

      const successful =
        document.execCommand('copy');

      if (successful) {

        showCopySuccess();

      } else {

        showCopyError();

      }

    }

    catch (error) {

      showCopyError();

    }

    document.body.removeChild(
      textarea
    );

  }


  /* =========================================
     نجاح النسخ
  ========================================= */

  function showCopySuccess() {

    copyBtn.innerText =
      'تم النسخ بنجاح! ✓';

    copyBtn.style.background =
      'var(--success)';

    copyBtn.style.color =
      '#000';


    setTimeout(function() {

      copyBtn.innerText =
        'نسخ Seed العالم 📋';

      copyBtn.style.background =
        'var(--accent)';

      copyBtn.style.color =
        '#000';

    }, 2000);

  }


  /* =========================================
     فشل النسخ
  ========================================= */

  function showCopyError() {

    msgEl.innerText =
      '❌ تعذر نسخ الـ Seed تلقائيا، حاول نسخه يدويا.';

    msgEl.style.color =
      'var(--error)';

  }

</script>
