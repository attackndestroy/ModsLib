<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ATT/DES — Minecraft Mods</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

<header class="site-header">
    <a href="/">
        <img
            src="https://attdes.online/header.png"
            alt="ATT/DES"
            class="header-logo"
        >
    </a>
</header>

<main class="container">

    <div class="feed-controls">
        <button class="btn-sort active" data-sort="newest" type="button">
            أحدث
        </button>

        <button class="btn-sort" data-sort="oldest" type="button">
            أقدم
        </button>
    </div>

    <div id="feed" class="feed"></div>

    <div id="load-more-wrap" class="load-more-wrap">
        <button id="btn-load-more" class="btn-load-more" type="button">
            إظهار المزيد
        </button>
    </div>

    <div id="feed-status" class="feed-status">
        جاري تحميل المودات...
    </div>

</main>

<script>
(function () {

    "use strict";

    const feed = document.getElementById("feed");
    const status = document.getElementById("feed-status");
    const loadMoreWrap = document.getElementById("load-more-wrap");
    const loadMoreBtn = document.getElementById("btn-load-more");
    const sortButtons = document.querySelectorAll(".btn-sort");

    const PAGE_SIZE = 5;

    let mods = [];
    let visibleCount = PAGE_SIZE;
    let currentSort = "newest";

    /*
     * فك Base64
     */
    function decodeBase64(value) {
        try {
            return decodeURIComponent(
                Array.prototype.map.call(
                    atob(value),
                    function (char) {
                        return "%" +
                            ("00" + char.charCodeAt(0).toString(16)).slice(-2);
                    }
                ).join("")
            );
        } catch (error) {
            return value || "";
        }
    }

    /*
     * تحويل Object الخاص بـ mods.json إلى Array
     */
    function normalizeMods(data) {

        return Object.keys(data)
            .map(function (key) {

                const mod = data[key];

                if (!mod || typeof mod !== "object") {
                    return null;
                }

                return {
                    key: key,
                    id: mod.id,
                    title: mod.title || "بدون عنوان",
                    description: mod.description || "",
                    image: mod.image || "",
                    download: mod.download || ""
                };

            })
            .filter(Boolean);
    }

    /*
     * ترتيب حسب مفتاح السجل نفسه
     * وليس id الموجود داخله.
     *
     * هذا مهم لأن عندك:
     * "001": { id: 1, ... }
     */
    function sortMods(list) {

        return [...list].sort(function (a, b) {

            const aNum = Number(a.key);
            const bNum = Number(b.key);

            if (!Number.isNaN(aNum) && !Number.isNaN(bNum)) {

                return currentSort === "newest"
                    ? bNum - aNum
                    : aNum - bNum;
            }

            return currentSort === "newest"
                ? b.key.localeCompare(a.key)
                : a.key.localeCompare(b.key);
        });
    }

    /*
     * إنشاء بطاقة
     */
    function createCard(mod) {

        const card = document.createElement("article");
        card.className = "mod-card";

        /*
         * الصورة
         */
        const imageBox = document.createElement("div");
        imageBox.className = "mod-card-image";

        if (mod.image && mod.image.trim() !== "") {

            const img = document.createElement("img");

            img.src = mod.image;
            img.alt = mod.title;
            img.loading = "lazy";

            img.onerror = function () {
                imageBox.innerHTML = "";

                const placeholder =
                    document.createElement("div");

                placeholder.className =
                    "mod-card-image-placeholder";

                placeholder.textContent = "لا توجد صورة";

                imageBox.appendChild(placeholder);
            };

            imageBox.appendChild(img);

        } else {

            const placeholder =
                document.createElement("div");

            placeholder.className =
                "mod-card-image-placeholder";

            placeholder.textContent = "لا توجد صورة";

            imageBox.appendChild(placeholder);
        }

        card.appendChild(imageBox);

        /*
         * العنوان
         */
        const title =
            document.createElement("h3");

        title.className = "mod-card-title";
        title.textContent = mod.title;

        card.appendChild(title);

        /*
         * زر التفاصيل
         *
         * نستخدم key وليس id
         * حتى يعمل 001 بشكل صحيح.
         */
        const button =
            document.createElement("a");

        button.className = "mod-card-btn";

        button.href =
            "/tomod.html?id=" +
            encodeURIComponent(mod.key);

        button.textContent = "عرض التفاصيل";

        card.appendChild(button);

        return card;
    }

    /*
     * عرض المنشورات
     */
    function render() {

        feed.innerHTML = "";

        const sortedMods = sortMods(mods);

        const visibleMods =
            sortedMods.slice(0, visibleCount);

        if (visibleMods.length === 0) {

            status.textContent =
                "لا توجد منشورات لعرضها.";

            loadMoreWrap.style.display = "none";

            return;
        }

        visibleMods.forEach(function (mod) {

            feed.appendChild(
                createCard(mod)
            );

        });

        status.textContent = "";

        if (visibleCount < sortedMods.length) {

            loadMoreWrap.style.display = "block";

            loadMoreBtn.textContent =
                "إظهار المزيد (" +
                (sortedMods.length - visibleCount) +
                " متبقي)";

        } else {

            loadMoreWrap.style.display = "none";
        }
    }

    /*
     * تحميل mods.json
     */
    fetch("/mods.json", {
        cache: "no-store"
    })
        .then(function (response) {

            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status
                );
            }

            return response.json();
        })

        .then(function (data) {

            if (
                !data ||
                typeof data !== "object" ||
                Array.isArray(data)
            ) {
                throw new Error(
                    "صيغة mods.json غير صحيحة"
                );
            }

            mods = normalizeMods(data);

            visibleCount = PAGE_SIZE;

            render();
        })

        .catch(function (error) {

            console.error(
                "mods.json error:",
                error
            );

            feed.innerHTML = "";

            loadMoreWrap.style.display = "none";

            status.textContent =
                "تعذر تحميل المودات. تأكد من وجود /mods.json.";
        });

    /*
     * أحدث / أقدم
     */
    sortButtons.forEach(function (button) {

        button.addEventListener(
            "click",
            function () {

                const newSort =
                    button.dataset.sort;

                if (newSort === currentSort) {
                    return;
                }

                currentSort = newSort;

                visibleCount = PAGE_SIZE;

                sortButtons.forEach(
                    function (btn) {
                        btn.classList.remove("active");
                    }
                );

                button.classList.add("active");

                render();
            }
        );

    });

    /*
     * إظهار المزيد
     */
    loadMoreBtn.addEventListener(
        "click",
        function () {

            visibleCount += PAGE_SIZE;

            render();
        }
    );

})();
</script>

</body>
</html>
