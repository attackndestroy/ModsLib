<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مودات ماين كرافت | الرئيسية</title>
  <meta name="description" content="أحدث مودات ماين كرافت المجانية - تحميل سريع" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#52c41a;--primary-dark:#389e0d;--bg:#f5f5f5;--card:#fff;--text:#262626;--muted:#8c8c8c}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{text-decoration:none;color:inherit}
    header{background:linear-gradient(135deg,#52c41a,#237804);color:#fff;padding:20px 24px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
    .header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
    .logo{font-size:1.6rem;font-weight:800}
    .logo span{opacity:.85;font-size:.85rem;display:block;font-weight:400}
    main{max-width:1200px;margin:0 auto;padding:30px 20px 60px}
    h1{margin-bottom:24px;font-size:1.8rem}
    h1::before{content:'⛏️ '}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
    .card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(82,196,26,.2)}
    .card-img{aspect-ratio:16/9;overflow:hidden;background:#e0e0e0}
    .card-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
    .card:hover .card-img img{transform:scale(1.05)}
    .card-body{padding:14px;display:flex;flex-direction:column;gap:12px;flex:1}
    .card-title{font-size:1.05rem;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .btn{display:inline-block;padding:10px 18px;background:var(--primary);color:#fff!important;border-radius:8px;text-align:center;font-weight:700;transition:background .2s;border:none;cursor:pointer;font-family:inherit;font-size:.95rem}
    .btn:hover{background:var(--primary-dark)}
    .card .btn{margin-top:auto;display:block}
    .pagination{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:40px}
    .page-btn{min-width:42px;height:42px;padding:0 12px;border:1px solid #d9d9d9;background:#fff;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;color:var(--text);transition:all .2s}
    .page-btn:hover{border-color:var(--primary);color:var(--primary)}
    .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
    .page-btn:disabled{opacity:.4;cursor:not-allowed}
    .empty,.loading{text-align:center;padding:60px 20px;color:var(--muted);font-size:1.1rem}
    @media(max-width:600px){
      .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
      .card-body{padding:10px;gap:8px}
      .card-title{font-size:.95rem}
      .btn{padding:8px 12px;font-size:.9rem}
      h1{font-size:1.4rem}
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo">Minecraft Mods<span>مودات ماين كرافت</span></div>
    </div>
  </header>

  <main>
    <h1>أحدث المودات</h1>
    <div id="grid" class="grid"><div class="loading">جاري التحميل...</div></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <script>
    const JSON_URL = 'jsons/1.json';
    const PAGE_SIZE = 10;
    let allMods = [];
    let currentPage = 1;

    async function load() {
      try {
        const res = await fetch(JSON_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        allMods = Array.isArray(data) ? data : (data.mods || []);
        allMods.sort((a, b) => b.n - a.n);   // الأحدث أولاً (رقم أعلى = أحدث)
        render();
      } catch (e) {
        document.getElementById('grid').innerHTML =
          '<div class="empty">⚠️ تعذّر تحميل المودات. تأكد من وجود <code>jsons/1.json</code></div>';
        console.error(e);
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      const start = (currentPage - 1) * PAGE_SIZE;
      const items = allMods.slice(start, start + PAGE_SIZE);

      if (items.length === 0) {
        grid.innerHTML = '<div class="empty">لا توجد مودات حالياً</div>';
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      grid.innerHTML = items.map(mod => `
        <article class="card">
          <div class="card-img">
            <img src="${esc(mod.i)}" alt="${esc(mod.t)}" loading="lazy"
                 onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 400 225%22><rect fill=%22%23ddd%22 width=%22400%22 height=%22225%22/><text x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2218%22>No Image</text></svg>'">
          </div>
          <div class="card-body">
            <h2 class="card-title">${esc(mod.t)}</h2>
            <a href="mod/${mod.n}.html" class="btn">⬇ تحميل</a>
          </div>
        </article>
      `).join('');

      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.ceil(allMods.length / PAGE_SIZE);
      const pag = document.getElementById('pagination');
      if (totalPages <= 1) { pag.innerHTML = ''; return; }

      let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="goPage(${currentPage - 1})">‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="goPage(${currentPage + 1})">›</button>`;
      pag.innerHTML = html;
    }

    function goPage(p) {
      currentPage = p;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    load();
  </script>
</body>
</html>
