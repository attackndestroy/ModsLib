<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>ATT/DES — تحميل المود</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Popup -->
    <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js">
    </script>
    <!-- Analytics -->
    <script src="https://modslib.attdes.online/analytics.js">
    </script>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <a href="index.html">
            <img src="https://attdes.online/header.png" alt="ATT/DES Logo" class="header-logo" />
        </a>
    </header>

    <!-- ===== NATIVE BANNER (مرة واحدة) ===== -->
    <div class="native-banner-wrapper">
        <script async="async" data-cfasync="false" src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js">
        </script>
        <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
    </div>

    <!-- ===== SOCIAL BAR ===== -->
    <div class="social-bar-wrapper">
        <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js">
        </script>
    </div>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container mod-container">

        <!-- محتوى التحميل -->
        <div id="mod-download" class="mod-download">
            <!-- يتم ملؤها بواسطة JavaScript -->
        </div>

        <!-- Banner 320x50 (مرة واحدة) -->
        <div class="banner-320x50 mod-banner">
            <script>
                atOptions = {
                    'key': '28d1f1f838ea883f1f7fc0d4733ebba6',
                    'format': 'iframe',
                    'height': 50,
                    'width': 320,
                    'params': {}
                };
            </script>
            <script src="https://www.highrevenueformat.com/28d1f1f838ea883f1f7fc0d4733ebba6/invoke.js">
            </script>
        </div>

        <!-- حالة التحميل / الأخطاء -->
        <div id="download-status" class="download-status"></div>

    </main>

    <script>
        (function() {
            'use strict';

            // ----- helpers -----
            function getUrlParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // ----- read ID -----
            const id = getUrlParam('id');
            const downloadEl = document.getElementById('mod-download');
            const statusEl = document.getElementById('download-status');

            if (!id) {
                showError('لم يتم تحديد المود.', 'الرجاء استخدام رابط صحيح يحتوي على معرف المود.', null);
                return;
            }

            // ----- check access state -----
            const accessKey = 'download_access_' + id;
            let hasAccess = false;
            try {
                hasAccess = (sessionStorage.getItem(accessKey) === 'true');
            } catch (e) {
                // تجاهل
            }

            if (!hasAccess) {
                // لم يمر من tomod
                showError(
                    'لحظة يا بطل 😂',
                    'المود لن يهرب منك، لكن عليك المرور من الصفحة السابقة أولًا.',
                    'tomod.html?id=' + encodeURIComponent(id)
                );
                return;
            }

            // ----- after access granted, load data -----
            function showError(title, message, backLink) {
                downloadEl.innerHTML = '';
                statusEl.innerHTML = `
                    <div class="error-box">
                        <h2>${escapeHtml(title)}</h2>
                        <p>${escapeHtml(message)}</p>
                        ${backLink ? `<a href="${escapeHtml(backLink)}" class="mod-card-btn">الذهاب إلى صفحة المود</a>` : `<a href="index.html" class="mod-card-btn">العودة للرئيسية</a>`}
                    </div>
                `;
                // إزالة الصلاحية إذا كانت موجودة ولكن غير صالحة (لنمنع إعادة المحاولة)
                try {
                    sessionStorage.removeItem(accessKey);
                } catch (e) {}
            }

            function renderDownload(record, title) {
                // record contains download_url
                const downloadUrl = record.download_url || '';
                if (!downloadUrl) {
                    showError('رابط التحميل غير متوفر', 'هذا المود لا يحتوي على رابط تحميل صالح.', null);
                    return;
                }

                downloadEl.innerHTML = `
                    <div class="download-card">
                        <h1 class="download-title">${escapeHtml(title || 'تحميل المود')}</h1>
                        <p class="download-ready">المود جاهز للتحميل ✅</p>
                        <a href="${escapeHtml(downloadUrl)}" target="_blank" rel="noopener noreferrer" class="mod-card-btn download-btn">تحميل المود</a>
                        <p class="download-note">سيتم فتح رابط التحميل في نافذة جديدة.</p>
                    </div>
                `;
                statusEl.innerHTML = '';
            }

            function fetchData() {
                statusEl.innerHTML = 'جاري تجهيز التحميل…';
                fetch('mods.json')
                    .then(function(res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(function(data) {
                        if (!Array.isArray(data) || data.length === 0) {
                            throw new Error('البيانات فارغة أو غير صالحة.');
                        }

                        // البحث عن سجل type="m" مع id مطابق
                        const keyType = btoa('type');
                        const keyId = btoa('id');
                        const keyDownload = btoa('download_url');

                        let foundM = null;
                        let foundTitle = null;

                        for (var i = 0; i < data.length; i++) {
                            var rec = data[i];
                            if (rec[keyType] === 'm' && String(rec[keyId]) === String(id)) {
                                foundM = {
                                    download_url: rec[keyDownload] || ''
                                };
                            }
                            // نجلب title من سجل t إذا وجد لعرضه
                            if (rec[keyType] === 't' && String(rec[keyId]) === String(id)) {
                                const keyTitle = btoa('title');
                                foundTitle = rec[keyTitle] || '';
                            }
                        }

                        if (foundM) {
                            renderDownload(foundM, foundTitle || 'مود ' + id);
                            // نترك الصلاحية موجودة للاستخدام
                        } else {
                            showError('المود غير موجود', 'لم نعثر على بيانات التحميل لهذا المود.', null);
                            try {
                                sessionStorage.removeItem(accessKey);
                            } catch (e) {}
                        }
                    })
                    .catch(function(err) {
                        console.error('Error loading mods.json:', err);
                        showError('خطأ في التحميل', 'تعذر تحميل بيانات المود. تأكد من اتصالك بالإنترنت.', null);
                        try {
                            sessionStorage.removeItem(accessKey);
                        } catch (e) {}
                    });
            }

            fetchData();

        })();
    </script>

</body>
</html>
