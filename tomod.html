<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المود - ATTACK N' DESTROY</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --card-dark: #141414;
            --accent-yellow: #ffde00;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #262626;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            overflow-x: hidden;
            background-image: repeating-linear-gradient(45deg, rgba(255, 222, 0, 0.01) 0, rgba(255, 222, 0, 0.01) 1px, transparent 0, transparent 50px);
        }
        h1, h2, h3, .oswald-font {
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
        }
        .main-header {
            width: 100%;
            max-height: 400px;
            overflow: hidden;
            border-bottom: 3px solid var(--accent-yellow);
        }
        .main-header img {
            width: 100%;
            height: auto;
            object-fit: cover;
            display: block;
        }
        .ad-container {
            width: 100%;
            text-align: center;
            margin: 20px 0;
            padding: 10px;
            background: var(--card-dark);
            border: 1px dashed var(--border-color);
        }
        .details-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .mod-details-card {
            background: var(--card-dark);
            border: 1px solid var(--border-color);
            padding: 30px;
            clip-path: polygon(0 0, 100% 0, 100% 98%, 98% 100%, 0 100%);
        }
        .mod-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }
        .mod-title {
            font-size: 32px;
            color: var(--accent-yellow);
            margin-bottom: 20px;
        }
        .mod-desc {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 30px;
        }
        .action-btn {
            background: var(--accent-yellow);
            color: var(--bg-dark);
            border: none;
            padding: 15px 40px;
            font-family: 'Oswald', sans-serif;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
            transition: 0.3s;
        }
        .action-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(255, 222, 0, 0.6);
        }
        footer {
            background: #050505;
            border-top: 2px solid var(--border-color);
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }
        footer p {
            color: var(--text-muted);
            margin: 5px 0;
            font-size: 15px;
        }
        .highlight-brand {
            color: var(--accent-yellow);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
    <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>

    <header class="main-header">
        <img src="header.png" alt="ATTACK N' DESTROY Header" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1600&q=80'">
    </header>

    <div class="details-container" id="detailsWrapper">
        </div>

    <footer>
        <p>Copyright: <span class="highlight-brand">ATTACK N' DESTROY</span></p>
        <p>Powered By: <span class="highlight-brand">ATTACK N' DESTROY</span></p>
    </footer>

    <script src="stats.js"></script>

    <script>
        async function loadModDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const modId = parseInt(urlParams.get('id'));
            const container = document.getElementById('detailsWrapper');

            if (!modId) {
                container.innerHTML = '<p style="text-align:center; color:#ffde00; font-size:20px;">معرّف المود غير موجود!</p>';
                return;
            }

            try {
                const response = await fetch('mods.json');
                const data = await response.json();
                const mod = data.find(m => m.id === modId);

                if (!mod) {
                    container.innerHTML = '<p style="text-align:center; color:#ffde00; font-size:20px;">عذراً، هذا المود غير متوفر حالياً.</p>';
                    return;
                }

                container.innerHTML = `
                    <div class="mod-details-card">
                        <img src="${mod.image}" alt="${mod.title}" class="mod-img">
                        <h1 class="mod-title">${mod.title}</h1>
                        <p class="mod-desc">${mod.description}</p>
                        
                        <div class="ad-container"><script src="/320-50.js"><\/script></div>

                        <div style="margin: 30px 0; text-align: center;">
                            <a href="mod.html?id=${mod.id}" class="action-btn">إنتقال لصفحة التحميل</a>
                        </div>

                        <div class="ad-container"><script src="/320-50.js"><\/script></div>

                        <div class="ad-container"><script src="/320-50.js"><\/script></div>
                    </div>
                `;
            } catch (error) {
                console.error("Error loading mod details:", error);
                container.innerHTML = '<p style="text-align:center; color:#ffde00;">حدث خطأ أثناء تحميل البيانات.</p>';
            }
        }

        window.addEventListener('DOMContentLoaded', loadModDetails);
    </script>
</body>
</html>
