<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>ATT/DES — تفاصيل المود</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: hidden; font-size: 16px; scroll-behavior: smooth; }
        body {
            background: #121212; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6; overflow-x: hidden; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        a { color: #f5c842; text-decoration: none; }
        a:hover { text-decoration: underline; }
        :focus-visible { outline: 2px solid #f5c842; outline-offset: 2px; border-radius: 4px; }

        .site-header {
            background: #1a1a1a; padding: 0.8rem 1rem; text-align: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .header-logo { max-width: 100%; height: auto; max-height: 80px; width: auto; display: inline-block; }

        .container { max-width: 800px; margin: 0 auto; padding: 1rem; width: 100%; flex: 1; }

        .native-banner-wrapper, .social-bar-wrapper { text-align: center; margin: 0.5rem 0; overflow: hidden; }
        .native-banner-wrapper iframe, .social-bar-wrapper iframe { max-width: 100%; }

        .tomod-banner {
            margin: 1.5rem 0;
            text-align: center;
        }
        .tomod-banner iframe {
            max-width: 100%;
            border: none;
            overflow: hidden;
        }

        .mod-detail {
            background: #1e1e1e; border-radius: 16px; padding: 1.5rem;
            margin-bottom: 2rem; box-shadow: 0 4px 16px rgba(0,0,0,0.6);
        }
        .mod-detail-image { text-align: center; margin-bottom: 1.5rem; }
        .mod-detail-image img {
            max-width: 100%; height: auto; max-height: 400px; object-fit: contain;
            border-radius: 8px; background: #2a2a2a;
        }
        .mod-detail-image-placeholder {
            background: #2a2a2a; color: #888; padding: 3rem 1rem;
            border-radius: 8px; font-size: 1.2rem;
        }
        .mod-detail-title {
            font-size: 2rem; font-weight: 700; color: #f5c842;
            margin: 0.5rem 0 1rem; text-align: center; line-height: 1.3;
        }
        .mod-detail-description {
            font-size: 1.1rem; line-height: 1.8; color: #ddd;
            background: #2a2a2a; padding: 1.2rem; border-radius: 8px;
            margin-bottom: 2rem; white-space: pre-wrap; word-break: break-word;
        }
        .download-btn {
            display: inline-block; background: #f5c842; color: #1a1a1a;
            font-weight: 700; padding: 0.8rem 2.5rem; border-radius: 50px;
            text-decoration: none; font-size: 1.3rem; transition: background 0.2s, transform 0.1s;
            border: none; cursor: pointer; min-height: 48px; min-width: 180px;
            text-align: center; line-height: 1.4; margin: 0.5rem 0;
        }
        .download-btn:hover { background: #e0b030; text-decoration: none; transform: scale(1.03); }
        .download-btn:active { transform: scale(0.97); }

        .error-box {
            background: #1e1e1e; border: 1px solid #f5c842; border-radius: 16px;
            padding: 2rem 1.5rem; text-align: center; max-width: 600px; margin: 2rem auto;
        }
        .error-box h2 { color: #f5c842; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .error-box p { color: #ccc; margin-bottom: 1.5rem; font-size: 1.1rem; }
        .error-box .mod-card-btn {
            display: inline-block; background: #f5c842; color: #1a1a1a;
            font-weight: 700; padding: 0.6rem 1.5rem; border-radius: 50px;
            text-decoration: none; transition: background 0.2s;
            min-height: 44px; min-width: 120px; text-align: center; line-height: 1.4;
            margin: 0.5rem auto;
        }
        .error-box .mod-card-btn:hover { background: #e0b030; text-decoration: none; }

        .detail-status { text-align: center; padding: 1rem; color: #aaa; font-size: 1rem; }

        @media (max-width: 360px) {
            .container { padding: 0.6rem; }
            .mod-detail-title { font-size: 1.6rem; }
            .mod-detail-description { font-size: 1rem; padding: 0.8rem; }
            .download-btn { font-size: 1.1rem; padding: 0.6rem 1.8rem; min-width: 140px; }
        }
        @media (min-width: 900px) {
            .mod-detail { padding: 2rem; }
            .mod-detail-title { font-size: 2.5rem; }
            .header-logo { max-height: 100px; }
        }
        img, iframe, video { max-width: 100%; height: auto; }
        * { max-width: 100%; }
    </style>
    <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
    <script src="https://modslib.attdes.online/analytics.js"></script>
</head>
<body>

    <header class="site-header">
        <a href="index.html"><img src="https://attdes.online/header.png" alt="ATT/DES Logo" class="header-logo" /></a>
    </header>

    <div class="native-banner-wrapper">
        <script async="async" data-cfasync="false" src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js"></script>
        <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
    </div>

    <div class="social-bar-wrapper">
        <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
    </div>

    <main class="container tomod-container">
        <div id="mod-detail" class="mod-detail"></div>
        <div id="detail-status" class="detail-status"></div>
    </main>

    <script>
        (function() {
            'use strict';

            function getUrlParam(param) {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get(param);
            }

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function createBanner320x50() {
                const wrapper = document.createElement('div');
                wrapper.className = 'tomod-banner';

                const iframe = document.createElement('iframe');
                iframe.width = '320';
                iframe.height = '50';
                iframe.style.border = 'none';
                iframe.style.overflow = 'hidden';
                iframe.style.maxWidth = '100%';
                iframe.scrolling = 'no';
                iframe.srcdoc = `
                    <html>
                    <head>
                        <style>
                            body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
                            * { box-sizing: border-box; }
                        </style>
                    </head>
                    <body>
                        <script>
                            window.atOptions = {
                                'key' : '28d1f1f838ea883f1f7fc0d4733ebba6',
                                'format' : 'iframe',
                                'height' : 50,
                                'width' : 320,
                                'params' : {}
                            };
                        <\/script>
                        <script src="https://www.highrevenueformat.com/28d1f1f838ea883f1f7fc0d4733ebba6/invoke.js"><\/script>
                    </body>
                    </html>
                `;

                wrapper.appendChild(iframe);
                return wrapper;
            }

            const id = getUrlParam('id');
            const detailEl = document.getElementById('mod-detail');
            const statusEl = document.getElementById('detail-status');

            if (!id) {
                detailEl.innerHTML = '';
                statusEl.innerHTML = `
                    <div class="error-box">
                        <h2>لم يتم تحديد المود</h2>
                        <p>الرجاء استخدام رابط صحيح.</p>
                        <a href="index.html" class="mod-card-btn">العودة للرئيسية</a>
                    </div>
                `;
                return;
            }

            function showError(title, msg) {
                detailEl.innerHTML = '';
                statusEl.innerHTML = `
                    <div class="error-box">
                        <h2>${escapeHtml(title)}</h2>
                        <p>${escapeHtml(msg)}</p>
                        <a href="index.html" class="mod-card-btn">العودة للرئيسية</a>
                    </div>
                `;
            }

            function renderDetail(item) {
                const img = item.image || '';
                const title = item.title || 'بدون عنوان';
                const desc = item.description || 'لا يوجد وصف.';

                const container = document.createElement('div');

                const imgDiv = document.createElement('div');
                imgDiv.className = 'mod-detail-image';
                if (img) {
                    const imgEl = document.createElement('img');
                    imgEl.src = img;
                    imgEl.alt = title;
                    imgDiv.appendChild(imgEl);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'mod-detail-image-placeholder';
                    placeholder.textContent = 'لا توجد صورة';
                    imgDiv.appendChild(placeholder);
                }
                container.appendChild(imgDiv);

                container.appendChild(createBanner320x50());

                const titleEl = document.createElement('h1');
                titleEl.className = 'mod-detail-title';
                titleEl.textContent = title;
                container.appendChild(titleEl);

                const descEl = document.createElement('div');
                descEl.className = 'mod-detail-description';
                descEl.innerHTML = escapeHtml(desc).replace(/\n/g, '<br>');
                container.appendChild(descEl);

                container.appendChild(createBanner320x50());

                const btn = document.createElement('a');
                btn.className = 'download-btn';
                btn.href = 'mod.html?id=' + encodeURIComponent(id);
                btn.textContent = 'تحميل المود';
                container.appendChild(btn);

                detailEl.innerHTML = '';
                detailEl.appendChild(container);

                try {
                    sessionStorage.setItem('download_access_' + id, 'true');
                } catch(e) {}

                statusEl.innerHTML = '';
            }

            function fetchData() {
                statusEl.textContent = 'جاري التحميل…';
                fetch('/mods.json')
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (typeof data !== 'object' || data === null) throw new Error('JSON غير صالح');
                        const item = data[id];
                        if (!item) {
                            showError('المود غير موجود', 'لم نعثر على مود بهذا المعرف.');
                            return;
                        }
                        renderDetail(item);
                    })
                    .catch(err => {
                        console.error(err);
                        showError('خطأ في التحميل', 'تعذر تحميل البيانات. تأكد من وجود /mods.json.');
                    });
            }

            fetchData();
        })();
    </script>

</body>
</html>
