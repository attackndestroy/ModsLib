<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تحميل المود - ATT/DES</title>

  <!-- اللوجو الخاص بالمتصفح (Favicon) -->
  <link rel="icon" type="image/x-icon" href="https://attdes.online/fav.ico">
  <link rel="shortcut icon" type="image/x-icon" href="https://attdes.online/fav.ico">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --btn-green: #22c55e;
      --btn-green-hover: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* حاوية إعلان الـ Banner المباشر أعلى الصفحة */
    .top-banner-ad {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      overflow: hidden;
    }

    /* هيدر الصورة */
    .header-banner-container {
      width: 100%;
      max-width: 1200px;
      margin: 10px auto;
      padding: 0 10px;
    }

    .header-banner {
      width: 100%;
      aspect-ratio: 3464 / 1023;
      background-color: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .header-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* أوعية الإعلانات */
    .ad-container {
      width: 100%;
      max-width: 900px;
      margin: 15px auto;
      padding: 10px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed var(--border-color);
      border-radius: 8px;
      text-align: center;
      min-height: 90px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    main {
      width: 100%;
      max-width: 800px;
      padding: 0 15px;
      margin-bottom: 40px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .card h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .status-box {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      padding: 15px 20px;
      border-radius: 10px;
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .btn-download {
      display: inline-block;
      background-color: var(--btn-green);
      color: #ffffff;
      text-decoration: none;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      background-color: var(--btn-green-hover);
      transform: translateY(-2px);
    }

    .error-msg {
      color: #f87171;
      font-weight: bold;
    }

    /* تنسيق إعلانات AADS Frame */
    .aads-frame iframe {
      max-width: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <!-- إعلان Adsterra العلوي (320x50) فوق الهيدر -->
  <div class="top-banner-ad">
    <script>
      atOptions = {
        'key' : '28d1f1f838ea883f1f7fc0d4733ebba6',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>
    <script src="https://www.highperformanceformat.com/28d1f1f838ea883f1f7fc0d4733ebba6/invoke.js"></script>
  </div>

  <!-- هيدر الصورة -->
  <header class="header-banner-container">
    <div class="header-banner">
      <img src="https://attdes.online/attdes-logo.png" alt="ATT/DES Logo">
    </div>
  </header>

  <!-- الإعلان الأول: AADS العلوي -->
  <div class="ad-container" id="ad-top">
    <!-- BEGIN AADS AD UNIT 2450619 -->
    <div class="aads-frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
      <iframe data-aa='2450619' src='//acceptable.a-ads.com/2450619/?size=Adaptive'
              style='border:0; padding:0; width:70%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
    </div>
    <!-- END AADS AD UNIT 2450619 -->
  </div>

  <main>
    <div class="card">
      <h1>تحميل المود المطلوب</h1>
      
      <div id="status-display" class="status-box">جاري تحميل وتفكيك رابط المود...</div>

      <!-- زر الانتقال لرابط التحميل الحقيقي -->
      <a id="btn-download" class="btn-download" href="#" target="_blank" style="display: none;">📥 اضغط هنا للتحميل المباشر</a>

      <!-- الإعلان الثاني: AADS وسط الكارت -->
      <div class="ad-container" style="margin-top:25px;" id="ad-inline">
        <!-- BEGIN AADS AD UNIT 2450619 -->
        <div class="aads-frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
          <iframe data-aa='2450619' src='//acceptable.a-ads.com/2450619/?size=Adaptive'
                  style='border:0; padding:0; width:70%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
        </div>
        <!-- END AADS AD UNIT 2450619 -->
      </div>
    </div>
  </main>

  <!-- الإعلان الثالث: AADS السفلي -->
  <div class="ad-container" id="ad-bottom">
    <!-- BEGIN AADS AD UNIT 2450619 -->
    <div class="aads-frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
      <iframe data-aa='2450619' src='//acceptable.a-ads.com/2450619/?size=Adaptive'
              style='border:0; padding:0; width:70%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
    </div>
    <!-- END AADS AD UNIT 2450619 -->
  </div>

  <script>
    const JSON_URL = "https://modslib.attdes.online/mod.json";

    function base64ToUtf8(str) {
      const binary = atob(str.replace(/\s/g, ''));
      const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    async function loadMod() {
      const urlParams = new URLSearchParams(window.location.search);
      const modId = urlParams.get('id');
      const statusElem = document.getElementById('status-display');
      const downloadBtn = document.getElementById('btn-download');

      if (!modId) {
        statusElem.innerHTML = "<span class='error-msg'>يرجى تحديد المعرّف (مثال: mod.html?id=1)</span>";
        return;
      }

      try {
        const response = await fetch(`${JSON_URL}?t=${new Date().getTime()}`);
        if (!response.ok) throw new Error('تعذر تحميل البيانات');
        
        const data = await response.json();

        if (data[modId]) {
          const rawModUrl = base64ToUtf8(data[modId]);
          statusElem.innerText = "رابط التحميل جاهز الآن!";
          statusElem.style.color = "#4ade80";
          downloadBtn.href = rawModUrl;
          downloadBtn.style.display = "inline-block";
        } else {
          statusElem.innerHTML = "<span class='error-msg'>المود غير موجود (ID خاطئ)</span>";
        }
      } catch (err) {
        statusElem.innerHTML = "<span class='error-msg'>خطأ في تحميل البيانات</span>";
        console.error(err);
      }
    }

    window.onload = loadMod;
  </script>

  <!-- كود Monetag الشامل -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="266903" async data-cfasync="false"></script>
</body>
</html>
