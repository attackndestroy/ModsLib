<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATT/DES - @modslib</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --accent: #facc15;
      --text: #f8fafc;
      --border: #27272a;
      --muted: #a1a1aa;

      --yt-color: #ff0000;
      --tg-color: #229ed9;
      --fb-color: #1877f2;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .logo-box {
      margin-bottom: 25px;
    }

    .logo-box h1 {
      color: var(--accent);
      font-size: 2.2rem;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .logo-box p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .tag {
      display: inline-block;
      background: #27272a;
      color: var(--accent);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 12px;
      font-weight: bold;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 30px 0;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.05rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .social-btn:hover {
      transform: translateY(-2px);
    }

    .btn-yt { border-right: 5px solid var(--yt-color); }
    .btn-yt:hover { border-color: var(--yt-color); background: rgba(255, 0, 0, 0.05); }

    .btn-tg { border-right: 5px solid var(--tg-color); }
    .btn-tg:hover { border-color: var(--tg-color); background: rgba(34, 158, 217, 0.05); }

    .btn-fb { border-right: 5px solid var(--fb-color); }
    .btn-fb:hover { border-color: var(--fb-color); background: rgba(24, 119, 242, 0.05); }

    .btn-sub {
      font-size: 0.85rem;
      padding: 6px 14px;
      border-radius: 6px;
      color: #fff;
    }

    .bg-yt { background: var(--yt-color); }
    .bg-tg { background: var(--tg-color); }
    .bg-fb { background: var(--fb-color); }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .ad-container {
      width: 100%;
      margin: 20px auto;
      text-align: center;
    }

    .ad-container iframe {
      border: 0;
      width: 70%;
      height: auto;
      display: block;
      margin: auto;
    }
  </style>
</head>
<body>
