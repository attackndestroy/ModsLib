<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ModsLib — مكتبة المودات</title>
<meta name="description" content="ModsLib — منصة عرض وتحميل المودات">
<link rel="icon" href="/fav.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div id="header-mount"></div>

<main class="container">

  <section class="page-hero">
    <h1 class="page-hero__title">أحدث المودات</h1>
  </section>

  <div class="feed-toolbar">
    <div class="feed-toolbar__sort">
      <button type="button" class="chip is-active" id="sort-newest">أحدث</button>
      <button type="button" class="chip" id="sort-oldest">أقدم</button>
    </div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="ابحث عن مود بالاسم أو الوصف...">
    </div>
  </div>

  <div id="pre-feed-ad"></div>

  <div id="feed-status" class="state-message" style="display:none;"></div>

  <div id="feed-grid" class="mod-grid"></div>

  <div id="feed-empty" class="feed-empty" style="display:none;">لا توجد نتائج مطابقة لبحثك.</div>

  <div class="load-more-wrap">
    <button type="button" class="btn btn--outline" id="load-more-btn" style="display:none;">إظهار المزيد</button>
  </div>

</main>

<div id="footer-mount"></div>

<script src="/stats.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  const feedGrid = document.getElementById('feed-grid');
  const feedEmpty = document.getElementById('feed-empty');
  const feedStatus = document.getElementById('feed-status');
  const preFeedAd = document.getElementById('pre-feed-ad');
  const loadMoreBtn = document.getElementById('load-more-btn');
  const searchInput = document.getElementById('search-input');
  const sortNewestBtn = document.getElementById('sort-newest');
  const sortOldestBtn = document.getElementById('sort-oldest');

  const PAGE_SIZE = 10;

  let allMods = [];
  let currentList = [];
  let visibleCount = 0;
  let sortMode = 'desc'; // 'desc' = أحدث, 'asc' = أقدم
  let searchQuery = '';

  ModsLib.renderHeader('#header-mount');
  ModsLib.renderFooter('#footer-mount');
  ModsLib.ensureFavicon();
  ModsLib.injectGlobalAdScripts();

  function buildCard(mod) {
    const card = document.createElement('article');
    card.className = 'mod-card';
    const img = ModsLib.escapeHtml(mod.image || '');
    const title = ModsLib.escapeHtml(mod.title || 'بدون عنوان');
    card.innerHTML = `
      <div class="mod-card__media">
        <img src="${img}" alt="${title}" loading="lazy"
             onerror="this.style.opacity=0.15">
      </div>
      <div class="mod-card__body">
        <h2 class="mod-card__title">${title}</h2>
        <div class="mod-card__actions">
          <a class="btn btn--sm" href="${ModsLib.modUrl(mod.id)}">عرض التفاصيل</a>
        </div>
      </div>
    `;
    return card;
  }

  function computeCurrentList() {
    let list = sortMode === 'desc' ? ModsLib.sortByIdDesc(allMods) : ModsLib.sortByIdAsc(allMods);
    const q = searchQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(m =>
        String(m.title || '').toLowerCase().includes(q) ||
        String(m.description || '').toLowerCase().includes(q)
      );
    }
    return list;
  }

  function updateLoadMoreVisibility() {
    loadMoreBtn.style.display = (visibleCount < currentList.length) ? 'inline-flex' : 'none';
  }

  function appendMore() {
    const next = currentList.slice(visibleCount, visibleCount + PAGE_SIZE);
    next.forEach(mod => {
      feedGrid.appendChild(buildCard(mod));
      feedGrid.appendChild(ModsLib.makeAdSlotWrap());
    });
    visibleCount += next.length;
    updateLoadMoreVisibility();
  }

  function resetFeed() {
    currentList = computeCurrentList();
    visibleCount = 0;
    feedGrid.innerHTML = '';
    preFeedAd.innerHTML = '';
    feedEmpty.style.display = currentList.length ? 'none' : 'block';
    if (currentList.length) {
      preFeedAd.appendChild(ModsLib.makeAdSlotWrap());
    }
    appendMore();
  }

  loadMoreBtn.addEventListener('click', () => appendMore());

  sortNewestBtn.addEventListener('click', () => {
    if (sortMode === 'desc') return;
    sortMode = 'desc';
    sortNewestBtn.classList.add('is-active');
    sortOldestBtn.classList.remove('is-active');
    resetFeed();
  });

  sortOldestBtn.addEventListener('click', () => {
    if (sortMode === 'asc') return;
    sortMode = 'asc';
    sortOldestBtn.classList.add('is-active');
    sortNewestBtn.classList.remove('is-active');
    resetFeed();
  });

  searchInput.addEventListener('input', (e) => {
    searchQuery = e.target.value;
    resetFeed();
  });

  async function init() {
    feedStatus.style.display = 'block';
    feedStatus.innerHTML = '<div class="spinner"></div>';
    try {
      allMods = await ModsLib.fetchMods();
      feedStatus.style.display = 'none';
      resetFeed();
    } catch (err) {
      feedStatus.textContent = err.message || 'حدث خطأ غير متوقع أثناء تحميل المودات.';
    }
  }

  init();
})();
</script>

</body>
</html>
