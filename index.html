<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModsLib - مكتبة المودات | ATT/DES</title>
    
    <!-- Favicon Icon -->
    <link rel="shortcut icon" href="img/fav.ico" type="image/x-icon">

    <!-- Google Font: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons (Free for commercial use) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* --- الأساسيات والألوان (Cairo Font & Block Style) --- */
        :root {
            --bg-main: #0b0f0c;
            --bg-card: #141a16;
            --bg-card-hover: #1c2620;
            --neon-green: #00FF66;
            --neon-green-glow: rgba(0, 255, 102, 0.3);
            --text-light: #ffffff;
            --text-dim: #a3b8a8;
            --border-color: #243328;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif !important; /* خط Cairo الموحد */
            border-radius: 0 !important; /* حواف حادة بستايل المكعبات */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            direction: rtl;
            line-height: 1.5;
            padding-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- 1. Header & Navigation --- */
        .site-header {
            background-color: var(--bg-card);
            border-bottom: 3px solid var(--neon-green);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-brand-img {
            max-height: 45px;
            width: auto;
            display: block;
        }

        .header-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: var(--bg-main);
            color: var(--text-light);
            border: 2px solid var(--border-color);
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .nav-btn i {
            color: var(--neon-green);
            font-size: 14px;
        }

        .nav-btn:hover {
            border-color: var(--neon-green);
            color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green-glow);
        }

        /* --- 2. Slider Section --- */
        .slider-section {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .slider-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) var(--bg-card);
        }

        .slide-card {
            min-width: 300px;
            max-width: 320px;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }

        .slide-card:hover {
            border-color: var(--neon-green);
        }

        .ratio-16-9 {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background-color: #000;
            border-bottom: 2px solid var(--border-color);
        }

        .slide-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .slide-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .btn-action {
            display: block;
            text-align: center;
            background-color: var(--neon-green);
            color: #000;
            font-weight: 700;
            padding: 8px;
            font-size: 13px;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-action:hover {
            background-color: #fff;
            box-shadow: 0 0 10px #fff;
        }

        /* --- 3. Main Layout Grid --- */
        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }

        .section-header {
            color: var(--neon-green);
            font-size: 18px;
            font-weight: 700;
            border-bottom: 2px solid var(--neon-green);
            padding-bottom: 5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Mods Grid */
        .mods-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 15px;
        }

        .mod-card {
            background-color: var(--bg-card);
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .mod-card:hover {
            border-color: var(--neon-green);
            transform: translateY(-3px);
        }

        .mod-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .mod-title {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-light);
            height: 42px;
            overflow: hidden;
            line-height: 1.4;
        }

        /* Pagination */
        .pagination {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 25px;
            grid-column: 1 / -1;
        }

        .page-btn {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            color: var(--text-light);
            padding: 6px 14px;
            font-weight: 700;
        }

        .page-btn.active, .page-btn:hover {
            background: var(--neon-green);
            color: #000;
            border-color: var(--neon-green);
        }

        /* --- Sidebar & Social Media Cards --- */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .widget-box {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            padding: 15px;
            text-align: center;
        }

        .widget-box h3 {
            color: var(--neon-green);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        /* Social Media Specific Buttons */
        .btn-youtube {
            background-color: #FF0000;
            color: #ffffff;
        }

        .btn-facebook {
            background-color: #1877F2;
            color: #ffffff;
        }

        .btn-telegram {
            background-color: #0088cc;
            color: #ffffff;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }

        /* --- 4. News Section --- */
        .news-section {
            max-width: 1200px;
            margin: 30px auto 0;
            padding: 0 20px;
        }

        /* --- 5. Footer --- */
        .site-footer {
            max-width: 1200px;
            margin: 40px auto 0;
            padding: 20px;
            border-top: 2px solid var(--neon-green);
            text-align: center;
            background: var(--bg-card);
        }

        .footer-nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            font-size: 13px;
        }

        .footer-nav a {
            color: var(--text-dim);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .footer-nav a:hover {
            color: var(--neon-green);
        }

        .copyright {
            font-size: 12px;
            color: var(--neon-green);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Responsive Breakpoints */
        @media (max-width: 850px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header class="site-header">
        <a href="home.html">
            <img src="img/head.png" alt="ATT/DES MODSLIB" class="header-brand-img" onerror="this.onerror=null; this.outerHTML='<div style=\'color:var(--neon-green); font-weight:800; font-size:20px;\'>ATT/DES MODSLIB</div>';">
        </a>
        <nav class="header-nav">
            <a href="home.html" class="nav-btn"><i class="fa-solid fa-house"></i> الرئيسية</a>
            <a href="search.html" class="nav-btn"><i class="fa-solid fa-magnifying-glass"></i> بحث</a>
            <a href="store.html" class="nav-btn"><i class="fa-solid fa-cart-shopping"></i> المتجر</a>
            <a href="newsletter.html" class="nav-btn"><i class="fa-solid fa-envelope"></i> النشرة</a>
            <a href="sidemenu.html" class="nav-btn"><i class="fa-solid fa-bars"></i> القائمة</a>
            <a href="archive/index.html" class="nav-btn"><i class="fa-solid fa-box-archive"></i> الأرشيف</a>
            <a href="donate.html" class="nav-btn"><i class="fa-solid fa-heart"></i> دعم</a>
        </nav>
    </header>

    <!-- Slider Section -->
    <section class="slider-section">
        <div class="slider-container" id="slider-wrapper">
            <!-- تعبئة الصور الـ 12 من slider/ وتفاصيل slider.json -->
        </div>
    </section>

    <!-- Main Content -->
    <div class="main-container">
        
        <!-- Latest Mods Feed -->
        <main>
            <h2 class="section-header"><i class="fa-solid fa-fire"></i> أحدث المودات</h2>
            <div class="mods-grid" id="mods-feed">
                <!-- تعبئة أحدث 10 منشورات عبر a/a.json -->
            </div>

            <!-- Pagination -->
            <div class="pagination">
                <a href="#" class="page-btn active">1</a>
                <a href="#" class="page-btn">2</a>
                <a href="#" class="page-btn">3</a>
                <span class="page-btn">...</span>
                <a href="#" class="page-btn">?</a>
            </div>
        </main>

        <!-- Sidebar -->
        <aside class="sidebar">
            
            <!-- YouTube Widget -->
            <div class="widget-box">
                <h3><i class="fa-brands fa-youtube" style="color:#FF0000;"></i> YouTube</h3>
                <img src="img/youtube.png" alt="YouTube" class="social-img" onerror="this.src='https://via.placeholder.com/260x100/141a16/FF0000?text=YOUTUBE'">
                <a href="https://youtube.com/@modslib" target="_blank" class="btn-action btn-youtube"><i class="fa-brands fa-youtube"></i> إشترك في القناة</a>
            </div>

            <!-- Facebook Widget -->
            <div class="widget-box">
                <h3><i class="fa-brands fa-facebook" style="color:#1877F2;"></i> Facebook</h3>
                <img src="img/facebook.png" alt="Facebook" class="social-img" onerror="this.src='https://via.placeholder.com/260x100/141a16/1877F2?text=FACEBOOK'">
                <a href="https://facebook.com/modslib" target="_blank" class="btn-action btn-facebook"><i class="fa-brands fa-facebook-f"></i> متابعة الصفحة</a>
            </div>

            <!-- Telegram Widget -->
            <div class="widget-box">
                <h3><i class="fa-brands fa-telegram" style="color:#0088cc;"></i> Telegram</h3>
                <img src="img/TELEGRAM.png" alt="Telegram" class="social-img" onerror="this.src='https://via.placeholder.com/260x100/141a16/0088cc?text=TELEGRAM'">
                <a href="https://t.me/modslib" target="_blank" class="btn-action btn-telegram"><i class="fa-paper-plane"></i> انضم للقناة</a>
            </div>

            <!-- WhatsApp Widget -->
            <div class="widget-box">
                <h3><i class="fa-brands fa-whatsapp" style="color:#25D366;"></i> WhatsApp</h3>
                <img src="img/whatsapp.png" alt="WhatsApp" class="social-img" onerror="this.src='https://via.placeholder.com/260x100/141a16/25D366?text=WHATSAPP'">
                <a href="https://whatsapp.com/channel/modslib" target="_blank" class="btn-action btn-whatsapp"><i class="fa-brands fa-whatsapp"></i> متابعة القناة</a>
            </div>

        </aside>

    </div>

    <!-- News Section -->
    <section class="news-section">
        <h2 class="section-header"><i class="fa-solid fa-newspaper"></i> الأخبار والأجدد</h2>
        <div class="slider-container" id="news-feed">
            <!-- تعبئة آخر 10 منشورات أخبار ديناميكياً -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-nav">
            <a href="privacy.html"><i class="fa-solid fa-shield-halved"></i> سياسة الخصوصية</a>
            <span>-</span>
            <a href="terms.html"><i class="fa-solid fa-file-contract"></i> سياسة الإستخدام</a>
            <span>-</span>
            <a href="contact.html"><i class="fa-solid fa-headset"></i> تواصل معنا</a>
            <span>-</span>
            <a href="about.html"><i class="fa-solid fa-circle-info"></i> من نحن؟</a>
        </div>
        <p class="copyright">Managed & Owned By ATTDES.online</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            // 1. جلب بيانات السلايدر (12 صورة من مجلد slider/ وربطها بـ slider.json)
            fetch('slider/slider.json')
                .then(res => res.json())
                .then(data => {
                    const sliderWrapper = document.getElementById('slider-wrapper');
                    sliderWrapper.innerHTML = '';
                    
                    for (let i = 1; i <= 12; i++) {
                        const itemData = data[i - 1] || { t: 'عنوان افتراضي', d: 'تحميل', l: '#' };
                        
                        const slide = document.createElement('div');
                        slide.className = 'slide-card';
                        slide.innerHTML = `
                            <img src="slider/${i}.png" alt="Slide ${i}" class="ratio-16-9" onerror="this.src='https://via.placeholder.com/300x169/141a16/00FF66?text=Slider+${i}'">
                            <div class="slide-content">
                                <div class="slide-title">${itemData.t}</div>
                                <a href="${itemData.l}" class="btn-action" target="_blank">${itemData.d}</a>
                            </div>
                        `;
                        sliderWrapper.appendChild(slide);
                    }
                })
                .catch(err => console.log('Error loading slider.json:', err));


            // 2. جلب أحدث المودات من a/a.json (تنازلياً حسب قيمة n)
            fetch('a/a.json')
                .then(res => res.json())
                .then(data => {
                    const modsFeed = document.getElementById('mods-feed');
                    modsFeed.innerHTML = '';

                    data.sort((a, b) => b.n - a.n);
                    const latestMods = data.slice(0, 10);

                    latestMods.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'mod-card';
                        card.innerHTML = `
                            <img src="${item.i}" alt="${item.t}" class="ratio-16-9" onerror="this.src='https://via.placeholder.com/260x146/141a16/00FF66?text=Mod+${item.n}'">
                            <div class="mod-info">
                                <div class="mod-title">${item.t}</div>
                                <a href="a/${item.n}.html" class="btn-action"><i class="fa-solid fa-download"></i> تحميل المود</a>
                            </div>
                        `;
                        modsFeed.appendChild(card);
                    });
                })
                .catch(err => console.log('Error loading a/a.json:', err));


            // 3. جلب الأخبار (آخر 10 منشورات من news/news.json)
            fetch('news/news.json')
                .then(res => res.json())
                .then(data => {
                    const newsFeed = document.getElementById('news-feed');
                    newsFeed.innerHTML = '';
                    
                    data.sort((a, b) => b.n - a.n);
                    const latestNews = data.slice(0, 10);

                    latestNews.forEach(item => {
                        const newsCard = document.createElement('div');
                        newsCard.className = 'slide-card';
                        newsCard.innerHTML = `
                            <img src="${item.i}" class="ratio-16-9" onerror="this.src='https://via.placeholder.com/300x169/141a16/00FF66?text=News'">
                            <div class="slide-content">
                                <div class="slide-title">${item.t}</div>
                                <a href="${item.l || '#'}" class="btn-action">${item.d || 'قراءة المزيد'}</a>
                            </div>
                        `;
                        newsFeed.appendChild(newsCard);
                    });
                })
                .catch(err => console.log('News JSON optional or not found:', err));

        });
    </script>
</body>
</html>
