<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>جاري التحميل...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #f5f5f5; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="myFrame" src="../download.html"></iframe>

  <script>
    const id = parseInt(location.pathname.split('/').pop().replace('.html', '').replace('.htm', ''));
    
    if (!id || isNaN(id)) {
      document.body.innerHTML = '<div style="text-align:center;padding:50px;font-family:sans-serif">رقم المود غير صالح</div>';
    } else {
      const iframe = document.getElementById('myFrame');
      
      iframe.onload = async function() {
        try {
          const iframeDoc = iframe.contentWindow.document;
          const contentDiv = iframeDoc.getElementById('content');
          if (!contentDiv) return;

          const res = await fetch('https://ModsLib.attdes.online/jsons/1.json');
          const data = await res.json();
          const mods = Array.isArray(data) ? data : (data.mods || []);
          const mod = mods.find(m => m.n === id);

          if (!mod) {
            contentDiv.innerHTML = '<div style="text-align:center;padding:50px;color:#999">❌ لم يتم العثور على المود.</div>';
            return;
          }

          iframeDoc.title = 'تحميل ' + (mod.t || 'مود ' + id);

          contentDiv.innerHTML = `
            <div class="download-box">
              <span class="icon">📥</span>
              <h1>${mod.t || 'بدون عنوان'}</h1>
              <p style="color:#888;margin-bottom:20px;">اضغط على الزر أدناه للانتقال لرابط التحميل</p>
              <a href="${mod.l || '#'}" target="_blank" class="btn">⬇ تحميل الآن</a>
            </div>
          `;

        } catch (error) {
          console.error(error);
          iframe.contentWindow.document.body.innerHTML = '<div style="text-align:center;padding:50px;font-family:sans-serif">⚠️ حدث خطأ في تحميل البيانات</div>';
        }
      };
    }
  </script>
</body>
</html>
