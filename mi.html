    :root {

      --text: #f8fafc;
      --border: #27272a;

    }

    * {

      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;

    }

    body {

    .container {

    }

    /* الهيدر */

      color: var(--accent);
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .sub-brand {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    /* 1. قسم التحفيز والأسهم (في الأعلى) */
    .hero-scroll {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .hero-scroll p {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 12px;
    }

    .arrows {
      font-size: 1.4rem;
      color: var(--accent);
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(8px);
      }
      60% {
        transform: translateY(4px);
      }
    }

    /* حاوية الإعلانات (تلي قسم التحفيز) */
    .ads-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 25px;
      align-items: center;
      justify-content: center;
    }

    .ad-banner-frame {
      width: 320px;
      height: 50px;
      border: 0;
      overflow: hidden;
      margin: auto;
    }

    /* قسم أزرار التحميل */
    .download-section {
      margin: 25px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;

      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 6px;
      transition: background 0.2s, transform 0.1s;
      opacity: 0.9;
    }

    .btn-mc:hover {
      background: #15803d;
      opacity: 1;
    }

    /* زر التحميل الرئيسي (بارز وكبير) */
    .btn-dl {
      display: inline-block;
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #000;
      text-decoration: none;
      font-weight: 900;
      font-size: 1.15rem;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);
      transition: background 0.2s, transform 0.1s;
      cursor: pointer;
    }

    .btn-dl:hover {
      background: var(--accent-hover);
    }

    /* شبكة السوشيال ميديا */
    .social-box {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 20px 0;
    }

    .social-btn {
      background: var(--card);

      color: var(--text);
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      transition: border-color 0.2s;
    }

    .social-btn:hover {

      font-size: 0.75rem;
      margin-top: 15px;
      border-top: 1px solid var(--border);

      width: 100%;
