<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحة الإعلان - ATT/DES</title>

  <!-- اللوجو الخاص بالمتصفح (Favicon) -->
  <link rel="icon" type="image/x-icon" href="https://attdes.online/fav.ico">
  <link rel="shortcut icon" type="image/x-icon" href="https://attdes.online/fav.ico">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent-color);
      margin-bottom: 20px;
    }

    /* حاوية الإعلان */
    .ad-wrapper {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 15px 5px;
      margin: 15px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* تعديل بسيط على الإعلان لضمان الاستجابة التامة */
    #frame iframe {
      max-width: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>مساحة إعلانية</h1>

    <div class="ad-wrapper">
      <!-- BEGIN AADS AD UNIT 2450619 -->
      <div id="frame" style="width: 100%; margin: auto; position: relative; z-index: 99998;">
        <iframe data-aa='2450619' src='//acceptable.a-ads.com/2450619/?size=Adaptive'
                style='border:0; padding:0; width:70%; height:auto; overflow:hidden; display: block; margin: auto;'></iframe>
      </div>
      <!-- END AADS AD UNIT 2450619 -->
    </div>
  </div>

</body>
</html>
