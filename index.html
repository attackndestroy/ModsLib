<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attack N' Destroy – مودات ماينكرافت</title>
    <!-- الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== الأساسيات ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #eee;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { text-decoration: none; color: inherit; }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex: 1;
        }

        /* ===== الخلفية المميزة ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,222,0,0.02) 20px, rgba(255,222,0,0.02) 21px),
                radial-gradient(circle at 30% 40%, #1a1a1a, #0a0a0a 80%);
            pointer-events: none;
            z-index: -1;
        }

        /* ===== الهيدر ===== */
        .header-img {
            width: 100%;
            max-height: 600px;
            object-fit: cover;
            display: block;
            background: #141414;
            border-bottom: 2px solid #ffde00;
        }

        /* ===== الإعلان تحت الهيدر ===== */
        .ad-under-header {
            text-align: center;
            padding: 10px 0;
            background: #141414;
            border-bottom: 1px solid #333;
        }

        /* ===== أدوات التحكم (ترتيب - بحث) ===== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0 15px;
            border-bottom: 1px solid #333;
        }
        .controls .sort-btns {
            display: flex;
            gap: 10px;
        }
        .controls .sort-btns button {
            background: transparent;
            border: 1px solid #555;
            color: #ccc;
            padding: 6px 18px;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            cursor: pointer;
            transition: 0.3s;
        }
        .controls .sort-btns button:hover,
        .controls .sort-btns button.active {
            background: #ffde00;
            color: #0a0a0a;
            border-color: #ffde00;
            box-shadow: 0 0 15px rgba(255,222,0,0.3);
        }
        .search-box input {
            background: #141414;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 20px;
            border-radius: 0;
            font-family: 'Cairo', sans-serif;
            clip-path: polygon(8% 0%, 100% 0%, 92% 100%, 0% 100%);
            width: 220px;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #ffde00;
            outline: none;
            box-shadow: 0 0 10px rgba(255,222,0,0.2);
        }

        /* ===== شبكة البطاقات ===== */
        .feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding: 30px 0;
        }
        .card {
            background: #141414;
            border: 1px solid #333;
            clip-path: polygon(0% 0%, 98% 0%, 100% 5%, 100% 100%, 2% 100%, 0% 95%);
            transition: 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-6px);
            border-color: #ffde00;
            box-shadow: 0 8px 25px rgba(255,222,0,0.15);
        }
        .card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            display: block;
            border-bottom: 2px solid #ffde00;
        }
        .card .content {
            padding: 18px 16px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .card .content h3 {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.3rem;
            color: #fff;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .card .content .btn-detail {
            margin-top: auto;
            background: transparent;
            border: 1px solid #ffde00;
            color: #ffde00;
            padding: 8px 0;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            background: rgba(255,222,0,0.05);
        }
        .card .content .btn-detail:hover {
            background: #ffde00;
            color: #0a0a0a;
            box-shadow: 0 0 20px rgba(255,222,0,0.4);
        }

        /* ===== زر إظهار المزيد ===== */
        .load-more {
            text-align: center;
            padding: 20px 0 40px;
        }
        .load-more button {
            background: transparent;
            border: 2px solid #ffde00;
            color: #ffde00;
            padding: 12px 40px;
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            clip-path: polygon(10% 0%, 100% 0%, 90% 100%, 0% 100%);
            cursor: pointer;
            transition: 0.3s;
        }
        .load-more button:hover {
            background: #ffde00;
            color: #0a0a0a;
            box-shadow: 0 0 30px rgba(255,222,0,0.3);
        }

        /* ===== إعلانات 320×50 المضمنة ===== */
        .ad-infeed {
            text-align: center;
            padding: 15px 0;
            background: #0f0f0f;
            border-top: 1px solid #2a2a2a;
            border-bottom: 1px solid #2a2a2a;
            margin: 10px 0;
        }
        .ad-infeed iframe {
            border: none;
            max-width: 100%;
        }

        /* ===== الفوتر ===== */
        footer {
            background: #0a0a0a;
            border-top: 2px solid #ffde00;
            padding: 25px 20px;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            font-size: 1rem;
            color: #aaa;
            margin-top: 30px;
        }
        footer .highlight {
            color: #ffde00;
            font-weight: 700;
            font-family: 'Oswald', sans-serif;
        }

        /* استجابة */
        @media (max-width: 600px) {
            .controls { flex-direction: column; align-items: stretch; }
            .search-box input { width: 100%; }
            .feed { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== الهيدر ===== -->
    <header>
        <img src="/header.png" alt="Attack N' Destroy" class="header-img" />
    </header>

    <!-- ===== إعلان تحت الهيدر ===== -->
    <div class="ad-under-header">
        <script async="async" data-cfasync="false" src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js"></script>
        <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
    </div>

    <!-- ===== المحتوى الرئيسي ===== -->
    <main class="container">

        <!-- أدوات التحكم -->
        <div class="controls">
            <div class="sort-btns">
                <button id="sortNewest" class="active">أحدث</button>
                <button id="sortOldest">أقدم</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="ابحث عن مود..." />
            </div>
        </div>

        <!-- شبكة البطاقات + الإعلانات المضمنة -->
        <div id="feedContainer">
            <!-- يتم إنشاء البطاقات بواسطة JavaScript -->
        </div>

        <!-- زر إظهار المزيد -->
        <div class="load-more">
            <button id="loadMoreBtn">إظهار المزيد</button>
        </div>

        <!-- إعلانات عامة (موجودة في جميع الصفحات) -->
        <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
        <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
    </main>

    <!-- ===== الفوتر ===== -->
    <footer>
        <div>Copyright: <span class="highlight">ATTACK N' DESTROY</span></div>
        <div>Powered By: <span class="highlight">ATTACK N' DESTROY</span></div>
    </footer>

    <!-- ===== إحصائيات ===== -->
    <script src="/stats.js"></script>

    <!-- ===== كود index الخاص ===== -->
    <script>
        (function() {
            // الحالة
            let allPosts = [];
            let displayedCount = 10;    // عدد المعروض حالياً
            let currentSort = 'newest'; // 'newest' أو 'oldest'
            let searchTerm = '';

            // عناصر DOM
            const feedContainer = document.getElementById('feedContainer');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            const sortNewest = document.getElementById('sortNewest');
            const sortOldest = document.getElementById('sortOldest');
            const searchInput = document.getElementById('searchInput');

            // دالة لجلب البيانات
            async function fetchPosts() {
                try {
                    const res = await fetch('/mods.json');
                    if (!res.ok) throw new Error('فشل تحميل البيانات');
                    const data = await res.json();
                    // نتأكد أنها مصفوفة
                    allPosts = Array.isArray(data) ? data : [];
                    // ترتيب مبدئي حسب id تنازلي (أحدث)
                    allPosts.sort((a, b) => b.id - a.id);
                    render();
                } catch (err) {
                    feedContainer.innerHTML = `<p style="color:#ff4444; padding:30px;">⚠️ حدث خطأ في تحميل المودات: ${err.message}</p>`;
                }
            }

            // دالة الحصول على البيانات بعد تطبيق الترتيب والبحث
            function getFilteredAndSorted() {
                let result = [...allPosts];

                // بحث
                if (searchTerm.trim() !== '') {
                    const term = searchTerm.trim().toLowerCase();
                    result = result.filter(p => p.title.toLowerCase().includes(term));
                }

                // ترتيب
                if (currentSort === 'newest') {
                    result.sort((a, b) => b.id - a.id);
                } else {
                    result.sort((a, b) => a.id - b.id);
                }

                return result;
            }

            // دالة عرض البطاقات مع الإعلانات المضمنة
            function render() {
                const filtered = getFilteredAndSorted();
                const total = filtered.length;
                const toShow = Math.min(displayedCount, total);
                const shownPosts = filtered.slice(0, toShow);

                let html = '';

                // الإعلان الأول (قبل أول منشور) – باستخدام iframe ديناميكي
                html += `
                    <div class="ad-infeed">
                        <iframe src="/320-50.js" style="width:100%; max-width:320px; height:50px; display:inline-block;"></iframe>
                    </div>
                `;

                // عرض البطاقات مع إعلان بعد كل منشور
                shownPosts.forEach((post, index) => {
                    html += `
                        <div class="card" data-id="${post.id}">
                            <img src="${post.image}" alt="${post.title}" loading="lazy" />
                            <div class="content">
                                <h3>${post.title}</h3>
                                <a href="/tomod.html?id=${post.id}" class="btn-detail">عرض التفاصيل</a>
                            </div>
                        </div>
                    `;

                    // إعلان 320×50 بعد كل منشور (باستثناء آخر واحد؟ حسب الطلب "بعد كل منشور")
                    // نضعه بعد كل منشور بما في ذلك الأخير
                    html += `
                        <div class="ad-infeed">
                            <iframe src="/320-50.js" style="width:100%; max-width:320px; height:50px; display:inline-block;"></iframe>
                        </div>
                    `;
                });

                // إذا لم توجد نتائج
                if (shownPosts.length === 0) {
                    html = `<p style="padding:40px; text-align:center; color:#aaa;">لا توجد مودات مطابقة للبحث.</p>`;
                }

                feedContainer.innerHTML = html;

                // إظهار أو إخفاء زر "إظهار المزيد"
                if (toShow >= total) {
                    loadMoreBtn.style.display = 'none';
                } else {
                    loadMoreBtn.style.display = 'block';
                }
            }

            // تحديث الـ displayedCount وإعادة العرض
            function loadMore() {
                const filtered = getFilteredAndSorted();
                if (displayedCount < filtered.length) {
                    displayedCount += 10;
                    render();
                }
            }

            // تغيير الترتيب
            function setSort(sortType) {
                currentSort = sortType;
                // تحديث شكل الأزرار
                sortNewest.classList.toggle('active', sortType === 'newest');
                sortOldest.classList.toggle('active', sortType === 'oldest');
                // إعادة تعيين العدد المعروض إلى 10 (لأن الترتيب تغير)
                displayedCount = 10;
                render();
            }

            // ربط الأحداث
            loadMoreBtn.addEventListener('click', loadMore);

            sortNewest.addEventListener('click', function() {
                if (currentSort !== 'newest') setSort('newest');
            });
            sortOldest.addEventListener('click', function() {
                if (currentSort !== 'oldest') setSort('oldest');
            });

            // البحث – مع تأخير بسيط
            let searchTimeout;
            searchInput.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchTerm = this.value;
                    displayedCount = 10; // إعادة ضبط العدد
                    render();
                }, 300);
            });

            // بدء التطبيق
            fetchPosts();

            // إعادة تعيين displayedCount بعد أي تغيير في البحث أو الترتيب (تم تضمينه)
        })();
    </script>

</body>
</html>
