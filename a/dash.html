<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة النشر — مكتبة المودات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bg-2:#111; --bg-3:#181818; --bg-4:#202020;
  --border:#262626; --border-2:#333;
  --text:#e8e8e8; --dim:#8a8a8a;
  --accent:#ffcc00; --accent-2:#ffd633; --accent-dk:#cc9900;
  --green:#00d26a; --red:#ff4757; --blue:#4d9eff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo','Segoe UI',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
  min-height:100vh; padding-bottom:60px;
}

/* ========== غطاء الإعدادات الأولى ========== */
.setup-overlay{
  position:fixed; inset:0; z-index:5000;
  background:rgba(0,0,0,0.95);
  backdrop-filter:blur(10px);
  display:flex; align-items:center; justify-content:center;
  padding:20px; overflow-y:auto;
}
.setup-overlay.hidden{display:none;}
.setup-card{
  background:var(--bg-2); border:2px solid var(--accent);
  border-radius:16px; padding:35px; max-width:520px; width:100%;
  box-shadow:0 0 60px rgba(255,204,0,0.2);
}
.setup-card h2{
  color:var(--accent); font-size:1.5em; font-weight:900;
  margin-bottom:8px; text-align:center;
}
.setup-card p{
  color:var(--dim); text-align:center; margin-bottom:25px;
  font-size:0.95em;
}

/* ========== التحية ========== */
.hero{
  position:relative;
  padding:60px 20px 40px;
  text-align:center;
  overflow:hidden;
  background:radial-gradient(circle at 50% 0%, rgba(255,204,0,0.15) 0%, transparent 60%);
}
.hero::before{
  content:'';
  position:absolute; inset:0;
  background:
    linear-gradient(90deg, transparent 49.5%, rgba(255,204,0,0.08) 49.5%, rgba(255,204,0,0.08) 50.5%, transparent 50.5%),
    linear-gradient(0deg, transparent 49.5%, rgba(255,204,0,0.05) 49.5%, rgba(255,204,0,0.05) 50.5%, transparent 50.5%);
  background-size:40px 40px;
  opacity:0.3;
  pointer-events:none;
}
.hero-inner{position:relative; z-index:1; max-width:900px; margin:0 auto;}
.hero h1{
  font-size:clamp(1.8em, 5vw, 3em);
  font-weight:900;
  background:linear-gradient(135deg, #ffcc00 0%, #fff8dc 50%, #ffcc00 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 20px rgba(255,204,0,0.3));
  margin-bottom:10px;
  animation:shine 3s ease-in-out infinite;
  background-size:200% auto;
}
@keyframes shine{0%,100%{background-position:0% center;}50%{background-position:100% center;}}
.hero .subtitle{color:var(--dim); font-size:1.05em; font-weight:600;}
.hero .crown{
  font-size:2.5em; display:block; margin-bottom:10px;
  filter:drop-shadow(0 0 20px rgba(255,204,0,0.6));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hero .time-badge{
  display:inline-block; margin-top:15px; padding:6px 18px;
  background:var(--bg-3); border:1px solid var(--accent);
  border-radius:20px; font-size:0.85em; color:var(--accent); font-weight:700;
}

/* ========== الحاوية ========== */
.container{max-width:1000px;margin:0 auto;padding:0 20px;}

/* ========== الكارد ========== */
.card{
  background:var(--bg-2); border:1px solid var(--border);
  border-radius:14px; padding:25px; margin-bottom:22px;
}
.card-header{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:20px; padding-bottom:15px;
  border-bottom:2px solid var(--accent); flex-wrap:wrap; gap:10px;
}
.card-header h2{
  color:var(--accent); font-size:1.3em; font-weight:900;
  display:flex; align-items:center; gap:10px;
}
.card-header .num{
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; background:var(--accent); color:#000;
  border-radius:50%; font-size:0.9em; font-weight:900;
}

/* ========== الحقول ========== */
label{
  display:block; margin-bottom:6px; color:var(--dim);
  font-size:0.9em; font-weight:600;
}
label .req{color:var(--red);}
input[type="text"],input[type="number"],input[type="password"],input[type="url"],textarea,select{
  font-family:'Cairo',sans-serif; font-size:1em;
  padding:11px 14px; border-radius:8px;
  border:1px solid var(--border-2); background:var(--bg-3);
  color:var(--text); width:100%; margin-bottom:14px;
  transition:border-color 0.2s;
}
input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent);}
textarea{resize:vertical;min-height:90px;line-height:1.6;}

/* ========== الأزرار ========== */
button{
  font-family:'Cairo',sans-serif; font-size:1em; font-weight:700;
  padding:11px 24px; border-radius:8px; border:none; cursor:pointer;
  transition:transform 0.15s, box-shadow 0.15s;
  margin-left:6px; margin-bottom:6px;
}
button:hover{transform:translateY(-1px);}
button:active{transform:translateY(0);}
.btn-primary{background:var(--accent); color:#000; box-shadow:0 4px 0 var(--accent-dk);}
.btn-primary:hover{box-shadow:0 5px 0 var(--accent-dk);}
.btn-secondary{background:var(--bg-3); color:var(--accent); border:1.5px solid var(--accent);}
.btn-danger{background:var(--bg-3); color:var(--red); border:1.5px solid var(--red);}
.btn-green{background:var(--green); color:#000; box-shadow:0 4px 0 #009e4f;}
.btn-block{width:100%; margin-left:0;}

/* ========== الحالة ========== */
.status{
  padding:12px 16px; border-radius:8px; margin:12px 0;
  font-size:0.95em; font-weight:600; display:none;
}
.status.show{display:block;}
.status.ok{background:rgba(0,210,106,0.12);color:var(--green);border:1px solid rgba(0,210,106,0.4);}
.status.err{background:rgba(255,71,87,0.12);color:var(--red);border:1px solid rgba(255,71,87,0.4);}
.status.info{background:rgba(77,158,255,0.12);color:var(--blue);border:1px solid rgba(77,158,255,0.4);}

/* ========== معاينة الصورة ========== */
.img-preview{
  display:none; margin:10px 0 15px;
  border-radius:10px; overflow:hidden;
  border:1px solid var(--border-2); max-width:100%;
}
.img-preview img{
  width:100%; max-height:280px; object-fit:cover; display:block;
}

/* ========== صندوق الـ JSON ========== */
.json-box{
  position:relative; background:#0d0d0d;
  border:1px solid var(--border-2); border-radius:10px;
  padding:18px; font-family:'Courier New',monospace;
  font-size:0.85em; color:#ffd580; max-height:400px;
  overflow:auto; white-space:pre;
  direction:ltr; text-align:left; line-height:1.5;
}
.json-box::-webkit-scrollbar{width:8px;height:8px;}
.json-box::-webkit-scrollbar-track{background:#1a1a1a;}
.json-box::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
.copy-btn{
  position:absolute; top:10px; right:10px;
  background:var(--accent); color:#000;
  padding:6px 14px; font-size:0.85em; border-radius:6px; margin:0;
}

/* ========== قائمة المودات ========== */
.mod-item{
  display:flex; align-items:center; gap:15px;
  padding:14px; background:var(--bg-3);
  border:1px solid var(--border); border-radius:10px;
  margin-bottom:10px; transition:border-color 0.2s;
}
.mod-item:hover{border-color:var(--accent);}
.mod-item img{
  width:70px; height:70px; object-fit:cover;
  border-radius:8px; flex-shrink:0; background:var(--bg-4);
}
.mod-info{flex:1; min-width:0;}
.mod-info .title{
  font-weight:700; color:#fff; margin-bottom:4px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mod-info .meta{
  font-size:0.8em; color:var(--dim);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.mod-info .id-badge{
  display:inline-block; background:var(--accent); color:#000;
  font-size:0.7em; font-weight:900; padding:2px 8px;
  border-radius:10px; margin-left:5px;
}
.mod-actions{display:flex; gap:6px; flex-shrink:0;}
.mod-actions button{padding:7px 14px; font-size:0.85em; margin:0;}

.search-input{margin-bottom:18px !important;}

/* ========== شريط علوي ========== */
.topbar{
  position:sticky; top:0; z-index:100;
  background:rgba(10,10,10,0.9); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:12px 20px; display:flex;
  align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:10px;
}
.topbar .logo{color:var(--accent); font-weight:900; font-size:1.1em;}
.topbar .actions button{padding:8px 16px; font-size:0.85em;}

.empty{text-align:center; padding:40px 20px; color:var(--dim);}
.empty .icon{font-size:3em; margin-bottom:10px; display:block;}

@media (max-width:600px){
  .mod-item{flex-wrap:wrap;}
  .mod-actions{width:100%; justify-content:flex-end;}
}
</style>
</head>
<body>

<!-- ========== غطاء الإعدادات الأولى ========== -->
<div class="setup-overlay hidden" id="setupOverlay">
  <div class="setup-card">
    <h2>👑 مرحباً بك</h2>
    <p>أدخل بيانات GitHub مرة واحدة فقط — سنحفظها في متصفحك</p>

    <label>Username</label>
    <input type="text" id="setup_user" placeholder="username">

    <label>Repository</label>
    <input type="text" id="setup_repo" placeholder="repo-name">

    <label>Personal Access Token</label>
    <input type="password" id="setup_token" placeholder="ghp_...">

    <div style="margin-top:15px;">
      <button class="btn-primary btn-block" onclick="saveSetup()">💾 حفظ والمتابعة</button>
    </div>
    <div class="status" id="setupStatus"></div>
  </div>
</div>

<!-- ========== الشريط العلوي ========== -->
<div class="topbar">
  <div class="logo">⚙️ لوحة النشر</div>
  <div class="actions">
    <button class="btn-secondary" onclick="openSettings()">🔧 الإعدادات</button>
    <button class="btn-secondary" onclick="loadFromGitHub()">🔄 تحديث</button>
  </div>
</div>

<!-- ========== التحية ========== -->
<div class="hero">
  <div class="hero-inner">
    <span class="crown">👑</span>
    <h1 id="greeting">مرحباً بك</h1>
    <div class="subtitle" id="greetingSub">في مملكتك الخاصة لإدارة المودات</div>
    <div class="time-badge" id="timeBadge"></div>
  </div>
</div>

<div class="container">

  <!-- ========== لوحة الإعدادات (للتعديل) ========== -->
  <div class="card hidden" id="settingsPanel" style="display:none; border:2px solid var(--accent);">
    <div class="card-header">
      <h2>🔧 الإعدادات</h2>
      <button class="btn-secondary" onclick="closeSettings()">✖ إغلاق</button>
    </div>

    <label>Username</label>
    <input type="text" id="ghUser">

    <label>Repository</label>
    <input type="text" id="ghRepo">

    <label>Branch</label>
    <input type="text" id="ghBranch" value="main">

    <label>Path to a.json</label>
    <input type="text" id="ghPath" value="a/a.json">

    <label>مجلد الصور</label>
    <input type="text" id="ghImgFolder" value="img/a">

    <label>Personal Access Token</label>
    <input type="password" id="ghToken">

    <div style="margin-top:15px;">
      <button class="btn-primary" onclick="saveSettings()">💾 حفظ</button>
      <button class="btn-danger" onclick="resetSettings()">🗑️ مسح وحذف الجلسة</button>
    </div>
    <div class="status" id="settingsStatus"></div>
  </div>

  <!-- ========== القسم الأول: النشر ========== -->
  <div class="card">
    <div class="card-header">
      <h2><span class="num">1</span> نشر مود جديد</h2>
    </div>

    <label>الـ ID <span class="req">*</span></label>
    <input type="number" id="f_id" placeholder="مثال: 1">
    <div style="color:var(--dim); font-size:0.85em; margin-top:-8px; margin-bottom:14px;">
      ⚠️ هذا الرقم سيُستخدم لاسم الصورة وملف HTML
    </div>

    <label>العنوان <span class="req">*</span></label>
    <input type="text" id="f_title" placeholder="مثال: مود الأسلحة الحديثة">

    <label>الوصف <span class="req">*</span></label>
    <textarea id="f_desc" placeholder="وصف تفصيلي للمود..."></textarea>

    <label>الصورة <span class="req">*</span></label>
    <input type="file" id="f_image" accept="image/*" onchange="uploadImage(event)">
    <div class="img-preview" id="imgPreview">
      <img id="imgPreviewSrc" src="" alt="preview">
    </div>
    <input type="text" id="f_imageUrl" placeholder="مسار الصورة سيظهر هنا تلقائياً" readonly>

    <label>الرابط النهائي (رابط التحميل) <span class="req">*</span></label>
    <input type="text" id="f_link" placeholder="https://cut2.cash/...">

    <div style="margin-top:10px;">
      <button class="btn-primary btn-block" onclick="publishMod()">🚀 نشر المود</button>
    </div>
    <div class="status" id="publishStatus"></div>
  </div>

  <!-- ========== القسم الثاني: JSON ========== -->
  <div class="card">
    <div class="card-header">
      <h2><span class="num">2</span> محتوى a.json</h2>
      <button class="btn-secondary" onclick="downloadJson()">📦 تنزيل</button>
    </div>
    <div class="json-box">
      <button class="copy-btn" onclick="copyJson()">📋 نسخ الكل</button>
      <span id="jsonContent">جاري التحميل...</span>
    </div>
    <div class="status" id="jsonStatus"></div>
  </div>

  <!-- ========== القسم الثالث: التعديل والحذف ========== -->
  <div class="card">
    <div class="card-header">
      <h2><span class="num">3</span> تعديل أو حذف المنشورات</h2>
      <span id="modsCount" style="color:var(--dim); font-size:0.9em;"></span>
    </div>

    <input type="text" class="search-input" id="searchInput"
           placeholder="🔍 ابحث بالعنوان أو الـ ID..." oninput="renderModsList()">

    <div id="modsList"></div>
  </div>

</div>

<!-- ========== نافذة التعديل ========== -->
<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; padding:20px; overflow-y:auto;">
  <div style="max-width:600px; margin:40px auto; background:var(--bg-2); border:2px solid var(--accent); border-radius:14px; padding:25px;">
    <h3 style="color:var(--accent); margin-bottom:20px;">✏️ تعديل المنشور رقم <span id="editIdLabel"></span></h3>

    <label>العنوان</label>
    <input type="text" id="edit_t">

    <label>الوصف</label>
    <textarea id="edit_d"></textarea>

    <label>الصورة (مسار)</label>
    <input type="text" id="edit_i">
    <input type="file" accept="image/*" onchange="uploadImageEdit(event)" style="margin-top:6px;">
    <div class="img-preview" id="editImgPreview">
      <img id="editImgPreviewSrc" src="" alt="preview">
    </div>

    <label>الرابط النهائي</label>
    <input type="text" id="edit_l">

    <label>الـ ID (سيُعاد تسمية الصورة تلقائياً)</label>
    <input type="number" id="edit_n">

    <div style="margin-top:15px;">
      <button class="btn-primary" onclick="saveEdit()">💾 حفظ التعديلات</button>
      <button class="btn-secondary" onclick="closeEdit()">إلغاء</button>
    </div>
    <div class="status" id="editStatus"></div>
  </div>
</div>

<script>
/* ============================================================
   المتغيرات
   ============================================================ */
let cfg = {};
let mods = [];
let currentEditId = null;
let currentJsonSha = null;

/* ============================================================
   التحية
   ============================================================ */
function setGreeting() {
  const h = new Date().getHours();
  const g = document.getElementById('greeting');
  const s = document.getElementById('greetingSub');
  const b = document.getElementById('timeBadge');

  let text, sub, emoji;
  if (h >= 5 && h < 12) {
    text = 'صباح الخير يا ملك المودات 👑';
    sub = 'يومك مشرق بإذن الله، لننشر إبداعات جديدة';
    emoji = '🌅';
  } else if (h >= 12 && h < 17) {
    text = 'مساء النور يا زعيمنا 💛';
    sub = 'استمر في بناء إمبراطوريتك';
    emoji = '☀️';
  } else if (h >= 17 && h < 22) {
    text = 'مساء الخير يا أسطورة ✨';
    sub = 'وقت ممتاز لنشر المودات';
    emoji = '🌆';
  } else {
    text = 'سهر مبارك يا بطل 🌙';
    sub = 'لا تنسَ الراحة، صحتك أولاً';
    emoji = '🌌';
  }
  g.textContent = text;
  s.textContent = sub;

  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  b.textContent = `${emoji}  ${days[now.getDay()]} — ${timeStr}`;
}
setGreeting();
setInterval(setGreeting, 60000);

/* ============================================================
   الإعدادات — أول مرة فقط
   ============================================================ */
function showSetupOverlay() {
  document.getElementById('setupOverlay').classList.remove('hidden');
}

function saveSetup() {
  const user = document.getElementById('setup_user').value.trim();
  const repo = document.getElementById('setup_repo').value.trim();
  const token = document.getElementById('setup_token').value.trim();

  if (!user || !repo || !token) {
    setStatus('setupStatus','err','❌ أكمل جميع الحقول');
    return;
  }

  cfg = {
    ghUser: user,
    ghRepo: repo,
    ghBranch: 'main',
    ghPath: 'a/a.json',
    ghImgFolder: 'img/a',
    ghToken: token
  };

  localStorage.setItem('attdes_cfg', JSON.stringify(cfg));
  setStatus('setupStatus','ok','✅ تم الحفظ، جاري التحميل...');

  setTimeout(() => {
    document.getElementById('setupOverlay').classList.add('hidden');
    loadFromGitHub();
  }, 900);
}

function loadSettings() {
  const saved = localStorage.getItem('attdes_cfg');
  if (!saved) {
    showSetupOverlay();
    return false;
  }
  try {
    cfg = JSON.parse(saved);
    fillSettingsForm();
    return true;
  } catch(e) {
    showSetupOverlay();
    return false;
  }
}

function openSettings() {
  fillSettingsForm();
  const panel = document.getElementById('settingsPanel');
  panel.style.display = 'block';
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}

function closeSettings() {
  document.getElementById('settingsPanel').style.display = 'none';
}

function fillSettingsForm() {
  document.getElementById('ghUser').value = cfg.ghUser || '';
  document.getElementById('ghRepo').value = cfg.ghRepo || '';
  document.getElementById('ghBranch').value = cfg.ghBranch || 'main';
  document.getElementById('ghPath').value = cfg.ghPath || 'a/a.json';
  document.getElementById('ghImgFolder').value = cfg.ghImgFolder || 'img/a';
  document.getElementById('ghToken').value = cfg.ghToken || '';
}

function saveSettings() {
  const c = {
    ghUser: document.getElementById('ghUser').value.trim(),
    ghRepo: document.getElementById('ghRepo').value.trim(),
    ghBranch: document.getElementById('ghBranch').value.trim() || 'main',
    ghPath: document.getElementById('ghPath').value.trim() || 'a/a.json',
    ghImgFolder: document.getElementById('ghImgFolder').value.trim() || 'img/a',
    ghToken: document.getElementById('ghToken').value.trim()
  };
  if (!c.ghUser || !c.ghRepo || !c.ghToken) {
    setStatus('settingsStatus','err','❌ أكمل جميع الحقول');
    return;
  }
  localStorage.setItem('attdes_cfg', JSON.stringify(c));
  cfg = c;
  setStatus('settingsStatus','ok','✅ تم الحفظ');
  setTimeout(() => {
    closeSettings();
    loadFromGitHub();
  }, 900);
}

function resetSettings() {
  if (!confirm('سيتم مسح الإعدادات وستحتاج إدخالها مرة أخرى. متابعة؟')) return;
  localStorage.removeItem('attdes_cfg');
  location.reload();
}

/* ============================================================
   GitHub API
   ============================================================ */
const API = 'https://api.github.com';

async function ghGet(path) {
  const r = await fetch(`${API}/repos/${cfg.ghUser}/${cfg.ghRepo}/contents/${path}?ref=${cfg.ghBranch}&t=${Date.now()}`, {
    headers: {
      'Authorization': `token ${cfg.ghToken}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('فشل الجلب: ' + r.status);
  return r.json();
}

async function ghPut(path, contentBase64, message, shaToUse) {
  const body = { message, content: contentBase64, branch: cfg.ghBranch };
  if (shaToUse) body.sha = shaToUse;
  const r = await fetch(`${API}/repos/${cfg.ghUser}/${cfg.ghRepo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${cfg.ghToken}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error('فشل الحفظ: ' + r.status);
  }
  return r.json();
}

/* ============================================================
   تحميل a.json
   ============================================================ */
async function loadFromGitHub() {
  if (!cfg.ghUser) return;
  setStatus('jsonStatus','info','⏳ جاري التحميل...');
  try {
    const file = await ghGet(cfg.ghPath);
    if (!file) {
      mods = [];
      currentJsonSha = null;
    } else {
      currentJsonSha = file.sha;
      const content = decodeURIComponent(escape(atob(file.content.replace(/\n/g,''))));
      mods = JSON.parse(content);
    }
    renderJson();
    renderModsList();
    setStatus('jsonStatus','ok',`✅ تم التحميل — ${mods.length} مود`);
  } catch(e) {
    setStatus('jsonStatus','err','❌ ' + e.message);
  }
}

function renderJson() {
  document.getElementById('jsonContent').textContent = JSON.stringify(mods, null, 2);
}

function copyJson() {
  const text = JSON.stringify(mods, null, 2);
  navigator.clipboard.writeText(text).then(() => {
    setStatus('jsonStatus','ok','✅ تم النسخ');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    setStatus('jsonStatus','ok','✅ تم النسخ');
  });
}

function downloadJson() {
  const blob = new Blob([JSON.stringify(mods, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `a-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ============================================================
   معاينة الصورة (تحويل المسار إلى رابط raw)
   ============================================================ */
function toDisplayUrl(path) {
  if (!path) return '';
  if (path.startsWith('http')) return path;
  // مسار نسبي مثل ../img/a/1.jpg → رابط raw
  const clean = path.replace(/^\.\.\//, '').replace(/^\//, '');
  return `https://raw.githubusercontent.com/${cfg.ghUser}/${cfg.ghRepo}/${cfg.ghBranch}/${clean}`;
}

/* ============================================================
   رفع الصورة إلى GitHub في img/a/{id}.{ext}
   ============================================================ */
async function uploadImage(event) {
  const file = event.target.files[0];
  if (!file) return;

  // نتحقق من الـ ID
  let id = parseInt(document.getElementById('f_id').value);
  if (!id) {
    // توليد تلقائي
    id = mods.length > 0 ? Math.max(...mods.map(m => m.n)) + 1 : 1;
    document.getElementById('f_id').value = id;
  }

  if (file.size > 5 * 1024 * 1024) {
    setStatus('publishStatus','err','❌ حجم الصورة كبير (الحد 5MB)');
    return;
  }

  setStatus('publishStatus','info','⏳ جاري رفع الصورة إلى GitHub...');

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const filename = `${id}.${ext}`;
  const repoPath = `${cfg.ghImgFolder}/${filename}`;

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const b64 = reader.result.split(',')[1];

      // نتحقق إن كان الملف موجوداً لنحصل على sha
      let existingSha = null;
      try {
        const existing = await ghGet(repoPath);
        if (existing) existingSha = existing.sha;
      } catch(e) {}

      await ghPut(repoPath, b64, `رفع صورة المود ${id}`, existingSha);

      // المسار النسبي من a/N.html إلى img/a/N.ext
      const relativePath = `../${cfg.ghImgFolder}/${filename}`;
      document.getElementById('f_imageUrl').value = relativePath;
      document.getElementById('imgPreviewSrc').src = toDisplayUrl(relativePath);
      document.getElementById('imgPreview').style.display = 'block';

      setStatus('publishStatus','ok',`✅ تم رفع الصورة: ${repoPath}`);
    } catch(e) {
      setStatus('publishStatus','err','❌ ' + e.message);
    }
  };
  reader.readAsDataURL(file);
}

async function uploadImageEdit(event) {
  const file = event.target.files[0];
  if (!file) return;

  let id = parseInt(document.getElementById('edit_n').value);
  if (!id) {
    setStatus('editStatus','err','❌ حدّد الـ ID أولاً');
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    setStatus('editStatus','err','❌ حجم الصورة كبير (الحد 5MB)');
    return;
  }

  setStatus('editStatus','info','⏳ جاري الرفع...');

  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const filename = `${id}.${ext}`;
  const repoPath = `${cfg.ghImgFolder}/${filename}`;

  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const b64 = reader.result.split(',')[1];
      let existingSha = null;
      try {
        const existing = await ghGet(repoPath);
        if (existing) existingSha = existing.sha;
      } catch(e) {}

      await ghPut(repoPath, b64, `تحديث صورة المود ${id}`, existingSha);

      const relativePath = `../${cfg.ghImgFolder}/${filename}`;
      document.getElementById('edit_i').value = relativePath;
      document.getElementById('editImgPreviewSrc').src = toDisplayUrl(relativePath);
      document.getElementById('editImgPreview').style.display = 'block';

      setStatus('editStatus','ok',`✅ تم الرفع`);
    } catch(e) {
      setStatus('editStatus','err','❌ ' + e.message);
    }
  };
  reader.readAsDataURL(file);
}

/* ============================================================
   نشر مود جديد
   ============================================================ */
async function publishMod() {
  const n = parseInt(document.getElementById('f_id').value);
  const t = document.getElementById('f_title').value.trim();
  const d = document.getElementById('f_desc').value.trim();
  const i = document.getElementById('f_imageUrl').value.trim();
  const l = document.getElementById('f_link').value.trim();

  if (!n || !t || !d || !i || !l) {
    setStatus('publishStatus','err','❌ أكمل جميع الحقول');
    return;
  }
  if (mods.some(m => m.n === n)) {
    setStatus('publishStatus','err','❌ هذا الـ ID مستخدم مسبقاً');
    return;
  }

  setStatus('publishStatus','info','⏳ جاري النشر...');

  mods.push({ n, t, d, i, l });
  mods.sort((a,b) => a.n - b.n);

  try {
    const content = JSON.stringify(mods, null, 2);
    const b64 = btoa(unescape(encodeURIComponent(content)));
    const msg = `إضافة مود: ${t} (ID: ${n})`;
    const result = await ghPut(cfg.ghPath, b64, msg, currentJsonSha);
    currentJsonSha = result.content.sha;

    renderJson();
    renderModsList();

    document.getElementById('f_id').value = '';
    document.getElementById('f_title').value = '';
    document.getElementById('f_desc').value = '';
    document.getElementById('f_image').value = '';
    document.getElementById('f_imageUrl').value = '';
    document.getElementById('f_link').value = '';
    document.getElementById('imgPreview').style.display = 'none';

    setStatus('publishStatus','ok',`✅ تم نشر المود رقم ${n} — سيظهر خلال دقيقة`);
  } catch(e) {
    mods = mods.filter(m => m.n !== n);
    setStatus('publishStatus','err','❌ ' + e.message);
  }
}

/* ============================================================
   قائمة المودات
   ============================================================ */
function renderModsList() {
  const q = (document.getElementById('searchInput').value || '').toLowerCase();
  const list = document.getElementById('modsList');
  const filtered = mods.filter(m => {
    if (!q) return true;
    return (m.t||'').toLowerCase().includes(q) || String(m.n).includes(q);
  });

  document.getElementById('modsCount').textContent = `${filtered.length} من ${mods.length}`;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><span class="icon">📭</span>لا توجد مودات</div>';
    return;
  }

  list.innerHTML = filtered
    .sort((a,b) => a.n - b.n)
    .map(m => `
      <div class="mod-item">
        <img src="${toDisplayUrl(m.i)}" alt="" onerror="this.style.opacity=0.15">
        <div class="mod-info">
          <div class="title">
            <span class="id-badge">#${m.n}</span>
            ${escapeHtml(m.t || 'بدون عنوان')}
          </div>
          <div class="meta">${escapeHtml((m.d||'').slice(0,80))}${(m.d||'').length > 80 ? '...' : ''}</div>
        </div>
        <div class="mod-actions">
          <button class="btn-secondary" onclick="openEdit(${m.n})">✏️ تعديل</button>
          <button class="btn-danger" onclick="deleteMod(${m.n})">🗑️ حذف</button>
        </div>
      </div>
    `).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   تعديل
   ============================================================ */
function openEdit(n) {
  const m = mods.find(x => x.n === n);
  if (!m) return;
  currentEditId = n;
  document.getElementById('editIdLabel').textContent = n;
  document.getElementById('edit_t').value = m.t || '';
  document.getElementById('edit_d').value = m.d || '';
  document.getElementById('edit_i').value = m.i || '';
  document.getElementById('edit_l').value = m.l || '';
  document.getElementById('edit_n').value = m.n;

  const prev = document.getElementById('editImgPreview');
  const src = document.getElementById('editImgPreviewSrc');
  if (m.i) {
    src.src = toDisplayUrl(m.i);
    prev.style.display = 'block';
  } else {
    prev.style.display = 'none';
  }

  document.getElementById('editModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeEdit() {
  document.getElementById('editModal').style.display = 'none';
  document.body.style.overflow = '';
  document.getElementById('editStatus').className = 'status';
  currentEditId = null;
}

async function saveEdit() {
  const t = document.getElementById('edit_t').value.trim();
  const d = document.getElementById('edit_d').value.trim();
  const i = document.getElementById('edit_i').value.trim();
  const l = document.getElementById('edit_l').value.trim();
  const nNew = parseInt(document.getElementById('edit_n').value);

  if (!t || !d || !i || !l || !nNew) {
    setStatus('editStatus','err','❌ أكمل جميع الحقول');
    return;
  }
  if (nNew !== currentEditId && mods.some(m => m.n === nNew)) {
    setStatus('editStatus','err','❌ الـ ID مستخدم مسبقاً');
    return;
  }

  setStatus('editStatus','info','⏳ جاري الحفظ...');

  const backup = JSON.parse(JSON.stringify(mods));
  const idx = mods.findIndex(m => m.n === currentEditId);
  mods[idx] = { n: nNew, t, d, i, l };
  mods.sort((a,b) => a.n - b.n);

  try {
    const content = JSON.stringify(mods, null, 2);
    const b64 = btoa(unescape(encodeURIComponent(content)));
    const result = await ghPut(cfg.ghPath, b64, `تعديل مود #${currentEditId}`, currentJsonSha);
    currentJsonSha = result.content.sha;

    renderJson();
    renderModsList();
    setStatus('editStatus','ok','✅ تم الحفظ');
    setTimeout(closeEdit, 800);
  } catch(e) {
    mods = backup;
    setStatus('editStatus','err','❌ ' + e.message);
  }
}

/* ============================================================
   حذف
   ============================================================ */
async function deleteMod(n) {
  const m = mods.find(x => x.n === n);
  if (!m) return;
  if (!confirm(`حذف المود رقم ${n}؟\n"${m.t}"\n\n(لن تُحذف الصورة من GitHub)`)) return;

  const backup = JSON.parse(JSON.stringify(mods));
  mods = mods.filter(x => x.n !== n);

  try {
    const content = JSON.stringify(mods, null, 2);
    const b64 = btoa(unescape(encodeURIComponent(content)));
    const result = await ghPut(cfg.ghPath, b64, `حذف مود #${n}`, currentJsonSha);
    currentJsonSha = result.content.sha;
    renderJson();
    renderModsList();
  } catch(e) {
    mods = backup;
    alert('فشل الحذف: ' + e.message);
  }
}

/* ============================================================
   مساعد
   ============================================================ */
function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'status ' + (type ? 'show ' + type : '');
  el.textContent = msg || '';
  if (type === 'ok') {
    setTimeout(() => {
      if (el.textContent === msg) {
        el.className = 'status';
        el.textContent = '';
      }
    }, 3500);
  }
}

/* ============================================================
   التهيئة
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  if (loadSettings()) {
    loadFromGitHub();
  }
});
</script>
