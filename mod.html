<script>

  /* =========================================
     مصدر ملف JSON الجديد
     ========================================= */

  const JSON_URL = 'https://modslib.attdes.online/mod.json';

  /* رابط الإعلان */
  const SMART_LINK =
    'https://www.effectivecpmnetwork.com/qyw9rwgjh?key=ddfcf2ad5cc5d88d9d75ec98a1a7548b';


  /* =========================================
     فك Base64
     ========================================= */

  function decodeBase64(str) {
    try {
      return decodeURIComponent(
        atob(str)
          .split('')
          .map(c =>
            '%' +
            ('00' + c.charCodeAt(0).toString(16)).slice(-2)
          )
          .join('')
      );
    } catch (e) {
      return str;
    }
  }


  /* =========================================
     قراءة id من الرابط
     مثال:
     ?id=1
     ?id=15
     ?id=001
     ========================================= */

  const urlParams = new URLSearchParams(window.location.search);
  const modId = urlParams.get('id');

  const msgEl = document.getElementById('statusMsg');
  const dlBtn = document.getElementById('dlBtn');


  /* =========================================
     التأكد من وجود ID
     ========================================= */

  if (!modId) {

    msgEl.innerText =
      '⚠️ خطأ: لم يتم تحديد رقم المود في الرابط!';

    msgEl.style.color = '#f87171';

  } else {

    /* =========================================
       جلب mod.json
       ========================================= */

    fetch(JSON_URL)

      .then(res => {

        if (!res.ok) {
          throw new Error(
            'HTTP Error: ' + res.status
          );
        }

        return res.json();

      })

      .then(data => {

        /* =====================================
           البحث عن ID داخل JSON
           ===================================== */

        if (data && Object.prototype.hasOwnProperty.call(data, modId)) {

          const encodedUrl = data[modId];

          const originalUrl =
            decodeBase64(encodedUrl);


          /* ===================================
             تفعيل زر التحميل
             =================================== */

          dlBtn.classList.remove('disabled');

          dlBtn.innerText =
            'تحميل الملف الآن 📥';


          /* ===================================
             زر التحميل
             =================================== */

          dlBtn.addEventListener('click', function(e) {

            e.preventDefault();

            /*
             * فتح الإعلان
             */
            window.open(
              SMART_LINK,
              '_blank'
            );


            /*
             * الانتقال إلى رابط الملف
             */
            setTimeout(() => {

              window.location.href =
                originalUrl;

            }, 300);

          });


          /* ===================================
             رسالة النجاح
             =================================== */

          msgEl.innerText =
            '✅ الملف جاهز للتحميل أدناه';

          msgEl.style.color =
            '#4ade80';


        } else {

          /* ===================================
             ID غير موجود
             =================================== */

          msgEl.innerText =
            '❌ عذراً، هذا المود غير موجود.';

          msgEl.style.color =
            '#f87171';

        }

      })

      .catch(err => {

        console.error(
          'JSON Error:',
          err
        );

        msgEl.innerText =
          '❌ فشل الاتصال بملف البيانات.';

        msgEl.style.color =
          '#f87171';

      });

  }
