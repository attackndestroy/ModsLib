<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المودات - الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base: #060709; --bg-surface: #0d0f14; --bg-card: #13161f; --accent-yellow: #ffcc00; --text-main: #f3f4f6; --text-muted: #8b92a5; --metal-border: #242938; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Cairo', sans-serif; padding-bottom: 50px; }
        header { background: var(--bg-surface); border-bottom: 2px solid var(--metal-border); padding: 15px; text-align: center; }
        header img { max-height: 60px; }
        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
        .feed { display: flex; flex-direction: column; gap: 25px; }
        .card { background: var(--bg-card); border: 1px solid var(--metal-border); border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-body { padding: 20px; }
        .title { font-size: 20px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .desc { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }
        .btn { display: inline-block; background: transparent; color: var(--accent-yellow); border: 1px solid var(--accent-yellow); padding: 10px 20px; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 13px; text-decoration: none; border-radius: 2px; transition: 0.2s; }
        .btn:hover { background: var(--accent-yellow); color: #000; }
    </style>
</head>
<body>
    <header>
        <img src="https://attdes.online/header.png" alt="Logo">
    </header>
    <div class="container">
        <div class="feed" id="mods-feed">
            <p style="text-align:center; color:var(--text-muted);">جاري تحميل المودات...</p>
        </div>
    </div>

    <script>
        async function loadIndex() {
            try {
                let res = await fetch('mods.json');
                let mods = await res.json();
                let feed = document.getElementById('mods-feed');
                feed.innerHTML = '';

                // تصفية العناصر التي تخص الواجهة أو عرض العناصر التي نوعها m/i
                let filtered = mods.filter(m => m.type === 'i' || m.type === 'm');

                filtered.forEach(mod => {
                    let card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${mod.image_url}" alt="${mod.title}">
                        <div class="card-body">
                            <h2 class="title">${mod.title}</h2>
                            <p class="desc">${mod.description}</p>
                            <a href="tomod.html?id=${mod.id}" class="btn">الانتقال لصفحة التحميل</a>
                        </div>
                    `;
                    feed.appendChild(card);
                });
            } catch (e) {
                document.getElementById('mods-feed').innerHTML = '<p style="text-align:center; color:#ff4444;">تعذر تحميل البيانات.</p>';
            }
        }
        loadIndex();
    </script>
</body>
</html>
