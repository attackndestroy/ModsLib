    <!-- JSON Fetch & Base64 Seed Copy Logic Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const seedId = urlParams.get('id');
            const seedDisplay = document.getElementById('seedDisplay');
            const copyBtn = document.getElementById('copyBtn');

            if (seedId) {
                // Fetch seed.json file
                fetch('seed.json')
                    .then(response => {
                        if (!response.ok) throw new Error('Network response error');
                        return response.json();
                    })
                    .then(data => {
                        if (data && data[seedId]) {
                            try {
                                // Decode base64 seed
                                const decodedSeed = atob(data[seedId]);
                                seedDisplay.textContent = decodedSeed;

                                // Copy functionality
                                copyBtn.onclick = function() {
                                    navigator.clipboard.writeText(decodedSeed).then(() => {
                                        copyBtn.textContent = 'تم النسخ! ✓';
                                        copyBtn.style.backgroundColor = '#28a745';
                                        copyBtn.style.color = '#ffffff';
                                        
                                        setTimeout(() => {
                                            copyBtn.textContent = 'نسخ Copy';
                                            copyBtn.style.backgroundColor = 'var(--accent-color)';
                                            copyBtn.style.color = '#000000';
                                        }, 2000);
                                    }).catch(() => {
                                        seedDisplay.select();
                                    });
                                };
                            } catch (e) {
                                seedDisplay.textContent = 'خطأ في الترميز';
                            }
                        } else {
                            seedDisplay.textContent = 'غير موجود';
                        }
                    })
                    .catch(error => {
                        seedDisplay.textContent = 'خطأ في الجلب';
                    });
            } else {
                seedDisplay.textContent = 'غير محدد id';
            }
        });
    </script>
