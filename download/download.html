<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صفحة التحميل</title>
  <link rel="icon" href="https://ModsLib.attdes.online/assets/fav.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#52c41a;--primary-dark:#389e0d;--bg:#f5f5f5;--card:#fff;--text:#262626;--muted:#8c8c8c}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{text-decoration:none;color:inherit}
    header{background:linear-gradient(135deg,#52c41a,#237804);color:#fff;padding:12px 20px}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
    .header-inner img{height:40px;width:auto}
    .header-inner .site-name{font-weight:800;font-size:1.2rem;color:#fff}
    main{max-width:700px;margin:0 auto;padding:32px 20px 60px}
    .back{display:inline-block;margin-bottom:16px;color:var(--primary);font-weight:700;padding:8px 14px;border-radius:8px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06)}
    .ads-slot{margin:16px auto;text-align:center;min-height:60px}
    .download-box{background:var(--card);border-radius:16px;padding:40px 28px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08)}
    .icon{font-size:4rem;margin-bottom:16px;display:block}
    h1{font-size:1.7rem;margin-bottom:12px;line-height:1.4}
    .btn{display:inline-block;padding:16px 44px;background:var(--primary);color:#fff!important;border-radius:12px;font-weight:800;font-size:1.15rem;transition:background .2s;border:none;cursor:pointer;font-family:inherit}
    .btn:hover{background:var(--primary-dark)}
    .loading-text{text-align:center;padding:50px;color:var(--muted);font-size:1.2rem}
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="../index.html" target="_top"><img src="https://ModsLib.attdes.online/assets/banner.png" alt="Banner" /></a>
      <span class="site-name">Minecraft Mods</span>
    </div>
  </header>

  <div class="ads-slot">
    <script src="https://ModsLib.attdes.online/scripts/banner320-50.js"></script>
  </div>

  <main>
    <a href="../index.html" target="_top" class="back">← رجوع للرئيسية</a>

    <div class="ads-slot">
      <script src="https://ModsLib.attdes.online/scripts/native.js"></script>
    </div>

    <div id="content"><div class="loading-text">⏳ جاري تحميل رابط المود...</div></div>

    <div class="ads-slot">
      <script src="https://ModsLib.attdes.online/scripts/banner320-50.js"></script>
    </div>
  </main>

  <div class="ads-slot">
    <script src="https://ModsLib.attdes.online/scripts/banner320-50.js"></script>
  </div>

  <div class="ads-slot">
    <script src="https://ModsLib.attdes.online/scripts/socialbar.js"></script>
  </div>

  <script src="https://ModsLib.attdes.online/scripts/pop.js"></script>
</body>
</html>
