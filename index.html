<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATTACK N' DESTROY - الرهيب</title>
    <link rel="icon" href="/fav.ico">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <script src="/stats.js" async></script>
    <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
    <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --accent: #ffde00;
            --text: #ffffff;
            --gray: #888888;
            --border: #222222;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0, rgba(255,255,255,0.01) 1px, transparent 0, transparent 50px);
        }
        header {
            width: 100%;
            border-bottom: 2px solid var(--accent);
            background: var(--card-bg);
            text-align: center;
        }
        header img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            display: block;
        }
        .ad-banner-top {
            text-align: center;
            margin: 15px auto;
        }
        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 20px;
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            outline: none;
            clip-path: polygon(0 0, 100% 0, 98% 100%, 2% 100%);
            transition: 0.3s;
        }
        .search-box:focus { border-color: var(--accent); }
        .btn-sort {
            background: var(--card-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 20px;
            font-family: 'Oswald', sans-serif;
            cursor: pointer;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            transition: 0.3s;
        }
        .btn-sort:hover { background: var(--accent); color: var(--bg-color); }
        .feed-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 95%, 97% 100%, 0 100%);
            transition: transform 0.3s, border-color 0.3s;
        }
        .post-card:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }
        .post-img-container {
            width: 100%;
            aspect-ratio: 16/9;
            overflow: hidden;
            background: #000;
        }
        .post-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .post-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.5rem;
            color: var(--text);
            margin: 15px 0 10px 0;
        }
        .btn-details {
            display: inline-block;
            background: var(--accent);
            color: var(--bg-color);
            padding: 8px 25px;
            font-family: 'Oswald', sans-serif;
            text-decoration: none;
            font-weight: bold;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
            transition: 0.3s;
        }
        .btn-details:hover { opacity: 0.85; transform: scale(1.02); }
        .load-more-container {
            text-align: center;
            margin: 40px 0;
        }
        .btn-load-more {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 12px 40px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0 100%);
            transition: 0.3s;
        }
        .btn-load-more:hover { background: var(--accent); color: var(--bg-color); }
        .dynamic-banner {
            margin: 20px 0;
            text-align: center;
            width: 100%;
        }
        footer {
            background: var(--card-bg);
            border-top: 2px solid var(--border);
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            font-family: 'Oswald', sans-serif;
        }
        footer span { color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <img src="/header.png" alt="Header Banner" onerror="this.src='https://via.placeholder.com/1200x250/141414/ffde00?text=ATTACK+N+DESTROY'">
    </header>

    <div class="ad-banner-top">
        <script async="async" data-cfasync="false" src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js"></script>
        <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
    </div>

    <div class="container">
        <div class="dynamic-banner">
            <script src="/320-50.js"></script>
        </div>

        <div class="controls">
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن المودات...">
            <button id="sortBtn" class="btn-sort">ترتيب: الأحدث</button>
        </div>

        <div id="feedGrid" class="feed-grid"></div>

        <div class="load-more-container">
            <button id="loadMoreBtn" class="btn-load-more" style="display: none;">إظهار المزيد</button>
        </div>
    </div>

    <footer>
        Copyright: <span id="footerBrand">ATTACK N' DESTROY</span><br>
        Powered By: <span id="footerBrand2">ATTACK N' DESTROY</span>
    </footer>

    <script>
        let allPosts = [];
        let displayedCount = 10;
        let sortOrder = 'desc'; // desc = newest, asc = oldest

        async function fetchPosts() {
            try {
                const res = await fetch('/mods.json');
                const data = await res.json();
                allPosts = data.map(item => ({
                    id: item.id,
                    title: atob(item.title),
                    description: atob(item.description),
                    image: atob(item.image),
                    download: atob(item.download)
                }));
                // Sort by ID descending by default
                sortPostsData();
                renderFeed();
            } catch (e) {
                console.error("Error loading mods.json", e);
            }
        }

        function sortPostsData() {
            allPosts.sort((a, b) => {
                let idA = parseInt(a.id) || 0;
                let idB = parseInt(b.id) || 0;
                return sortOrder === 'desc' ? idB - idA : idA - idB;
            });
        }

        function renderFeed() {
            const grid = document.getElementById('feedGrid');
            grid.innerHTML = '';
            
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPosts.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
            
            const slice = filtered.slice(0, displayedCount);

            slice.forEach((post, index) => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-img-container">
                        <img src="${post.image}" alt="${post.title}" loading="lazy">
                    </div>
                    <h2 class="post-title">${post.title}</h2>
                    <a href="/tomod.html?id=${post.id}" class="btn-details">عرض التفاصيل</a>
                `;
                grid.appendChild(card);

                // Dynamic responsive 320x50 ad iframe after every post in feed
                if (index < slice.length - 1) {
                    const adDiv = document.createElement('div');
                    adDiv.className = 'dynamic-banner';
                    adDiv.innerHTML = `<iframe src="/320-50.js" style="width:100%; height:50px; border:none; overflow:hidden;" scrolling="no"></iframe>`;
                    grid.appendChild(adDiv);
                }
            });

            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (displayedCount < filtered.length) {
                loadMoreBtn.style.display = 'inline-block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            displayedCount += 10;
            renderFeed();
        });

        document.getElementById('searchInput').addEventListener('input', () => {
            displayedCount = 10;
            renderFeed();
        });

        document.getElementById('sortBtn').addEventListener('click', () => {
            sortOrder = sortOrder === 'desc' ? 'asc' : 'desc';
            document.getElementById('sortBtn').innerText = `ترتيب: ${sortOrder === 'desc' ? 'الأحدث' : 'الأقدم'}`;
            sortPostsData();
            renderFeed();
        });

        fetchPosts();
    </script>
</body>
</html>
