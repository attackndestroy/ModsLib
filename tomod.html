<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل المود - منصة ماين كرافت</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060709;
            --bg-surface: #0d0f14;
            --bg-card: #13161f;
            --accent-yellow: #ffcc00;
            --accent-yellow-glow: rgba(255, 204, 0, 0.2);
            --text-main: #f3f4f6;
            --text-muted: #8b92a5;
            --metal-border: #242938;
            --metal-border-bright: #3d465c;
            --metal-sheen: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            background-image: 
                linear-gradient(rgba(255,204,0,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,204,0,0.02) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        header {
            width: 100%;
            background: var(--bg-surface);
            border-bottom: 2px solid var(--metal-border-bright);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
        }
        header img { max-height: 65px; width: auto; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }

        .download-box {
            background: var(--bg-card);
            border: 1px solid var(--metal-border);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
        }

        .download-box::after { content: ""; position: absolute; inset: 0; background: var(--metal-sheen); pointer-events: none; }

        .mod-img { width: 100%; height: 350px; object-fit: cover; border-bottom: 1px solid var(--metal-border); }

        .content-padding { padding: 30px; position: relative; z-index: 1; }

        .tags-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .tag { background: rgba(255, 204, 0, 0.06); color: var(--accent-yellow); border: 1px solid rgba(255, 204, 0, 0.2); padding: 3px 10px; font-size: 11px; font-weight: 700; font-family: 'Orbitron', sans-serif; text-transform: uppercase; border-radius: 2px; }

        .title { font-size: 26px; font-weight: 900; color: var(--text-main); margin-bottom: 15px; line-height: 1.3; }
        .date { font-size: 13px; color: var(--text-muted); font-family: 'Orbitron', sans-serif; margin-bottom: 20px; }
        .desc { font-size: 15px; color: var(--text-muted); line-height: 1.7; margin-bottom: 35px; }

        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--accent-yellow);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 16px;
            padding: 16px 30px;
            text-decoration: none;
            border-radius: 3px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            box-shadow: 0 0 20px var(--accent-yellow-glow);
        }
        .download-btn:hover { background: #ffea66; transform: translateY(-2px); }
        .download-btn svg { width: 20px; height: 20px; fill: #000; }

        .back-link { display: inline-block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 14px; font-family: 'Orbitron', sans-serif; }
        .back-link:hover { color: var(--accent-yellow); }
    </style>
</head>
<body>

    <header>
        <img src="https://attdes.online/header.png" alt="Header">
    </header>

    <div class="container" id="details-container">
        <p style="text-align:center; color:var(--text-muted); font-family:'Orbitron';">جاري تحميل تفاصيل المود...</p>
    </div>

    <script>
        async function loadModDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const modId = urlParams.get('id');

            if (!modId) {
                document.getElementById('details-container').innerHTML = '<p style="color:var(--accent-yellow); text-align:center;">معرف المود غير موجود.</p>';
                return;
            }

            try {
                // قراءة ملف tomod.json الذي يحتوي على روابط التحميل والروابط الكاملة
                let res = await fetch('tomod.json');
                let mods = await res.json();
                
                let mod = mods.find(m => m.id === modId);

                if (!mod) {
                    document.getElementById('details-container').innerHTML = '<p style="color:var(--accent-yellow); text-align:center;">المود المطلوبة غير متوفرة.</p>';
                    return;
                }

                let tagsHtml = mod.tags ? mod.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';

                document.getElementById('details-container').innerHTML = `
                    <div class="download-box">
                        <img src="${mod.image_url}" alt="${mod.title}" class="mod-img">
                        <div class="content-padding">
                            <div class="tags-row">${tagsHtml}</div>
                            <h1 class="title">${mod.title}</h1>
                            <div class="date">تاريخ ووقت الرفع: ${mod.date_time || ''}</div>
                            <p class="desc">${mod.description}</p>
                            <a href="${mod.download_url}" target="_blank" class="download-btn">
                                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                تحميل المود الآن
                            </a>
                        </div>
                    </div>
                    <a href="index.html" class="back-link">&#8592; العودة إلى القائمة الرئيسية</a>
                `;
            } catch (err) {
                console.error(err);
                document.getElementById('details-container').innerHTML = '<p style="color:var(--accent-yellow); text-align:center;">حدث خطأ أثناء جلب تفاصيل المود.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadModDetails);
    </script>
</body>
</html>
