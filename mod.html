    <!-- Instant Click Logic Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const modId = urlParams.get('id');
            const downloadBtn = document.getElementById('modDownloadBtn');

            if (modId) {
                fetch('mod.json')
                    .then(response => {
                        if (!response.ok) throw new Error('Network response was not ok');
                        return response.json();
                    })
                    .then(data => {
                        if (data && data[modId]) {
                            try {
                                const decodedUrl = atob(data[modId]);
                                downloadBtn.href = decodedUrl;

                                downloadBtn.onclick = function() {
                                    window.location.href = decodedUrl;
                                    return false;
                                };
                            } catch (e) {
                                console.error('Base64 Decoding Error:', e);
                                downloadBtn.onclick = function(e) {
                                    e.preventDefault();
                                    alert('خطأ في رابط التحميل المشفّر.');
                                };
                            }
                        } else {
                            downloadBtn.onclick = function(e) {
                                e.preventDefault();
                                alert('عذراً، المود غير موجود.');
                            };
                        }
                    })
                    .catch(error => {
                        console.error('Error fetching mod.json:', error);
                        downloadBtn.onclick = function(e) {
                            e.preventDefault();
                            alert('تعذر تحميل بيانات المود.');
                        };
                    });
            } else {
                downloadBtn.onclick = function(e) {
                    e.preventDefault();
                    alert('لم يتم تحديد معرف المود (id).');
                };
            }
        });
    </script>
