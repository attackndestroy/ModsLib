<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>ModsLib - Main Menu</title>
    
    <link rel="icon" type="image/x-icon" href="https://attdes.online/fav.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="https://attdes.online/fav.ico" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --metal-yellow: #ffde00;
            --metal-yellow-glow: rgba(255, 222, 0, 0.4);
            --metal-dark: #0a0a0a;
            --metal-card: #141414;
            --metal-border: #282828;
            --metal-gray: #888888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: hidden; font-size: 16px; scroll-behavior: smooth; }
        
        body {
            background-color: var(--metal-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 222, 0, 0.05) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.2) 0, rgba(0,0,0,0.2) 2px, transparent 0, transparent 4px);
            color: #f0f0f0;
            font-family: 'Cairo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6; 
            overflow-x: hidden; 
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        a { color: var(--metal-yellow); text-decoration: none; transition: 0.2s; }
        a:hover { text-shadow: 0 0 10px var(--metal-yellow-glow); }
        :focus-visible { outline: 2px solid var(--metal-yellow); outline-offset: 2px; }

        .site-header {
            background: #000000;
            padding: 1.2rem 1rem;
            text-align: center;
            border-bottom: 3px solid var(--metal-yellow);
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
            position: relative;
        }
        .site-header::after {
            content: '';
            position: absolute;
            bottom: -6px; left: 0; right: 0;
            height: 3px;
            background: repeating-linear-gradient(90deg, var(--metal-yellow) 0, var(--metal-yellow) 10px, transparent 10px, transparent 20px);
        }
        .header-logo { 
            max-width: 100%; height: auto; max-height: 90px; width: auto; 
            display: inline-block;
            filter: drop-shadow(0 2px 8px rgba(255, 222, 0, 0.2));
            transition: transform 0.3s ease;
        }
        .header-logo:hover { transform: scale(1.03); }

        .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; width: 100%; flex: 1; }

        .native-banner-wrapper, .social-bar-wrapper { text-align: center; margin: 1rem 0; overflow: hidden; }
        .native-banner-wrapper iframe, .social-bar-wrapper iframe { max-width: 100%; }

        /* تعديل حاوية البانر لتلائم حجمه تماماً بدون فراغات */
        .banner-between {
            margin: 1.5rem 0;
            text-align: center;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow: hidden;
        }
        .banner-between iframe {
            width: 320px;
            height: 50px;
            max-width: 100%;
            border: none;
            overflow: hidden;
            display: block;
        }

        .feed-controls {
            display: flex; gap: 0.8rem; margin-bottom: 2rem;
            flex-wrap: wrap; justify-content: center;
        }
        .btn-sort {
            background: #1a1a1a; 
            color: var(--metal-gray); 
            border: 2px solid #333;
            padding: 0.6rem 1.5rem; 
            border-radius: 0px;
            font-family: 'Oswald', 'Cairo', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.1rem;
            cursor: pointer; 
            transition: all 0.2s ease;
            font-weight: 700; 
            min-height: 48px; min-width: 100px;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
        }
        .btn-sort:hover { 
            background: #252525; 
            color: #fff; 
            border-color: #555;
        }
        .btn-sort.active {
            background: var(--metal-yellow); 
            color: #000; 
            border-color: var(--metal-yellow);
            box-shadow: 0 0 15px var(--metal-yellow-glow);
            text-shadow: none;
        }

        .feed { display: flex; flex-direction: column; gap: 2rem; }
        
        .mod-card {
            background: var(--metal-card); 
            border: 1px solid var(--metal-border);
            border-radius: 4px; 
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex; flex-direction: column;
            position: relative;
        }
        .mod-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--metal-border);
            transition: background 0.3s ease;
        }
        .mod-card:hover { 
            transform: translateY(-5px); 
            border-color: var(--metal-yellow);
            box-shadow: 0 12px 35px rgba(255, 222, 0, 0.15);
        }
        .mod-card:hover::before {
            background: var(--metal-yellow);
            box-shadow: 0 0 10px var(--metal-yellow);
        }

        .mod-card-image {
            width: 100%; background: #000; display: flex; align-items: center; justify-content: center;
            min-height: 180px; overflow: hidden; position: relative;
        }
        .mod-card-image img {
            width: 100%; height: auto; max-height: 320px; object-fit: cover; display: block;
            filter: contrast(1.1) saturate(0.9);
            transition: filter 0.3s ease, transform 0.5s ease;
        }
        .mod-card:hover .mod-card-image img {
            filter: contrast(1.2) saturate(1.1);
            transform: scale(1.03);
        }
        .mod-card-image-placeholder {
            width: 100%; padding: 2rem 1rem; text-align: center; color: var(--metal-gray); font-size: 1.2rem;
            background: #0d0d0d;
            font-family: 'Oswald', sans-serif;
            letter-spacing: 1px;
        }
        
        .mod-card-title {
            font-size: 1.35rem; 
            font-weight: 900; 
            color: #fff;
            padding: 1.2rem 1.2rem 0.4rem; 
            margin: 0; 
            line-height: 1.3;
            font-family: 'Oswald', 'Cairo', sans-serif;
            letter-spacing: 0.5px;
        }
        
        .mod-card-btn {
            display: inline-block; 
            background: var(--metal-yellow); 
            color: #000;
            font-weight: 900; 
            padding: 0.7rem 1.8rem; 
            border-radius: 0px;
            text-align: center; 
            transition: all 0.2s ease;
            border: none; 
            cursor: pointer; 
            font-size: 1rem; 
            min-height: 44px; min-width: 130px;
            align-self: flex-start; 
            margin: 0.8rem 1.2rem 1.2rem; 
            text-decoration: none; 
            line-height: 1.4;
            font-family: 'Oswald', 'Cairo', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            clip-path: polygon(8% 0, 100% 0, 92% 100%, 0% 100%);
        }
        .mod-card-btn:hover { 
            background: #fff; 
            color: #000;
            box-shadow: 0 0 20px var(--metal-yellow-glow);
            transform: translateY(-2px); 
        }
        .mod-card-btn:active { transform: scale(0.96); }

        .load-more-wrap { text-align: center; margin: 3rem 0 1.5rem; }
        .btn-load-more {
            background: transparent; 
            color: var(--metal-yellow); 
            border: 2px solid var(--metal-yellow);
            padding: 0.8rem 2.5rem; 
            border-radius: 0px; 
            font-size: 1.1rem;
            font-family: 'Oswald', 'Cairo', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer; 
            transition: all 0.3s ease;
            min-height: 50px; min-width: 180px;
            font-weight: 700;
            clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%);
        }
        .btn-load-more:hover { 
            background: var(--metal-yellow); 
            color: #000; 
            box-shadow: 0 0 25px var(--metal-yellow-glow);
        }

        .feed-status { text-align: center; padding: 2rem; color: var(--metal-gray); font-size: 1.1rem; font-family: 'Oswald', sans-serif; letter-spacing: 1px; }

        @media (max-width: 360px) {
            .container { padding: 0.6rem; }
            .mod-card-title { font-size: 1.15rem; padding: 0.8rem 1rem 0.2rem; }
            .mod-card-btn { font-size: 0.9rem; padding: 0.5rem 1.2rem; min-width: 110px; }
            .btn-sort { font-size: 0.95rem; padding: 0.4rem 1rem; min-width: 80px; }
        }
        @media (min-width: 600px) {
            .feed { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2rem; }
            .banner-between { grid-column: 1 / -1; }
        }
        @media (min-width: 900px) {
            .feed { grid-template-columns: repeat(3, 1fr); }
            .container { padding: 2rem 2.5rem; }
            .header-logo { max-height: 110px; }
        }
        @media (min-width: 1400px) {
            .container { max-width: 1300px; }
            .feed { grid-template-columns: repeat(4, 1fr); }
        }
        img, iframe, video { max-width: 100%; height: auto; }
        * { max-width: 100%; }
    </style>
    <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
    <script src="https://modslib.attdes.online/analytics.js"></script>
</head>
<body>

    <header class="site-header">
        <a href="index.html"><img src="https://attdes.online/header.png" alt="ATT/DES Logo" class="header-logo" /></a>
    </header>

    <div class="native-banner-wrapper">
        <script async="async" data-cfasync="false" src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js"></script>
        <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
    </div>

    <div class="social-bar-wrapper">
        <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
    </div>

    <main class="container">
        <div class="feed-controls">
            <button class="btn-sort active" data-sort="newest">أحدث (NEW)</button>
            <button class="btn-sort" data-sort="oldest">أقدم (OLD)</button>
        </div>
        <div id="feed" class="feed"></div>
        <div id="load-more-wrap" class="load-more-wrap">
            <button id="btn-load-more" class="btn-load-more">إظهار المزيد</button>
        </div>
        <div id="feed-status" class="feed-status"></div>
    </main>

    <script>
        (function() {
            'use strict';

            const feedEl = document.getElementById('feed');
            const statusEl = document.getElementById('feed-status');
            const loadMoreBtn = document.getElementById('btn-load-more');
            const sortBtns = document.querySelectorAll('.btn-sort');

            let allItems = [];
            let currentSort = 'newest';
            let visibleCount = 6;
            const PAGE_SIZE = 6;

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function isNumericId(id) {
                if (typeof id === 'number') return true;
                if (typeof id === 'string') return /^[0-9]+$/.test(id);
                return false;
            }

            function getNumericValue(id) {
                if (typeof id === 'number') return id;
                if (typeof id === 'string' && /^[0-9]+$/.test(id)) return parseInt(id, 10);
                return null;
            }

            function sortItems(items, sortOrder) {
                const numeric = items.filter(item => isNumericId(item.id));
                const text = items.filter(item => !isNumericId(item.id));

                if (sortOrder === 'newest') {
                    numeric.sort((a, b) => getNumericValue(b.id) - getNumericValue(a.id));
                } else {
                    numeric.sort((a, b) => getNumericValue(a.id) - getNumericValue(b.id));
                }
                return numeric.concat(text);
            }

            function createBanner() {
                const wrapper = document.createElement('div');
                wrapper.className = 'banner-between';

                const iframe = document.createElement('iframe');
                iframe.width = '320';
                iframe.height = '50';
                iframe.style.border = 'none';
                iframe.style.overflow = 'hidden';
                iframe.style.maxWidth = '100%';
                iframe.scrolling = 'no';
                iframe.srcdoc = `
                    <html>
                    <head>
                        <style>
                            body { margin: 0; padding: 0; background: transparent; overflow: hidden; display: flex; justify-content: center; align-items: center; }
                            * { box-sizing: border-box; }
                        </style>
                    </head>
                    <body>
                        <script>
                            window.atOptions = {
                                'key' : '28d1f1f838ea883f1f7fc0d4733ebba6',
                                'format' : 'iframe',
                                'height' : 50,
                                'width' : 320,
                                'params' : {}
                            };
                        <\/script>
                        <script src="https://www.highrevenueformat.com/28d1f1f838ea883f1f7fc0d4733ebba6/invoke.js"><\/script>
                    </body>
                    </html>
                `;

                wrapper.appendChild(iframe);
                return wrapper;
            }

            function renderFeed(items) {
                const total = items.length;
                if (total === 0) {
                    feedEl.innerHTML = '';
                    statusEl.textContent = 'لا توجد منشورات.';
                    loadMoreBtn.style.display = 'none';
                    return;
                }

                const visible = items.slice(0, visibleCount);
                feedEl.innerHTML = '';

                visible.forEach(function(item, index) {
                    const card = document.createElement('div');
                    card.className = 'mod-card';

                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'mod-card-image';
                    if (item.image) {
                        const img = document.createElement('img');
                        img.src = item.image;
                        img.alt = item.title;
                        img.loading = 'lazy';
                        imgDiv.appendChild(img);
                    } else {
                        const placeholder = document.createElement('div');
                        placeholder.className = 'mod-card-image-placeholder';
                        placeholder.textContent = item.title || 'بدون عنوان';
                        imgDiv.appendChild(placeholder);
                    }
                    card.appendChild(imgDiv);

                    const title = document.createElement('h3');
                    title.className = 'mod-card-title';
                    title.textContent = item.title || 'بدون عنوان';
                    card.appendChild(title);

                    const btn = document.createElement('a');
                    btn.className = 'mod-card-btn';
                    btn.href = 'tomod.html?id=' + encodeURIComponent(item.id);
                    btn.textContent = 'عرض التفاصيل';
                    card.appendChild(btn);

                    feedEl.appendChild(card);

                    if (index < visible.length - 1) {
                        feedEl.appendChild(createBanner());
                    }
                });

                statusEl.textContent = '';
                if (visibleCount < total) {
                    loadMoreBtn.style.display = 'inline-block';
                    loadMoreBtn.textContent = 'إظهار المزيد (' + (total - visibleCount) + ' متبقي)';
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            }

            function applySortAndRender() {
                const sorted = sortItems(allItems, currentSort);
                renderFeed(sorted);
            }

            function loadData() {
                statusEl.textContent = 'جاري التحميل…';
                fetch('/mods.json')
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (typeof data !== 'object' || data === null) {
                            throw new Error('JSON غير صالح');
                        }
                        const keys = Object.keys(data);
                        if (keys.length === 0) {
                            statusEl.textContent = 'لا توجد بيانات.';
                            return;
                        }
                        allItems = keys.map(key => {
                            const item = data[key];
                            return {
                                id: key,
                                title: item.title || '',
                                image: item.image || ''
                            };
                        });
                        allItems = allItems.filter(item => item.title);
                        visibleCount = PAGE_SIZE;
                        applySortAndRender();
                    })
                    .catch(err => {
                        console.error(err);
                        statusEl.textContent = '⚠️ تعذر تحميل البيانات. تأكد من وجود /mods.json.';
                        feedEl.innerHTML = '';
                        loadMoreBtn.style.display = 'none';
                    });
            }

            sortBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const sort = this.dataset.sort;
                    if (sort === currentSort) return;
                    sortBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentSort = sort;
                    visibleCount = PAGE_SIZE;
                    applySortAndRender();
                });
            });

            loadMoreBtn.addEventListener('click', function() {
                const total = allItems.length;
                if (visibleCount < total) {
                    visibleCount = Math.min(visibleCount + PAGE_SIZE, total);
                    applySortAndRender();
                }
            });

            loadData();
        })();
    </script>

</body>
</html>
