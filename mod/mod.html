<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تفاصيل المود</title>
  <link rel="icon" href="https://modslib.attdes.online/assets/fav.ico" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--primary:#52c41a;--primary-dark:#389e0d;--bg:#f5f5f5;--card:#fff;--text:#262626;--muted:#8c8c8c}
    body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    a{text-decoration:none;color:inherit}
    header{background:linear-gradient(135deg,#52c41a,#237804);color:#fff;padding:12px 20px}
    .header-inner{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
    .header-inner img{height:40px;width:auto}
    .header-inner .site-name{font-weight:800;font-size:1.2rem;color:#fff}
    main{max-width:900px;margin:0 auto;padding:24px 20px 60px}
    .back{display:inline-block;margin-bottom:16px;color:var(--primary);font-weight:700;padding:8px 14px;border-radius:8px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.06)}
    .back:hover{background:#f0f0f0}
    .ads-slot{margin:16px auto;text-align:center;min-height:60px}
    .detail{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.08)}
    .detail-img{aspect-ratio:16/9;background:#e0e0e0;overflow:hidden}
    .detail-img img{width:100%;height:100%;object-fit:cover}
    .detail-body{padding:28px}
    .detail-body h1{font-size:1.8rem;margin-bottom:16px;line-height:1.3}
    .badge{display:inline-block;background:#e6f7d9;color:var(--primary-dark);padding:4px 12px;border-radius:20px;font-size:.85rem;font-weight:700;margin-bottom:16px}
    .detail-body p{color:#555;line-height:1.9;margin-bottom:24px;font-size:1.05rem}
    .btn{display:inline-block;padding:14px 32px;background:var(--primary);color:#fff!important;border-radius:10px;font-weight:800;font-size:1.05rem;transition:background .2s;border:none;cursor:pointer;font-family:inherit}
    .btn:hover{background:var(--primary-dark)}
    .error{padding:60px 20px;text-align:center;color:var(--muted)}
    .native-ad{margin:20px auto}
    @media(max-width:600px){.detail-body{padding:18px}.detail-body h1{font-size:1.4rem}}
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <!-- الرابط يعود للرئيسية -->
      <a href="index.html" target="_top"><img src="https://modslib.attdes.online/assets/banner.png" alt="Banner" /></a>
      <span class="site-name">Minecraft Mods</span>
    </div>
  </header>

  <!-- إعلان بانر 320x50 (1) -->
  <div class="ads-slot">
    <script src="https://modslib.attdes.online/scripts/banner320-50.js"></script>
  </div>

  <main>
    <!-- زر الرجوع يفتح الرئيسية في النافذة الأساسية وليس داخل الـ iframe -->
    <a href="index.html" target="_top" class="back">← رجوع للرئيسية</a>

    <!-- إعلان native (1) -->
    <div class="native-ad">
      <script src="https://modslib.attdes.online/scripts/native.js"></script>
    </div>

    <div id="content"><div class="error">جاري التحميل...</div></div>

    <!-- إعلان بانر 320x50 (2) -->
    <div class="ads-slot">
      <script src="https://modslib.attdes.online/scripts/banner320-50.js"></script>
    </div>

    <!-- إعلان native (2) -->
    <div class="native-ad">
      <script src="https://modslib.attdes.online/scripts/native.js"></script>
    </div>
  </main>

  <!-- إعلان بانر 320x50 (3) -->
  <div class="ads-slot">
    <script src="https://modslib.attdes.online/scripts/banner320-50.js"></script>
  </div>

  <!-- إعلان socialbar (مرة واحدة) -->
  <div class="ads-slot">
    <script src="https://modslib.attdes.online/scripts/socialbar.js"></script>
  </div>

  <!-- إعلان pop (مرة واحدة) -->
  <script src="https://modslib.attdes.online/scripts/pop.js"></script>

  <script>
    // 1. قراءة رقم المود من الرابط (مثال: mod.html?id=49)
    const params = new URLSearchParams(location.search);
    const id = parseInt(params.get('id'));

    async function load() {
      const content = document.getElementById('content');
      
      if (!id || isNaN(id)) {
        content.innerHTML = '<div class="error">⚠️ رقم المود غير صالح. تأكد من الرابط.</div>';
        return;
      }

      try {
        // 2. جلب البيانات من السيرفر الخاص بك
        const res = await fetch('https://modslib.attdes.online/jsons/1.json');
        const data = await res.json();
        const mods = Array.isArray(data) ? data : (data.mods || []);
        
        // 3. البحث عن المود المطلوب
        const mod = mods.find(m => m.n === id);

        if (!mod) {
          content.innerHTML = `<div class="error">❌ لم يتم العثور على المود رقم ${id}</div>`;
          return;
        }

        document.title = mod.t + ' | Minecraft Mods';

        // معالجة مسار الصورة
        const imgSrc = /^https?:\/\//.test(mod.i)
          ? mod.i
          : 'https://modslib.attdes.online/' + mod.i.replace(/^\//, '');

        // 4. عرض التصميم والبيانات
        content.innerHTML = `
          <article class="detail">
            <div class="detail-img">
              <img src="${imgSrc}" alt="${esc(mod.t)}" onerror="this.style.display='none'">
            </div>
            <div class="detail-body">
              <span class="badge">مود #${mod.n}</span>
              <h1>${esc(mod.t)}</h1>
              <p>${esc(mod.d)}</p>
              <!-- زر التحميل يوجه لصفحة التحميل داخل الـ iframe -->
              <a href="download/${mod.n}.html" class="btn">⬇ الانتقال للتحميل</a>
            </div>
          </article>
        `;
      } catch (e) {
        content.innerHTML = '<div class="error">⚠️ حدث خطأ في تحميل البيانات</div>';
        console.error(e);
      }
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    load();
  </script>
</body>
</html>
