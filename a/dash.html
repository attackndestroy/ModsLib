<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة النشر — مكتبة المودات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a; --bg-2:#111; --bg-3:#181818; --bg-4:#202020;
  --border:#262626; --border-2:#333;
  --text:#e8e8e8; --dim:#8a8a8a;
  --accent:#ffcc00; --accent-2:#ffd633; --accent-dk:#cc9900;
  --green:#00d26a; --red:#ff4757; --blue:#4d9eff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Cairo','Segoe UI',sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
  min-height:100vh; padding-bottom:60px;
}

/* ========== التحية ========== */
.hero{
  position:relative;
  padding:60px 20px 40px;
  text-align:center;
  overflow:hidden;
  background:radial-gradient(circle at 50% 0%, rgba(255,204,0,0.15) 0%, transparent 60%);
}
.hero::before{
  content:'';
  position:absolute; inset:0;
  background:
    linear-gradient(90deg, transparent 49.5%, rgba(255,204,0,0.08) 49.5%, rgba(255,204,0,0.08) 50.5%, transparent 50.5%),
    linear-gradient(0deg, transparent 49.5%, rgba(255,204,0,0.05) 49.5%, rgba(255,204,0,0.05) 50.5%, transparent 50.5%);
  background-size:40px 40px;
  opacity:0.3;
  pointer-events:none;
}
.hero-inner{position:relative; z-index:1; max-width:900px; margin:0 auto;}
.hero h1{
  font-size:clamp(1.8em, 5vw, 3em);
  font-weight:900;
  background:linear-gradient(135deg, #ffcc00 0%, #fff8dc 50%, #ffcc00 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 20px rgba(255,204,0,0.3));
  margin-bottom:10px;
  animation:shine 3s ease-in-out infinite;
  background-size:200% auto;
}
@keyframes shine{
  0%,100%{background-position:0% center;}
  50%{background-position:100% center;}
}
.hero .subtitle{
  color:var(--dim);
  font-size:1.05em;
  font-weight:600;
}
.hero .crown{
  font-size:2.5em;
  display:block;
  margin-bottom:10px;
  filter:drop-shadow(0 0 20px rgba(255,204,0,0.6));
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-8px);}
}
.hero .time-badge{
  display:inline-block;
  margin-top:15px;
  padding:6px 18px;
  background:var(--bg-3);
  border:1px solid var(--accent);
  border-radius:20px;
  font-size:0.85em;
  color:var(--accent);
  font-weight:700;
}

/* ========== الحاوية ========== */
.container{max-width:1000px;margin:0 auto;padding:0 20px;}

/* ========== الكارد ========== */
.card{
  background:var(--bg-2);
  border:1px solid var(--border);
  border-radius:14px;
  padding:25px;
  margin-bottom:22px;
}
.card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
  padding-bottom:15px;
  border-bottom:2px solid var(--accent);
  flex-wrap:wrap;
  gap:10px;
}
.card-header h2{
  color:var(--accent);
  font-size:1.3em;
  font-weight:900;
  display:flex;
  align-items:center;
  gap:10px;
}
.card-header .num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  background:var(--accent);
  color:#000;
  border-radius:50%;
  font-size:0.9em;
  font-weight:900;
}

/* ========== الحقول ========== */
label{
  display:block;
  margin-bottom:6px;
  color:var(--dim);
  font-size:0.9em;
  font-weight:600;
}
label .req{color:var(--red);}
input[type="text"],input[type="number"],input[type="password"],input[type="url"],textarea,select{
  font-family:'Cairo',sans-serif;
  font-size:1em;
  padding:11px 14px;
  border-radius:8px;
  border:1px solid var(--border-2);
  background:var(--bg-3);
  color:var(--text);
  width:100%;
  margin-bottom:14px;
  transition:border-color 0.2s;
}
input:focus,textarea:focus,select:focus{
  outline:none;
  border-color:var(--accent);
}
textarea{resize:vertical;min-height:90px;line-height:1.6;}

/* ========== الأزرار ========== */
button{
  font-family:'Cairo',sans-serif;
  font-size:1em;
  font-weight:700;
  padding:11px 24px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  transition:transform 0.15s, box-shadow 0.15s;
  margin-left:6px;
  margin-bottom:6px;
}
button:hover{transform:translateY(-1px);}
button:active{transform:translateY(0);}
.btn-primary{
  background:var(--accent);
  color:#000;
  box-shadow:0 4px 0 var(--accent-dk);
}
.btn-primary:hover{box-shadow:0 5px 0 var(--accent-dk);}
.btn-secondary{
  background:var(--bg-3);
  color:var(--accent);
  border:1.5px solid var(--accent);
}
.btn-danger{
  background:var(--bg-3);
  color:var(--red);
  border:1.5px solid var(--red);
}
.btn-green{
  background:var(--green);
  color:#000;
  box-shadow:0 4px 0 #009e4f;
}
.btn-block{width:100%; margin-left:0;}

/* ========== الحالة ========== */
.status{
  padding:12px 16px;
  border-radius:8px;
  margin:12px 0;
  font-size:0.95em;
  font-weight:600;
  display:none;
}
.status.show{display:block;}
.status.ok{background:rgba(0,210,106,0.12);color:var(--green);border:1px solid rgba(0,210,106,0.4);}
.status.err{background:rgba(255,71,87,0.12);color:var(--red);border:1px solid rgba(255,71,87,0.4);}
.status.info{background:rgba(77,158,255,0.12);color:var(--blue);border:1px solid rgba(77,158,255,0.4);}

/* ========== معاينة الصورة ========== */
.img-preview{
  display:none;
  margin:10px 0 15px;
  border-radius:10px;
  overflow:hidden;
  border:1px solid var(--border-2);
  max-width:100%;
}
.img-preview img{
  width:100%;
  max-height:280px;
  object-fit:cover;
  display:block;
}

/* ========== صندوق الـ JSON ========== */
.json-box{
  position:relative;
  background:#0d0d0d;
  border:1px solid var(--border-2);
  border-radius:10px;
  padding:18px;
  font-family:'Courier New',monospace;
  font-size:0.85em;
  color:#ffd580;
  max-height:400px;
  overflow:auto;
  white-space:pre;
  direction:ltr;
  text-align:left;
  line-height:1.5;
}
.json-box::-webkit-scrollbar{width:8px;height:8px;}
.json-box::-webkit-scrollbar-track{background:#1a1a1a;}
.json-box::-webkit-scrollbar-thumb{background:#333;border-radius:4px;}
.copy-btn{
  position:absolute;
  top:10px;
  right:10px;
  background:var(--accent);
  color:#000;
  padding:6px 14px;
  font-size:0.85em;
  border-radius:6px;
  margin:0;
}

/* ========== قائمة المودات ========== */
.mod-item{
  display:flex;
  align-items:center;
  gap:15px;
  padding:14px;
  background:var(--bg-3);
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:10px;
  transition:border-color 0.2s;
}
.mod-item:hover{border-color:var(--accent);}
.mod-item img{
  width:70px; height:70px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
  background:var(--bg-4);
}
.mod-info{flex:1; min-width:0;}
.mod-info .title{
  font-weight:700;
  color:#fff;
  margin-bottom:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.mod-info .meta{
  font-size:0.8em;
  color:var(--dim);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.mod-info .id-badge{
  display:inline-block;
  background:var(--accent);
  color:#000;
  font-size:0.7em;
  font-weight:900;
  padding:2px 8px;
  border-radius:10px;
  margin-left:5px;
}
.mod-actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}
.mod-actions button{
  padding:7px 14px;
  font-size:0.85em;
  margin:0;
}

/* ========== البحث ========== */
.search-input{
  margin-bottom:18px !important;
}

/* ========== الإعدادات ========== */
.settings-panel{
  background:var(--bg-2);
  border:2px solid var(--accent);
  border-radius:14px;
  padding:25px;
  margin-bottom:22px;
}
.settings-panel.hidden{display:none;}
.settings-panel h3{
  color:var(--accent);
  margin-bottom:15px;
  font-size:1.1em;
}
.row-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:600px){
  .row-2{grid-template-columns:1fr;}
  .mod-item{flex-wrap:wrap;}
  .mod-actions{width:100%; justify-content:flex-end;}
}

/* ========== شريط علوي ========== */
.topbar{
  position:sticky; top:0; z-index:100;
  background:rgba(10,10,10,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}
.topbar .logo{
  color:var(--accent);
  font-weight:900;
  font-size:1.1em;
}
.topbar .actions button{
  padding:8px 16px;
  font-size:0.85em;
}

/* ========== Empty ========== */
.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--dim);
}
.empty .icon{font-size:3em; margin-bottom:10px; display:block;}
</style>
</head>
<body>

<!-- ========== الشريط العلوي ========== -->
<div class="topbar">
  <div class="logo">⚙️ لوحة النشر</div>
  <div class="actions">
    <button class="btn-secondary" onclick="openSettings()">🔧 الإعدادات</button>
    <button class="btn-secondary" onclick="loadFromGitHub()">🔄 تحديث</button>
  </div>
</div>

<!-- ========== التحية ========== -->
<div class="hero">
  <div class="hero-inner">
    <span class="crown">👑</span>
    <h1 id="greeting">مرحباً بك</h1>
    <div class="subtitle" id="greetingSub">في مملكتك الخاصة لإدارة المودات</div>
    <div class="time-badge" id="timeBadge"></div>
  </div>
</div>

<div class="container">

  <!-- ========== لوحة الإعدادات ========== -->
  <div class="settings-panel hidden" id="settingsPanel">
    <h3>🔐 إعدادات الاتصال (تُحفظ مرة واحدة)</h3>

    <h4 style="color:var(--accent); margin:15px 0 10px;">GitHub</h4>
    <div class="row-2">
      <div>
        <label>Username</label>
        <input type="text" id="ghUser" placeholder="username">
      </div>
      <div>
        <label>Repository</label>
        <input type="text" id="ghRepo" placeholder="repo-name">
      </div>
    </div>
    <div class="row-2">
      <div>
        <label>Branch</label>
        <input type="text" id="ghBranch" value="main">
      </div>
      <div>
        <label>Path to a.json</label>
        <input type="text" id="ghPath" value="a/a.json">
      </div>
    </div>
    <label>Personal Access Token</label>
    <input type="password" id="ghToken" placeholder="ghp_...">

    <h4 style="color:var(--accent); margin:20px 0 10px;">Cloudinary</h4>
    <div class="row-2">
      <div>
        <label>Cloud Name</label>
        <input type="text" id="cloudName" placeholder="my-cloud">
      </div>
      <div>
        <label>Upload Preset (Unsigned)</label>
        <input type="text" id="cloudPreset" placeholder="my_preset">
      </div>
    </div>

    <div style="margin-top:15px;">
      <button class="btn-primary" onclick="saveSettings()">💾 حفظ الإعدادات</button>
      <button class="btn-secondary" onclick="closeSettings()">إلغاء</button>
    </div>
    <div class="status" id="settingsStatus"></div>
  </div>

  <!-- ========== القسم الأول: النشر ========== -->
  <div class="card">
    <div class="card-header">
      <h2><span class="num">1</span> نشر مود جديد</h2>
    </div>

    <label>العنوان <span class="req">*</span></label>
    <input type="text" id="f_title" placeholder="مثال: مود الأسلحة الحديثة">

    <label>الوصف <span class="req">*</span></label>
    <textarea id="f_desc" placeholder="وصف تفصيلي للمود..."></textarea>

    <label>الصورة <span class="req">*</span></label>
    <input type="file" id="f_image" accept="image/*" onchange="uploadImage(event)">
    <div class="img-preview" id="imgPreview">
      <img id="imgPreviewSrc" src="" alt="preview">
    </div>
    <input type="text" id="f_imageUrl" placeholder="رابط الصورة سيظهر هنا تلقائياً" readonly>

    <label>الرابط النهائي (رابط التحميل) <span class="req">*</span></label>
    <input type="text" id="f_link" placeholder="https://link.attdes.online/...">

    <label>الـ ID (اتركه فارغاً للتوليد التلقائي)</label>
    <input type="number" id="f_id" placeholder="تلقائي">

    <div style="margin-top:10px;">
      <button class="btn-primary btn-block" onclick="publishMod()">🚀 نشر المود</button>
    </div>
    <div class="status" id="publishStatus"></div>
  </div>

  <!-- ========== القسم الثاني: JSON ========== -->
  <div class="card">
    <div class="card-header">
      <h2><span class="num">2</span> محتوى a.json</h2>
      <button class="btn-secondary" onclick="downloadJson()">📦 تنزيل</button>
    </div>
    <div class="json-box">
      <button class="copy-btn" onclick="copyJson()">📋 نسخ الكل</button>
      <span id="jsonContent">جاري التحميل...</span>
    </div>
    <div class="status" id="jsonStatus"></div>
  </div>

  <!-- ========== القسم الثالث: التعديل والحذف ========== -->
  <div class="card">
    <div class="card-header">
      <h2><span class="num">3</span> تعديل أو حذف المنشورات</h2>
      <span id="modsCount" style="color:var(--dim); font-size:0.9em;"></span>
    </div>

    <input type="text" class="search-input" id="searchInput" placeholder="🔍 ابحث بالعنوان أو الـ ID..." oninput="renderModsList()">

    <div id="modsList"></div>
  </div>

</div>

<!-- ========== نافذة التعديل ========== -->
<div id="editModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; padding:20px; overflow-y:auto;">
  <div style="max-width:600px; margin:40px auto; background:var(--bg-2); border:2px solid var(--accent); border-radius:14px; padding:25px;">
    <h3 style="color:var(--accent); margin-bottom:20px;">✏️ تعديل المنشور رقم <span id="editIdLabel"></span></h3>

    <label>العنوان</label>
    <input type="text" id="edit_t">

    <label>الوصف</label>
    <textarea id="edit_d"></textarea>

    <label>الصورة (رابط)</label>
    <input type="text" id="edit_i">
    <input type="file" accept="image/*" onchange="uploadImageEdit(event)" style="margin-top:6px;">
    <div class="img-preview" id="editImgPreview">
      <img id="editImgPreviewSrc" src="" alt="preview">
    </div>

    <label>الرابط النهائي</label>
    <input type="text" id="edit_l">

    <label>الـ ID</label>
    <input type="number" id="edit_n">

    <div style="margin-top:15px;">
      <button class="btn-primary" onclick="saveEdit()">💾 حفظ التعديلات</button>
      <button class="btn-secondary" onclick="closeEdit()">إلغاء</button>
    </div>
    <div class="status" id="editStatus"></div>
  </div>
</div>

<script>
/* ============================================================
   المتغيرات العامة
   ============================================================ */
let cfg = {};
let mods = [];
let currentEditId = null;
let currentJsonSha = null;

/* ============================================================
   التحية المميزة
   ============================================================ */
function setGreeting() {
  const h = new Date().getHours();
  const g = document.getElementById('greeting');
  const s = document.getElementById('greetingSub');
  const b = document.getElementById('timeBadge');

  let text, sub, emoji;
  if (h >= 5 && h < 12) {
    text = 'صباح الخير يا ملك المودات 👑';
    sub = 'يومك مشرق بإذن الله، لننشر إبداعات جديدة';
    emoji = '🌅';
  } else if (h >= 12 && h < 17) {
    text = 'مساء النور يا زعيمنا 💛';
    sub = 'استمر في بناء إمبراطوريتك';
    emoji = '☀️';
  } else if (h >= 17 && h < 22) {
    text = 'مساء الخير يا أسطورة ✨';
    sub = 'وقت ممتاز لنشر المودات';
    emoji = '🌆';
  } else {
    text = 'سهر مبارك يا بطل 🌙';
    sub = 'لا تنسَ الراحة، صحتك أولاً';
    emoji = '🌌';
  }

  g.textContent = text;
  s.textContent = sub;

  const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const now = new Date();
  const timeStr = now.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'});
  b.textContent = `${emoji}  ${days[now.getDay()]} — ${timeStr}`;
}
setGreeting();
setInterval(setGreeting, 60000);

/* ============================================================
   الإعدادات
   ============================================================ */
function openSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.remove('hidden');
  fillSettingsForm();
  panel.scrollIntoView({behavior:'smooth', block:'start'});
}
function closeSettings() {
  document.getElementById('settingsPanel').classList.add('hidden');
}
function fillSettingsForm() {
  const saved = localStorage.getItem('attdes_cfg');
  if (!saved) return;
  try {
    const c = JSON.parse(saved);
    document.getElementById('ghUser').value = c.ghUser || '';
    document.getElementById('ghRepo').value = c.ghRepo || '';
    document.getElementById('ghBranch').value = c.ghBranch || 'main';
    document.getElementById('ghPath').value = c.ghPath || 'a/a.json';
    document.getElementById('ghToken').value = c.ghToken || '';
    document.getElementById('cloudName').value = c.cloudName || '';
    document.getElementById('cloudPreset').value = c.cloudPreset || '';
  } catch(e){}
}
function saveSettings() {
  const c = {
    ghUser: document.getElementById('ghUser').value.trim(),
    ghRepo: document.getElementById('ghRepo').value.trim(),
    ghBranch: document.getElementById('ghBranch').value.trim() || 'main',
    ghPath: document.getElementById('ghPath').value.trim() || 'a/a.json',
    ghToken: document.getElementById('ghToken').value.trim(),
    cloudName: document.getElementById('cloudName').value.trim(),
    cloudPreset: document.getElementById('cloudPreset').value.trim()
  };
  if (!c.ghUser || !c.ghRepo || !c.ghToken || !c.ghPath) {
    setStatus('settingsStatus','err','❌ أكمل بيانات GitHub على الأقل');
    return;
  }
  localStorage.setItem('attdes_cfg', JSON.stringify(c));
  cfg = c;
  setStatus('settingsStatus','ok','✅ تم حفظ الإعدادات بنجاح — لن تُطلب مرة أخرى');
  setTimeout(() => {
    closeSettings();
    loadFromGitHub();
  }, 1200);
}
function loadSettings() {
  const saved = localStorage.getItem('attdes_cfg');
  if (!saved) {
    // أول مرة → افتح الإعدادات
    openSettings();
    return false;
  }
  try {
    cfg = JSON.parse(saved);
    return true;
  } catch(e){ return false; }
}

/* ============================================================
   GitHub API
   ============================================================ */
const API = 'https://api.github.com';

async function ghGet(path) {
  const r = await fetch(`${API}/repos/${cfg.ghUser}/${cfg.ghRepo}/contents/${path}?ref=${cfg.ghBranch}&t=${Date.now()}`, {
    headers: {
      'Authorization': `token ${cfg.ghToken}`,
      'Accept': 'application/vnd.github.v3+json'
    }
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('فشل الجلب: ' + r.status);
  return r.json();
}

async function ghPut(path, contentBase64, message, shaToUse) {
  const body = { message, content: contentBase64, branch: cfg.ghBranch };
  if (shaToUse) body.sha = shaToUse;
  const r = await fetch(`${API}/repos/${cfg.ghUser}/${cfg.ghRepo}/contents/${path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `token ${cfg.ghToken}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!r.ok) {
    const err = await r.text();
    throw new Error('فشل الحفظ: ' + r.status);
  }
  return r.json();
}

/* ============================================================
   تحميل a.json
   ============================================================ */
async function loadFromGitHub() {
  if (!cfg.ghUser) return;
  setStatus('jsonStatus','info','⏳ جاري التحميل...');
  try {
    const file = await ghGet(cfg.ghPath);
    if (!file) {
      mods = [];
      currentJsonSha = null;
    } else {
      currentJsonSha = file.sha;
      const content = decodeURIComponent(escape(atob(file.content.replace(/\n/g,''))));
      mods = JSON.parse(content);
    }
    renderJson();
    renderModsList();
    setStatus('jsonStatus','ok',`✅ تم التحميل — ${mods.length} مود`);
  } catch(e) {
    setStatus('jsonStatus','err','❌ ' + e.message);
  }
}
