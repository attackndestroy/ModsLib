<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>تفاصيل الـ Mod - ATTACK N' DESTROY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --card:#141414;
    --yellow:#ffde00;
    --text:#e9e9e9;
    --muted:#9a9a9a;
    --btn-bg: rgba(255,255,255,0.03);
    --btn-border: #3a3a3a;
    --btn-text: #ffde00;
    --btn-active-bg: #ffde00;
    --btn-active-border: #ffde00;
    --btn-active-text: #0a0a0a;
    --btn-radius: 8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{
    background-color:var(--bg);
    color:var(--text);
    font-family:'Cairo', sans-serif;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,222,0,0.02) 0px, rgba(255,222,0,0.02) 2px, transparent 2px, transparent 40px),
      radial-gradient(circle at 15% 10%, rgba(255,222,0,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,222,0,0.05), transparent 45%);
    min-height:100vh;
  }
  h1,h2,h3,button,.btn{font-family:'Oswald', sans-serif;}
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  header.site-header{
    width:100%;
    background:#000;
    border-bottom:2px solid var(--yellow);
  }
  header.site-header img{
    width:100%;
    height:auto;
    aspect-ratio:1600/600;
    object-fit:cover;
    display:block;
  }

  .container{
    width:100%;
    max-width:800px;
    margin:0 auto;
    padding:16px;
  }

  .ad-320-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    margin:12px 0;
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .ad-320-wrap iframe{
    max-width:320px;
    width:100%;
    border:0;
    display:block;
    pointer-events: none !important;
    touch-action: none;
  }

  .mod-card{
    background:var(--card);
    border:1px solid #232323;
    overflow:hidden;
    margin:18px 0;
  }
  .mod-card .img-wrap{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
  }
  .mod-card .img-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .mod-card .mod-body{
    padding:22px;
    text-align:center;
  }
  .mod-card h1{
    font-size:24px;
    font-weight:700;
    color:#fff;
    margin-bottom:16px;
    line-height:1.4;
    word-break:break-word;
  }
  .mod-card .desc{
    font-size:16px;
    color:var(--text);
    line-height:1.9;
    margin-bottom:22px;
    text-align:right;
    white-space:pre-wrap;
    word-break:break-word;
  }
  .mod-card .desc:empty{display:none;}

  /* ===== الأزرار بدون أي hover ===== */
  .btn{
    display:inline-block;
    background:var(--btn-bg);
    color:var(--btn-text);
    border:1px solid var(--btn-border);
    padding:14px 26px;
    font-weight:600;
    font-size:15px;
    letter-spacing:.5px;
    cursor:pointer;
    text-align:center;
    border-radius:var(--btn-radius);
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position:relative;
    z-index:10;
    backdrop-filter: blur(2px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    min-width:200px;
  }

  /* تأثير الضغط فقط (للكل) */
  .btn:active {
    background:var(--btn-active-bg);
    border-color:var(--btn-active-border);
    color:var(--btn-active-text);
    box-shadow:0 2px 8px rgba(255,222,0,0.5);
    transform:scale(0.96);
  }

  /* ====================================================== */

  #errorBox{
    display:none;
    text-align:center;
    padding:40px 16px;
    color:var(--muted);
    font-size:16px;
  }

  footer{
    text-align:center;
    padding:26px 16px 34px;
    color:var(--muted);
    font-size:14px;
    border-top:1px solid #1e1e1e;
    margin-top:20px;
  }
  footer .accent{color:#ffde00;font-weight:700;}
  footer p{margin:4px 0;}

  @media (min-width:600px){
    .mod-card h1{font-size:28px;}
  }

  @media (max-width:480px){
    .btn{
      padding:12px 18px;
      font-size:14px;
      min-width:160px;
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <img src="/header.png" alt="ATTACK N' DESTROY">
</header>

<div class="container">

  <!-- إعلان علوي -->
  <div class="ad-320-wrap" id="adTop"></div>

  <div id="modContent"></div>

  <!-- الإعلان الأوسط (سيظهر داخل البطاقة بعد الصورة) -->
  <div class="ad-320-wrap" id="adMid" style="display:none;"></div>

  <div id="errorBox">لم يتم العثور على المنشور المطلوب.</div>

  <!-- إعلان سفلي -->
  <div class="ad-320-wrap" id="adBottom"></div>

</div>

<footer>
  <p>Copyright: <span class="accent">ATTACK N' DESROY</span></p>
  <p>Powered By: <span class="accent">ATTACK N' DESTROY</span></p>
</footer>

<script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
<script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
<script src="/stats.js"></script>

<script>
(function(){
  "use strict";

  function injectDynamicAd(container){
    var iframe = document.createElement('iframe');
    iframe.style.width = '100%';
    iframe.style.maxWidth = '320px';
    iframe.style.height = '50px';
    iframe.style.border = '0';
    iframe.style.overflow = 'hidden';
    iframe.style.pointerEvents = 'none';
    iframe.setAttribute('scrolling', 'no');
    container.appendChild(iframe);
    try{
      var doc = iframe.contentWindow.document;
      doc.open();
      doc.write('<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;}</style></head><body><script src="/320-50.js"><\/script></body></html>');
      doc.close();
      var resize = function(){
        try{
          var h = doc.body.scrollHeight;
          if (h && h > 10){ iframe.style.height = h + 'px'; }
        }catch(e){}
      };
      iframe.onload = resize;
      setTimeout(resize, 700);
      setTimeout(resize, 1600);
      setTimeout(resize, 3000);
    }catch(e){}
  }

  function getIdFromUrl(){
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    if (id === null) return null;
    var n = Number(id);
    return isNaN(n) ? id : n;
  }

  function showError(){
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('modContent').style.display = 'none';
    document.getElementById('adMid').style.display = 'none';
  }

  function render(post){
    var wrap = document.getElementById('modContent');
    var card = document.createElement('div');
    card.className = 'mod-card';

    // 1. الصورة
    var imgWrap = document.createElement('div');
    imgWrap.className = 'img-wrap';
    if (post.image){
      var img = document.createElement('img');
      img.src = post.image;
      img.alt = post.title || '';
      imgWrap.appendChild(img);
    }
    card.appendChild(imgWrap);

    // 2. الإعلان تحت الصورة (يظهر هنا)
    var adUnderImg = document.createElement('div');
    adUnderImg.className = 'ad-320-wrap';
    adUnderImg.id = 'adUnderImage';
    card.appendChild(adUnderImg);
    // سيتم حقن الإعلان فيه لاحقاً

    // 3. باقي المحتوى
    var body = document.createElement('div');
    body.className = 'mod-body';

    var h1 = document.createElement('h1');
    h1.textContent = post.title || '';
    body.appendChild(h1);

    var desc = document.createElement('div');
    desc.className = 'desc';
    desc.textContent = post.description || '';
    body.appendChild(desc);

    // 4. الإعلان فوق الزر
    var adAboveBtn = document.createElement('div');
    adAboveBtn.className = 'ad-320-wrap';
    adAboveBtn.id = 'adAboveButton';
    body.appendChild(adAboveBtn);

    // 5. الزر
    var btn = document.createElement('a');
    btn.className = 'btn';
    btn.href = '/mod.html?id=' + encodeURIComponent(post.id);
    btn.textContent = 'انتقال لصفحة التحميل';
    btn.addEventListener('click', function(e) { e.stopPropagation(); });
    btn.addEventListener('touchstart', function(e) { e.stopPropagation(); }, { passive: true });
    body.appendChild(btn);

    // 6. الإعلان تحت الزر
    var adBelowBtn = document.createElement('div');
    adBelowBtn.className = 'ad-320-wrap';
    adBelowBtn.id = 'adBelowButton';
    body.appendChild(adBelowBtn);

    card.appendChild(body);
    wrap.appendChild(card);

    // 7. حقن الإعلانات في الأماكن الثلاثة الجديدة
    injectDynamicAd(document.getElementById('adUnderImage'));
    injectDynamicAd(document.getElementById('adAboveButton'));
    injectDynamicAd(document.getElementById('adBelowButton'));

    // 8. إظهار الإعلان الأوسط (الذي كان مخفياً) – سنضعه كإعلان إضافي اختياري بين البطاقات
    var adMid = document.getElementById('adMid');
    adMid.style.display = 'flex';
    injectDynamicAd(adMid);
  }

  // === تشغيل الإعلانات العلوية والسفلية ===
  injectDynamicAd(document.getElementById('adTop'));
  injectDynamicAd(document.getElementById('adBottom'));

  var id = getIdFromUrl();
  if (id === null){
    showError();
  } else {
    fetch('/mods.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        var list = Array.isArray(data) ? data : [];
        var post = list.find(function(p){ return String(p.id) === String(id); });
        if (!post){
          showError();
        } else {
          render(post);
        }
      })
      .catch(function(){
        showError();
      });
  }

})();
</script>

</body>
</html>
