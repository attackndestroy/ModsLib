<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>ATT/DES — Minecraft Mods</title>
    <style>
        /* ===== RESET & BASE ===== */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: hidden; font-size: 16px; scroll-behavior: smooth; }
        body {
            background: #121212; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6; overflow-x: hidden; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        a { color: #f5c842; text-decoration: none; }
        a:hover { text-decoration: underline; }
        :focus-visible { outline: 2px solid #f5c842; outline-offset: 2px; border-radius: 4px; }

        /* ===== HEADER ===== */
        .site-header {
            background: #1a1a1a; padding: 0.8rem 1rem; text-align: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .header-logo { max-width: 100%; height: auto; max-height: 80px; width: auto; display: inline-block; }

        /* ===== CONTAINER ===== */
        .container { max-width: 1100px; margin: 0 auto; padding: 1rem; width: 100%; flex: 1; }

        /* ===== NATIVE BANNER & SOCIAL ===== */
        .native-banner-wrapper, .social-bar-wrapper { text-align: center; margin: 0.5rem 0; overflow: hidden; }
        .native-banner-wrapper iframe, .social-bar-wrapper iframe { max-width: 100%; }

        /* ===== BANNER 320x50 ===== */
        .banner-320x50 {
            width: 100%; max-width: 320px; margin: 0 auto; overflow: hidden;
            text-align: center; background: transparent;
        }
        .banner-320x50 iframe { max-width: 100%; height: auto; }
        .banner-between {
            margin: 1.5rem 0;
            padding: 0.5rem 0;
            text-align: center;
            background: rgba(255,255,255,0.02);
            border-radius: 8px;
        }

        /* ===== FEED CONTROLS ===== */
        .feed-controls {
            display: flex; gap: 0.5rem; margin-bottom: 1.5rem;
            flex-wrap: wrap; justify-content: center;
        }
        .btn-sort {
            background: #2a2a2a; color: #ccc; border: none;
            padding: 0.6rem 1.2rem; border-radius: 30px; font-size: 1rem;
            cursor: pointer; transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            font-weight: 500; min-height: 44px; min-width: 80px;
        }
        .btn-sort:hover { background: #3a3a3a; color: #fff; }
        .btn-sort.active {
            background: #f5c842; color: #1a1a1a; font-weight: 700;
            box-shadow: 0 2px 8px rgba(245, 200, 66, 0.3);
        }
        .btn-sort.active:hover { background: #e0b030; }

        /* ===== FEED & CARDS ===== */
        .feed { display: flex; flex-direction: column; gap: 0.5rem; }
        .mod-card {
            background: #1e1e1e; border-radius: 16px; overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        .mod-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.8); }
        .mod-card-image {
            width: 100%; background: #2a2a2a; display: flex; align-items: center; justify-content: center;
            min-height: 160px; overflow: hidden;
        }
        .mod-card-image img {
            width: 100%; height: auto; max-height: 300px; object-fit: cover; display: block;
        }
        .mod-card-image-placeholder {
            width: 100%; padding: 2rem 1rem; text-align: center; color: #888; font-size: 1.2rem;
            background: #2a2a2a;
        }
        .mod-card-title {
            font-size: 1.25rem; font-weight: 600; color: #f5c842;
            padding: 0.8rem 1rem 0.2rem; margin: 0; line-height: 1.3;
        }
        .mod-card-btn {
            display: inline-block; background: #f5c842; color: #1a1a1a;
            font-weight: 700; padding: 0.6rem 1.5rem; border-radius: 50px;
            text-align: center; transition: background 0.2s, transform 0.1s;
            border: none; cursor: pointer; font-size: 1rem; min-height: 44px; min-width: 120px;
            align-self: flex-start; margin: 0.5rem 1rem 1rem; text-decoration: none; line-height: 1.4;
        }
        .mod-card-btn:hover { background: #e0b030; text-decoration: none; transform: scale(1.02); }
        .mod-card-btn:active { transform: scale(0.97); }

        /* ===== LOAD MORE ===== */
        .load-more-wrap { text-align: center; margin: 2rem 0 1rem; }
        .btn-load-more {
            background: #2a2a2a; color: #f5c842; border: 1px solid #f5c842;
            padding: 0.7rem 2rem; border-radius: 50px; font-size: 1.1rem;
            cursor: pointer; transition: background 0.2s, color 0.2s;
            min-height: 48px; min-width: 160px;
        }
        .btn-load-more:hover { background: #f5c842; color: #1a1a1a; }

        /* ===== STATUS ===== */
        .feed-status { text-align: center; padding: 1rem; color: #aaa; font-size: 1rem; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 360px) {
            .container { padding: 0.6rem; }
            .mod-card-title { font-size: 1.1rem; padding: 0.6rem 0.8rem 0.1rem; }
            .mod-card-btn { font-size: 0.9rem; padding: 0.5rem 1.2rem; min-width: 100px; }
            .btn-sort { font-size: 0.9rem; padding: 0.4rem 0.8rem; min-width: 60px; }
        }
        @media (min-width: 600px) {
            .feed { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
            .banner-between { grid-column: 1 / -1; }
        }
        @media (min-width: 900px) {
            .feed { grid-template-columns: repeat(3, 1fr); }
            .container { padding: 1.5rem 2rem; }
            .header-logo { max-height: 100px; }
        }
        @media (min-width: 1400px) {
            .container { max-width: 1200px; }
            .feed { grid-template-columns: repeat(4, 1fr); }
        }
        img, iframe, video { max-width: 100%; height: auto; }
        * { max-width: 100%; }
    </style>
    <!-- Popup -->
    <script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
    <!-- Analytics -->
    <script src="https://modslib.attdes.online/analytics.js"></script>
</head>
<body>

    <header class="site-header">
        <a href="index.html"><img src="https://attdes.online/header.png" alt="ATT/DES Logo" class="header-logo" /></a>
    </header>

    <div class="native-banner-wrapper">
        <script async="async" data-cfasync="false" src="https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js"></script>
        <div id="container-2d6b46676c10234a8731ba94f0111059"></div>
    </div>

    <div class="social-bar-wrapper">
        <script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
    </div>

    <main class="container">
        <div class="feed-controls">
            <button class="btn-sort active" data-sort="newest">أحدث</button>
            <button class="btn-sort" data-sort="oldest">أقدم</button>
        </div>
        <div id="feed" class="feed"></div>
        <div id="load-more-wrap" class="load-more-wrap">
            <button id="btn-load-more" class="btn-load-more">إظهار المزيد</button>
        </div>
        <div id="feed-status" class="feed-status"></div>
    </main>

    <script>
        (function() {
            'use strict';

            const feedEl = document.getElementById('feed');
            const statusEl = document.getElementById('feed-status');
            const loadMoreBtn = document.getElementById('btn-load-more');
            const sortBtns = document.querySelectorAll('.btn-sort');

            let allItems = [];
            let currentSort = 'newest';
            let visibleCount = 6;
            const PAGE_SIZE = 6;

            function escapeHtml(str) {
                if (!str) return '';
                return String(str).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function isNumericId(id) {
                if (typeof id === 'number') return true;
                if (typeof id === 'string') return /^[0-9]+$/.test(id);
                return false;
            }

            function getNumericValue(id) {
                if (typeof id === 'number') return id;
                if (typeof id === 'string' && /^[0-9]+$/.test(id)) return parseInt(id, 10);
                return null;
            }

            function sortItems(items, sortOrder) {
                const numeric = items.filter(item => isNumericId(item.id));
                const text = items.filter(item => !isNumericId(item.id));

                if (sortOrder === 'newest') {
                    numeric.sort((a, b) => getNumericValue(b.id) - getNumericValue(a.id));
                } else {
                    numeric.sort((a, b) => getNumericValue(a.id) - getNumericValue(b.id));
                }
                return numeric.concat(text);
            }

            // ===== دالة إضافة Banner 320×50 بشكل موثوق =====
            function addBanner(container) {
                const wrapper = document.createElement('div');
                wrapper.className = 'banner-between';

                const bannerDiv = document.createElement('div');
                bannerDiv.className = 'banner-320x50';

                // 1. إنشاء script لتعريف atOptions
                const scriptOpt = document.createElement('script');
                scriptOpt.textContent = `
                    window.atOptions = {
                        'key' : '28d1f1f838ea883f1f7fc0d4733ebba6',
                        'format' : 'iframe',
                        'height' : 50,
                        'width' : 320,
                        'params' : {}
                    };
                `;
                bannerDiv.appendChild(scriptOpt);

                // 2. إنشاء script لتحميل invoke.js
                const scriptInvoke = document.createElement('script');
                scriptInvoke.src = 'https://www.highrevenueformat.com/28d1f1f838ea883f1f7fc0d4733ebba6/invoke.js';
                scriptInvoke.async = true;
                scriptInvoke.dataset.cfasync = 'false';
                bannerDiv.appendChild(scriptInvoke);

                wrapper.appendChild(bannerDiv);
                container.appendChild(wrapper);
            }

            function renderFeed(items) {
                const total = items.length;
                if (total === 0) {
                    feedEl.innerHTML = '';
                    statusEl.textContent = 'لا توجد منشورات.';
                    loadMoreBtn.style.display = 'none';
                    return;
                }

                const visible = items.slice(0, visibleCount);
                feedEl.innerHTML = '';

                visible.forEach(function(item, index) {
                    // === بطاقة المود ===
                    const card = document.createElement('div');
                    card.className = 'mod-card';

                    const imgDiv = document.createElement('div');
                    imgDiv.className = 'mod-card-image';
                    if (item.image) {
                        const img = document.createElement('img');
                        img.src = item.image;
                        img.alt = item.title;
                        img.loading = 'lazy';
                        imgDiv.appendChild(img);
                    } else {
                        const placeholder = document.createElement('div');
                        placeholder.className = 'mod-card-image-placeholder';
                        placeholder.textContent = item.title || 'بدون عنوان';
                        imgDiv.appendChild(placeholder);
                    }
                    card.appendChild(imgDiv);

                    const title = document.createElement('h3');
                    title.className = 'mod-card-title';
                    title.textContent = item.title || 'بدون عنوان';
                    card.appendChild(title);

                    const btn = document.createElement('a');
                    btn.className = 'mod-card-btn';
                    btn.href = 'tomod.html?id=' + encodeURIComponent(item.id);
                    btn.textContent = 'عرض التفاصيل';
                    card.appendChild(btn);

                    feedEl.appendChild(card);

                    // === إضافة Banner بين كل بطاقتين (باستثناء بعد الأخيرة) ===
                    if (index < visible.length - 1) {
                        addBanner(feedEl);
                    }
                });

                statusEl.textContent = '';
                if (visibleCount < total) {
                    loadMoreBtn.style.display = 'inline-block';
                    loadMoreBtn.textContent = 'إظهار المزيد (' + (total - visibleCount) + ' متبقي)';
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            }

            function applySortAndRender() {
                const sorted = sortItems(allItems, currentSort);
                renderFeed(sorted);
            }

            function loadData() {
                statusEl.textContent = 'جاري التحميل…';
                fetch('/mods.json')
                    .then(res => {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    })
                    .then(data => {
                        if (typeof data !== 'object' || data === null) {
                            throw new Error('JSON غير صالح');
                        }
                        const keys = Object.keys(data);
                        if (keys.length === 0) {
                            statusEl.textContent = 'لا توجد بيانات.';
                            return;
                        }
                        // تجنب التكرار: نأخذ آخر قيمة لكل مفتاح (لكن المفاتيح فريدة)
                        allItems = keys.map(key => {
                            const item = data[key];
                            return {
                                id: key,
                                title: item.title || '',
                                image: item.image || ''
                            };
                        });
                        // تصفية العناصر التي ليس لها عنوان
                        allItems = allItems.filter(item => item.title);
                        visibleCount = PAGE_SIZE;
                        applySortAndRender();
                    })
                    .catch(err => {
                        console.error(err);
                        statusEl.textContent = '⚠️ تعذر تحميل البيانات. تأكد من وجود /mods.json.';
                        feedEl.innerHTML = '';
                        loadMoreBtn.style.display = 'none';
                    });
            }

            // أحداث الأزرار
            sortBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const sort = this.dataset.sort;
                    if (sort === currentSort) return;
                    sortBtns.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentSort = sort;
                    visibleCount = PAGE_SIZE;
                    applySortAndRender();
                });
            });

            loadMoreBtn.addEventListener('click', function() {
                const total = allItems.length;
                if (visibleCount < total) {
                    visibleCount = Math.min(visibleCount + PAGE_SIZE, total);
                    applySortAndRender();
                }
            });

            loadData();
        })();
    </script>

</body>
</html>
