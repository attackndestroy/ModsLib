<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ATTACK N' DESTROY - Mods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --card:#141414;
    --yellow:#ffde00;
    --text:#e9e9e9;
    --muted:#9a9a9a;
    --btn-bg: rgba(255,255,255,0.03);
    --btn-border: #3a3a3a;
    --btn-text: #e9e9e9;
    --btn-active-bg: #ffde00;
    --btn-active-border: #ffde00;
    --btn-active-text: #0a0a0a;
    --btn-radius: 8px;
    --btn-transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{
    background-color:var(--bg);
    color:var(--text);
    font-family:'Cairo', sans-serif;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,222,0,0.02) 0px, rgba(255,222,0,0.02) 2px, transparent 2px, transparent 40px),
      radial-gradient(circle at 15% 10%, rgba(255,222,0,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255,222,0,0.05), transparent 45%);
    min-height:100vh;
  }
  h1,h2,h3,.title-font,button,.btn{
    font-family:'Oswald', sans-serif;
  }
  a{color:inherit;text-decoration:none;}
  img{max-width:100%;display:block;}

  header.site-header{
    width:100%;
    background:#000;
    border-bottom:2px solid var(--yellow);
  }
  header.site-header img{
    width:100%;
    height:auto;
    aspect-ratio:1600/600;
    object-fit:cover;
    display:block;
  }

  .container{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:16px;
  }

  .ad-banner-slot,
  .ad-320-wrap {
    pointer-events: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .ad-banner-slot iframe,
  .ad-320-wrap iframe {
    pointer-events: none !important;
    touch-action: none;
  }

  .controls-bar{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    margin-bottom:18px;
  }
  .controls-bar .search-box{
    flex:1 1 220px;
    min-width:0;
  }
  .search-box input{
    width:100%;
    background:var(--card);
    border:1px solid #2a2a2a;
    color:var(--text);
    padding:12px 16px;
    font-family:'Cairo', sans-serif;
    font-size:15px;
    border-radius:var(--btn-radius);
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  .search-box input:focus{
    border-color:var(--yellow);
    box-shadow:0 0 10px rgba(255,222,0,0.15);
  }

  /* ===== الأزرار بدون أي hover ===== */
  .btn{
    display:inline-block;
    background:var(--btn-bg);
    color:var(--btn-text);
    border:1px solid var(--btn-border);
    padding:10px 22px;
    font-weight:600;
    font-size:14px;
    letter-spacing:.3px;
    cursor:pointer;
    text-align:center;
    border-radius:var(--btn-radius);
    transition:var(--btn-transition);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position:relative;
    z-index:10;
    backdrop-filter: blur(2px);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    min-width:100px;
  }

  /* تأثير الضغط فقط (للكل) */
  .btn:active {
    background:var(--btn-active-bg);
    border-color:var(--btn-active-border);
    color:var(--btn-active-text);
    box-shadow:0 2px 8px rgba(255,222,0,0.5);
    transform:scale(0.96);
  }

  /* حالة النشاط (للأزرار المحددة) */
  .btn.active {
    background:var(--yellow);
    border-color:var(--yellow);
    color:#0a0a0a;
    box-shadow:0 0 20px rgba(255,222,0,0.25);
    font-weight:700;
  }
  .btn.active:active {
    transform:scale(0.96);
  }

  /* تنسيق أزرار "عرض التفاصيل" داخل البطاقات */
  .post-card .btn {
    min-width:160px;
    background:rgba(255,222,0,0.08);
    border-color:rgba(255,222,0,0.25);
    color:#ffde00;
    font-weight:600;
    letter-spacing:0.5px;
    backdrop-filter:blur(4px);
  }
  .post-card .btn:active {
    background:var(--btn-active-bg);
    border-color:var(--btn-active-border);
    color:#0a0a0a;
  }

  /* تنسيق زر "إظهار المزيد" */
  #loadMoreBtn {
    background:rgba(255,255,255,0.05);
    border-color:#3a3a3a;
    color:#d0d0d0;
    padding:12px 32px;
    font-size:15px;
    letter-spacing:1px;
  }
  #loadMoreBtn:active {
    background:rgba(255,222,0,0.15);
    border-color:var(--yellow);
    color:var(--yellow);
    transform:scale(0.96);
  }

  /* ====================================================== */

  .order-btns{
    display:flex;
    gap:8px;
  }

  #feed{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .post-card{
    background:var(--card);
    border:1px solid #232323;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:18px;
  }
  .post-card .img-wrap{
    width:100%;
    aspect-ratio:16/9;
    background:#000 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="9"></svg>') center/cover;
    overflow:hidden;
  }
  .post-card .img-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .post-card .post-body{
    padding:16px;
    text-align:center;
  }
  .post-card h3{
    font-size:19px;
    font-weight:600;
    color:#fff;
    margin-bottom:14px;
    line-height:1.4;
    word-break:break-word;
  }

  #loadMoreWrap{
    display:flex;
    justify-content:center;
    margin:20px 0 10px;
  }
  #noResults{
    text-align:center;
    color:var(--muted);
    padding:30px 0;
    display:none;
  }

  footer{
    text-align:center;
    padding:26px 16px 34px;
    color:var(--muted);
    font-size:14px;
    border-top:1px solid #1e1e1e;
    margin-top:20px;
  }
  footer .accent{
    color:#ffde00;
    font-weight:700;
  }
  footer p{margin:4px 0;}

  @media (min-width:600px){
    .post-card h3{font-size:21px;}
  }
  @media (min-width:900px){
    .container{padding:24px;}
  }

  @media (max-width:480px) {
    .btn {
      padding:10px 16px;
      font-size:13px;
      min-width:80px;
    }
    .post-card .btn {
      min-width:140px;
    }
    .controls-bar {
      gap:8px;
    }
    .order-btns {
      flex:1 1 100%;
    }
    .order-btns .btn {
      flex:1;
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <img src="/header.png" alt="ATTACK N' DESTROY">
</header>

<div class="container">

  <div class="ad-banner-slot" id="bannerAdSlot"></div>

  <div class="controls-bar">
    <div class="order-btns">
      <button class="btn" id="btnLatest">أحدث</button>
      <button class="btn" id="btnOldest">أقدم</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن Mod...">
    </div>
  </div>

  <div class="ad-320-wrap" id="adBeforeFirst"></div>

  <div id="feed"></div>

  <div id="noResults">لا توجد نتائج مطابقة.</div>

  <div id="loadMoreWrap">
    <button class="btn" id="loadMoreBtn">إظهار المزيد</button>
  </div>

</div>

<footer>
  <p>Copyright: <span class="accent">ATTACK N' DESROY</span></p>
  <p>Powered By: <span class="accent">ATTACK N' DESTROY</span></p>
</footer>

<script src="https://pl30972434.profitableratecpmnetwork.com/5d/cb/c4/5dcbc48828059421881a9fb4cc6cbce5.js"></script>
<script src="https://pl30972436.profitableratecpmnetwork.com/b1/ba/7f/b1ba7f77f910a4b42aa63b1b0f9fe466.js"></script>
<script src="/stats.js"></script>

<script>
(function(){
  "use strict";

  var BATCH_SIZE = 10;
  var allPosts = [];
  var currentOrder = 'desc';
  var searchTerm = '';
  var renderedCount = 0;
  var activeList = [];

  var feedEl = document.getElementById('feed');
  var loadMoreWrap = document.getElementById('loadMoreWrap');
  var loadMoreBtn = document.getElementById('loadMoreBtn');
  var noResultsEl = document.getElementById('noResults');
  var searchInput = document.getElementById('searchInput');
  var btnLatest = document.getElementById('btnLatest');
  var btnOldest = document.getElementById('btnOldest');

  function injectDynamicAd(container){
    var iframe = document.createElement('iframe');
    iframe.style.width = '100%';
    iframe.style.maxWidth = '320px';
    iframe.style.height = '50px';
    iframe.style.border = '0';
    iframe.style.overflow = 'hidden';
    iframe.style.pointerEvents = 'none';
    iframe.setAttribute('scrolling', 'no');
    container.appendChild(iframe);
    try{
      var doc = iframe.contentWindow.document;
      doc.open();
      doc.write('<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;}</style></head><body><script src="/320-50.js"><\/script></body></html>');
      doc.close();
      var resize = function(){
        try{
          var h = doc.body.scrollHeight;
          if (h && h > 10){ iframe.style.height = h + 'px'; }
        }catch(e){}
      };
      iframe.onload = resize;
      setTimeout(resize, 700);
      setTimeout(resize, 1600);
      setTimeout(resize, 3000);
    }catch(e){}
  }

  function createAdSlot(){
    var wrap = document.createElement('div');
    wrap.className = 'ad-320-wrap';
    injectDynamicAd(wrap);
    return wrap;
  }

  function injectBannerAd(){
    var slot = document.getElementById('bannerAdSlot');
    var div = document.createElement('div');
    div.id = 'container-2d6b46676c10234a8731ba94f0111059';
    slot.appendChild(div);
    var s = document.createElement('script');
    s.async = true;
    s.setAttribute('data-cfasync', 'false');
    s.src = 'https://pl30972435.profitableratecpmnetwork.com/2d6b46676c10234a8731ba94f0111059/invoke.js';
    slot.appendChild(s);
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  function buildCard(post){
    var card = document.createElement('div');
    card.className = 'post-card';

    var imgWrap = document.createElement('div');
    imgWrap.className = 'img-wrap';
    if (post.image){
      var img = document.createElement('img');
      img.src = post.image;
      img.alt = post.title || '';
      img.loading = 'lazy';
      imgWrap.appendChild(img);
    }
    card.appendChild(imgWrap);

    var body = document.createElement('div');
    body.className = 'post-body';

    var h3 = document.createElement('h3');
    h3.textContent = post.title || '';
    body.appendChild(h3);

    var btn = document.createElement('a');
    btn.className = 'btn';
    btn.href = '/tomod.html?id=' + encodeURIComponent(post.id);
    btn.textContent = 'عرض التفاصيل';

    btn.addEventListener('click', function(e) {
      e.stopPropagation();
    });
    btn.addEventListener('touchstart', function(e) {
      e.stopPropagation();
    }, { passive: true });

    body.appendChild(btn);
    card.appendChild(body);
    return card;
  }

  function getFilteredSorted(){
    var list = allPosts.slice();
    if (searchTerm){
      var term = searchTerm.toLowerCase();
      list = list.filter(function(p){
        return (p.title || '').toLowerCase().indexOf(term) !== -1;
      });
      list.sort(function(a,b){ return b.id - a.id; });
    } else {
      list.sort(function(a,b){
        return currentOrder === 'desc' ? (b.id - a.id) : (a.id - b.id);
      });
    }
    return list;
  }

  function resetAndRender(){
    feedEl.innerHTML = '';
    renderedCount = 0;
    activeList = getFilteredSorted();
    noResultsEl.style.display = activeList.length === 0 ? 'block' : 'none';
    renderNextBatch();
  }

  function renderNextBatch(){
    var slice = activeList.slice(renderedCount, renderedCount + BATCH_SIZE);
    slice.forEach(function(post){
      feedEl.appendChild(buildCard(post));
      feedEl.appendChild(createAdSlot());
    });
    renderedCount += slice.length;
    loadMoreWrap.style.display = (renderedCount < activeList.length) ? 'flex' : 'none';
  }

  loadMoreBtn.addEventListener('click', function(){
    renderNextBatch();
  });

  btnLatest.addEventListener('click', function(){
    currentOrder = 'desc';
    btnLatest.classList.add('active');
    btnOldest.classList.remove('active');
    resetAndRender();
  });

  btnOldest.addEventListener('click', function(){
    currentOrder = 'asc';
    btnOldest.classList.add('active');
    btnLatest.classList.remove('active');
    resetAndRender();
  });

  searchInput.addEventListener('input', function(){
    searchTerm = searchInput.value.trim();
    resetAndRender();
  });

  fetch('/mods.json')
    .then(function(res){ return res.json(); })
    .then(function(data){
      allPosts = Array.isArray(data) ? data : [];
      btnLatest.classList.add('active');
      injectBannerAd();
      injectDynamicAd(document.getElementById('adBeforeFirst'));
      resetAndRender();
    })
    .catch(function(){
      feedEl.innerHTML = '<div style="text-align:center;color:#9a9a9a;padding:30px 0;">تعذر تحميل المنشورات حالياً.</div>';
    });

})();
</script>

</body>
</html>
