    /* قسم التحفيز والأسهم */

      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }

    .hero-scroll p {
      font-size: 1rem;
      font-weight: bold;
      color: var(--text);
      margin-bottom: 15px;
    }

    .arrows {
      font-size: 1.5rem;
      color: var(--accent);
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(8px); }
      60% { transform: translateY(4px); }
    }

    /* حاوية الإعلانات */

    .ad-box {

      border-radius: 8px;
      padding: 10px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;

      font-weight: 900;
      font-size: 1.1rem;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.3);

    }

    .btn-dl:hover { background: var(--accent-hover); }
    .btn-dl:active { transform: scale(0.98); }

    /* شبكة السوشيال ميديا */

      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      transition: border-color 0.2s;
